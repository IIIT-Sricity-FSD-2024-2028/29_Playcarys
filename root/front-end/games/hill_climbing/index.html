<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayCarys - Hill Climbing</title>

  <script language="javascript" src="libraries/p5.js"></script>
  <script language="javascript" src="libraries/p5.dom.js"></script>
  <script language="javascript" src="libraries/Box2d.js"></script>

  <!-- A @font-face is only fetched when something uses it, and the canvas is
       invisible to that check — so ask for the faces explicitly. -->
  <script>
    if (document.fonts && document.fonts.load) {
      ['700 16px Rajdhani', '600 16px Rajdhani', '400 16px Righteous']
        .forEach(function (f) { document.fonts.load(f); });
    }
  </script>

  <script language="javascript" src="sketch.js"></script>
  <script language="javascript" src="Visuals.js"></script>
  <script language="javascript" src="Wheel.js"></script>
  <script language="javascript" src="Car.js"></script>
  <script language="javascript" src="Ground.js"></script>
  <script language="javascript" src="Pickup.js"></script>
  <script language="javascript" src="Person.js"></script>
  <script language="javascript" src="Wallet.js"></script>

  <style>
    /* Self-hosted (Google Fonts, SIL Open Font License) — no network at runtime.
       The 2D canvas renderer takes a plain family name, so these must be real
       CSS faces rather than p5 loadFont() handles. */
    @font-face {
      font-family: 'Rajdhani'; font-style: normal; font-weight: 600;
      src: url('fonts/Rajdhani-SemiBold.ttf') format('truetype'); font-display: block;
    }
    @font-face {
      font-family: 'Rajdhani'; font-style: normal; font-weight: 700;
      src: url('fonts/Rajdhani-Bold.ttf') format('truetype'); font-display: block;
    }
    @font-face {
      font-family: 'Righteous'; font-style: normal; font-weight: 400;
      src: url('fonts/Righteous-Regular.ttf') format('truetype'); font-display: block;
    }

    /* utils.js injects a shared confirm dialog and a profile popup into <body>
       for the portal pages. Those pages load the portal stylesheet, which is
       what hides them; this page does not, so the modal had no .modal-overlay
       rule and its Cancel / Confirm buttons rendered loose over the canvas.
       The game never calls confirmAction(), so they are removed outright below
       — this rule is the belt to that braces. */
    #confirm-modal, #user-profile-modal { display: none !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0b1220;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }

    /* The canvas fills the window; everything else floats on top of it. */
    #canvas { position: fixed; inset: 0; }
    #canvas canvas { display: block; width: 100% !important; height: 100% !important; }

    /* ── Top overlay bar ─────────────────────────────────────── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      gap: .75rem; padding: .6rem 1rem;
      /* The HUD lives in the top corners of the canvas, so this scrim has to
         stay narrow and fade out fast or it muddies the sky behind it. */
      background: linear-gradient(180deg, rgba(4,8,18,.55) 0%, rgba(4,8,18,.18) 55%, rgba(4,8,18,0) 100%);
      z-index: 10; pointer-events: none;
    }
    #top-bar > * { pointer-events: auto; }
    .btn {
      background: rgba(11,17,30,.72); color: #eef3fa;
      padding: .46rem 1rem; border-radius: 10px;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      font-weight: 700; font-size: .92rem; letter-spacing: .045em;
      cursor: pointer; border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
      transition: background .15s, border-color .15s, transform .08s, box-shadow .15s;
    }
    .btn:hover {
      background: rgba(32,46,72,.86); border-color: rgba(255,255,255,.32);
      box-shadow: 0 6px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .btn:active { transform: translateY(1px) scale(.98); }
    #game-title {
      color: #fff; font-family: 'Righteous', 'Segoe UI', sans-serif;
      letter-spacing: .07em; font-size: 1.12rem;
      text-shadow: 0 2px 12px rgba(0,0,0,.75), 0 0 26px rgba(120,190,255,.30);
    }
    .bar-right { display: flex; gap: .55rem; align-items: center; }
    .hint {
      color: rgba(233,241,250,.82); font-size: .82rem;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif; font-weight: 600;
      letter-spacing: .03em;
      padding: .3rem .6rem; border-radius: 7px;
      background: rgba(8,13,24,.45);
      border: 1px solid rgba(255,255,255,.08);
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    @media (max-width: 620px) { .hint { display: none; } }

    /* ── Touch pedals ────────────────────────────────────────── */
    #pedals {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-between;
      padding: 0 2.4vw 2.6vh; z-index: 20;
      pointer-events: none;
    }
    .pedal {
      pointer-events: auto; position: relative;
      width: 15vh; height: 15vh; min-width: 92px; min-height: 92px;
      max-width: 150px; max-height: 150px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.3rem; color: #fff;
      border: 2px solid rgba(255,255,255,.30);
      box-shadow: 0 8px 26px rgba(0,0,0,.45),
                  inset 0 2px 10px rgba(255,255,255,.22),
                  inset 0 -6px 14px rgba(0,0,0,.35);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      transition: transform .08s, box-shadow .12s, border-color .12s;
      text-shadow: 0 2px 8px rgba(0,0,0,.65);
    }
    #pedal-brake {
      background: radial-gradient(circle at 34% 28%, rgba(252,165,160,.62), rgba(178,26,22,.55) 62%, rgba(88,8,6,.6));
    }
    #pedal-gas {
      background: radial-gradient(circle at 34% 28%, rgba(150,246,186,.62), rgba(28,168,84,.55) 62%, rgba(6,72,32,.6));
    }
    .pedal.on {
      transform: scale(.92);
      border-color: rgba(255,255,255,.9);
    }
    #pedal-gas.on   { box-shadow: 0 0 34px rgba(74,222,128,.75), inset 0 2px 12px rgba(255,255,255,.35); }
    #pedal-brake.on { box-shadow: 0 0 34px rgba(248,113,113,.75), inset 0 2px 12px rgba(255,255,255,.35); }

    /* On a desktop with a keyboard the pedals are dead weight — two big discs
       sitting over the track that the player never presses. They stay hidden
       until a real touch happens, at which point <body> is flagged and they
       come back for good. */
    @media (hover: hover) and (pointer: fine) {
      #pedals { display: none; }
    }
    body.touching #pedals { display: flex !important; }

    /* ── Rotate hint ─────────────────────────────────────────── */
    /* Shown only on a touch device held in portrait, and only until the player
       either turns the phone or says they would rather not. Gated on
       body.touching so it can never appear on a desktop in a narrow window. */
    #rotate-hint {
      position: fixed; inset: 0; z-index: 45;
      display: none; flex-direction: column; gap: 0.9rem;
      align-items: center; justify-content: center; text-align: center;
      padding: 2rem 1.6rem;
      background: radial-gradient(circle at 50% 40%, #17325c 0%, #0a1224 62%, #060a14 100%);
      color: #dce8f6; font-family: 'Righteous', 'Segoe UI', sans-serif;
    }
    /* Orientation comes from the media query, not from a JS resize listener.
       Mobile browsers are inconsistent about firing resize/orientationchange on
       a rotate — and a hint that fails to disappear when you turn the phone is
       worse than no hint. CSS re-evaluates this with no event required. */
    @media (orientation: portrait) {
      body.touching:not(.rot-ok) #rotate-hint { display: flex; }
    }
    #rotate-hint .rot-icon {
      font-size: 3.6rem;
      animation: rot-tip 1.8s ease-in-out infinite;
    }
    @keyframes rot-tip {
      0%, 45%, 100% { transform: rotate(0deg); }
      65%, 85%      { transform: rotate(-90deg); }
    }
    #rotate-hint .rot-title { font-size: 1.25rem; letter-spacing: 0.06em; }
    #rotate-hint .rot-sub {
      font-size: 0.9rem; line-height: 1.5; max-width: 22rem;
      color: #9fb4cd; font-family: 'Segoe UI', sans-serif;
    }
    #rotate-hint .rot-btn {
      margin-top: 0.6rem; padding: 0.7rem 1.4rem;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.08); color: #dce8f6;
      font-family: 'Segoe UI', sans-serif; font-size: 0.85rem; font-weight: 600;
      cursor: pointer;
    }
    #rotate-hint .rot-btn:active { background: rgba(255,255,255,.18); }
    #rotate-hint .rot-primary {
      background: linear-gradient(135deg, #3f8ae0, #2f6fd0);
      border-color: rgba(255,255,255,.42);
      color: #fff; font-size: 1rem; font-weight: 700;
      padding: 0.85rem 1.8rem;
    }
    #rotate-hint .rot-primary:active { background: #2a63bd; }

    /* ── Boot veil ───────────────────────────────────────────── */
    /* p5 builds the terrain bodies and the sky buffer before the first frame;
       without this the player stares at a bare dark page while it happens. */
    #boot {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; gap: 1.1rem;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #17325c 0%, #0a1224 60%, #060a14 100%);
      color: #dce8f6; font-family: 'Righteous', 'Segoe UI', sans-serif;
      letter-spacing: .12em; font-size: 1.15rem;
      transition: opacity .45s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }

    /* ── Garage / vehicle select ─────────────────────────────── */
    #garage {
      position: fixed; inset: 0; z-index: 35;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.4rem; padding: 1.5rem;
      background: rgba(4,8,16,.80);
      backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
      transition: opacity .3s ease;
    }
    #garage.gone { opacity: 0; pointer-events: none; }
    #garage h2 {
      font-family: 'Righteous', 'Segoe UI', sans-serif; color: #f2f7fd;
      letter-spacing: .14em; font-size: clamp(1.1rem, 3.4vw, 1.8rem); font-weight: 400;
      text-shadow: 0 2px 20px rgba(90,170,255,.45);
    }
    #garage .rides {
      display: flex; gap: 1.1rem; flex-wrap: wrap; justify-content: center;
    }
    #garage .ride {
      width: min(290px, 84vw); padding: 1.1rem 1.1rem 1rem;
      display: flex; flex-direction: column; align-items: center; gap: .55rem;
      border-radius: 16px; cursor: pointer; text-align: center;
      background: linear-gradient(180deg, rgba(28,40,64,.92), rgba(12,18,32,.92));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      color: #e8eff8; font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      transition: transform .12s, border-color .15s, box-shadow .15s;
    }
    #garage .ride:hover {
      transform: translateY(-4px);
      border-color: rgba(120,200,255,.55);
      box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 26px rgba(70,170,255,.28);
    }
    #garage .ride:active { transform: translateY(-1px); }
    #garage .ride svg { width: 100%; max-width: 190px; height: auto; }
    #garage .ride b {
      font-family: 'Righteous', 'Segoe UI', sans-serif; font-weight: 400;
      font-size: 1.3rem; letter-spacing: .09em;
    }
    #garage .ride span { font-size: .92rem; line-height: 1.35; color: #a8bad0; font-weight: 600; }
    #garage .ride em {
      font-style: normal; font-size: .8rem; letter-spacing: .1em;
      color: #ffc53d; font-weight: 700;
    }
    #garage .tip {
      color: #93a6bd; font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      font-weight: 600; font-size: .95rem; letter-spacing: .03em; text-align: center;
    }
    #boot .bar {
      width: min(240px, 52vw); height: 4px; border-radius: 3px;
      background: rgba(255,255,255,.12); overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 38%; border-radius: 3px;
      background: linear-gradient(90deg, #46b6ff, #9ce9ff);
      animation: boot-slide 1.05s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <div id="canvas"></div>

  <div id="boot">
    <div>LOADING TRACK</div>
    <div class="bar"><i></i></div>
  </div>

  <div id="garage">
    <h2>CHOOSE YOUR RIDE</h2>
    <div class="rides">
      <button class="ride" onclick="selectVehicle('truck')">
        <svg viewBox="0 0 120 64" aria-hidden="true">
          <path d="M12 44 L12 30 L30 30 L36 16 L62 16 L64 30 L106 30 L108 44 Z" fill="#cf3229"/>
          <path d="M38 19 L60 19 L61 29 L36 29 Z" fill="#8ec4dd"/>
          <circle cx="30" cy="46" r="13" fill="#1b1b20"/><circle cx="30" cy="46" r="5" fill="#aeb6c2"/>
          <circle cx="92" cy="46" r="13" fill="#1b1b20"/><circle cx="92" cy="46" r="5" fill="#aeb6c2"/>
        </svg>
        <b>TRUCK</b>
        <span>Heavy and powerful, with brakes that barely work. Long wheelbase, top-heavy cab. Momentum decides what happens next, not you.</span>
        <em>DIFFICULTY ●●●○○</em>
      </button>
      <button class="ride" onclick="selectVehicle('bike')">
        <svg viewBox="0 0 120 64" aria-hidden="true">
          <path d="M34 46 L52 26 L74 26 L86 46" stroke="#e0483a" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M74 26 L82 14" stroke="#3b4250" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M46 28 L68 28 L64 20 L50 20 Z" fill="#f0f3f8"/>
          <circle cx="30" cy="46" r="15" fill="none" stroke="#1b1b20" stroke-width="6"/>
          <circle cx="90" cy="46" r="15" fill="none" stroke="#1b1b20" stroke-width="6"/>
        </svg>
        <b>BIKE</b>
        <span>Short, light and sharp. Strong brakes and real air control — but no wheelie assist at all, so crack the throttle on a climb and you loop out.</span>
        <em>DIFFICULTY ●●●●●</em>
      </button>
    </div>
    <p class="tip">Head hits the ground = run over. Left pedal is a BRAKE, not reverse — start slowing before the crest, not on it.</p>
  </div>

  <div id="top-bar">
    <button class="btn" id="btn-leave" onclick="history.back()">← Leave</button>
    <span id="game-title">Hill Climbing</span>
    <div class="bar-right">
      <span class="hint">← / →  or  A / D</span>
      <button class="btn" id="btn-garage" onclick="openGarage()">🏍 Garage</button>
      <button class="btn" id="btn-fs" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
  </div>

  <div id="pedals">
    <div class="pedal" id="pedal-brake">◀</div>
    <div class="pedal" id="pedal-gas">▶</div>
  </div>

  <!-- Portrait on a phone is the wrong shape for this game: the car drives to
       the RIGHT, so a tall narrow window shows almost no track ahead and the
       first hill arrives with no warning.
       Asking the player to rotate is a chore we can usually do for them — the
       primary button goes fullscreen and locks the screen to landscape, which
       needs a user gesture, which is exactly what a button is. The "turn your
       phone" wording is the fallback for browsers that refuse the lock (iOS
       Safari has no Screen Orientation lock at all). -->
  <div id="rotate-hint">
    <div class="rot-icon">📱</div>
    <div class="rot-title" id="rot-title">Hill Climbing plays sideways</div>
    <div class="rot-sub" id="rot-sub">Tap below and it will flip to landscape for you.</div>
    <button id="rotate-go" class="rot-btn rot-primary">▶ Play in landscape</button>
    <button id="rotate-dismiss" class="rot-btn">Play in portrait anyway</button>
  </div>

  <script>
    // Drop the veil once p5 has actually painted, not on a fixed timer.
    (function () {
      var boot = document.getElementById('boot');
      var tries = 0;
      var poll = setInterval(function () {
        var ready = (typeof frameCount !== 'undefined' && frameCount > 1) ||
                    (typeof car !== 'undefined' && car);
        if (ready || ++tries > 200) {
          clearInterval(poll);
          boot.classList.add('gone');
          setTimeout(function () {
            boot.remove();
            // Straight from loading into the garage, so the run only starts
            // once the player has actually chosen something.
            var g = document.getElementById('garage');
            g.style.display = 'flex';
            g.classList.remove('gone');
          }, 450);
        }
      }, 60);
    })();
  </script>

  <script src="../../data/db.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    // utils.js appends its shared modals on DOMContentLoaded. This listener is
    // registered after that one, so it runs after them and can clear up.
    document.addEventListener('DOMContentLoaded', function () {
      ['confirm-modal', 'user-profile-modal'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.remove();
      });
    });
    // Signed-out warning. The game is directly reachable without a session, and
    // a run played that way is discarded — so say so up front rather than after
    // the player has spent four minutes on a personal best.
    document.addEventListener('DOMContentLoaded', function () {
      var signedIn = false;
      try { signedIn = !!(typeof Auth !== 'undefined' && Auth.getSession() && Auth.getSession().userId); } catch (e) {}
      if (signedIn) return;
      var bar = document.querySelector('#top-bar .bar-right');
      if (!bar) return;
      var warn = document.createElement('a');
      warn.href = '../../index.html';
      warn.className = 'btn';
      warn.textContent = '⚠ Not signed in — runs won’t save';
      warn.style.cssText = 'background:rgba(120,72,6,.82);border-color:rgba(250,190,32,.55);color:#ffd970;text-decoration:none';
      bar.insertBefore(warn, bar.firstChild);
    });

    // Reveal the pedals on any device that HAS a touchscreen, decided here at
    // boot rather than left to the CSS media query alone.
    //
    // The query is `(hover: hover) and (pointer: fine)` — "a real mouse, hide
    // the pedals". Plenty of phones answer that wrongly: an Android with a
    // stylus, a browser in desktop-site mode, a few Samsung builds. On those the
    // pedals stayed hidden and the only way to summon them was to touch the
    // screen — but the screen is the canvas, and touching it does nothing
    // visible. So the game opened with no controls, no hint that controls
    // existed, and no way to discover them. That is indistinguishable from "the
    // game doesn't work on my phone".
    //
    // maxTouchPoints is the direct question and the honest answer to it.
    if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) {
      document.body.classList.add('touching');
    }

    // Kept as a backstop for anything that reports no touch support and then
    // receives a touch anyway.
    window.addEventListener('touchstart', function once() {
      document.body.classList.add('touching');
      window.removeEventListener('touchstart', once);
    }, { passive: true });

    // Whether we are in portrait is decided by the CSS media query above. This
    // only handles the two things CSS cannot: turning the phone for the player,
    // and remembering that they would rather it did not.
    (function () {
      var dismiss = document.getElementById('rotate-dismiss');
      var go      = document.getElementById('rotate-go');

      if (dismiss) {
        dismiss.addEventListener('click', function () {
          document.body.classList.add('rot-ok');   // their call, and it sticks
        });
      }

      /**
       * Put the phone in landscape.
       *
       * screen.orientation.lock() only works while the document is fullscreen,
       * and both calls need a user gesture — hence doing this from a button
       * rather than on load, where it would be rejected every time.
       *
       * @returns {Promise<boolean>} false when the browser will not do it
       *          (notably iOS Safari, which implements no orientation lock),
       *          so the caller can go back to asking.
       */
      function forceLandscape() {
        var el = document.documentElement;
        var goFs = el.requestFullscreen ? el.requestFullscreen()
                 : el.webkitRequestFullscreen ? Promise.resolve(el.webkitRequestFullscreen())
                 : Promise.reject(new Error('no fullscreen API'));

        return goFs
          .catch(function () { /* fullscreen refused — still worth trying the lock */ })
          .then(function () {
            if (!screen.orientation || !screen.orientation.lock) {
              return Promise.reject(new Error('no orientation lock'));
            }
            return screen.orientation.lock('landscape');
          })
          .then(function () { return true; })
          .catch(function () { return false; });
      }

      if (go) {
        go.addEventListener('click', function () {
          go.disabled = true;
          forceLandscape().then(function (ok) {
            go.disabled = false;
            if (ok) {
              // The media query does the rest: we are landscape now, so the
              // overlay stops matching and the game is simply there.
              return;
            }
            // Could not rotate for them — say so plainly and let them do it.
            document.getElementById('rot-title').textContent = 'Turn your phone sideways';
            document.getElementById('rot-sub').textContent =
              'This browser will not rotate the screen on its own. Turn the phone and the game starts.';
            go.style.display = 'none';
          });
        });
      }

      // p5 sizes the canvas from windowWidth/windowHeight and re-reads them in
      // windowResized(). Some mobile browsers report the OLD dimensions during
      // a rotate, so nudge p5 once the new ones have settled — otherwise the
      // game is left drawing a portrait-shaped world onto a landscape screen.
      window.addEventListener('orientationchange', function () {
        setTimeout(function () {
          if (typeof windowResized === 'function') windowResized();
        }, 200);
      });
    })();
  </script>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var tournId = params.get('tournamentId');
      if (tournId && typeof DB !== 'undefined') {
        var t = DB.tournaments.find(function(x){ return String(x.id) === String(tournId); });
        if (t) {
          document.getElementById('game-title').textContent = '🏔️ ' + t.name;
          var leaveBtn = document.getElementById('btn-leave');
          leaveBtn.textContent = '← Tournament';
          leaveBtn.onclick = function(){ window.location.href = '../../pages/player/tournaments.html?highlight=' + tournId; };
        }
      }
    })();
  </script>
</body>
</html>
