<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PlayCarys — Genre Management</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <style>
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .genre-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
      transition: all var(--trans-med);
    }

    .genre-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-brand);
      opacity: 0;
      transition: opacity var(--trans-med);
    }

    .genre-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 3px;
      background: var(--gradient-brand);
      border-radius: 0 2px 2px 0;
    }

    .genre-card:hover {
      border-color: rgba(0, 212, 255, 0.25);
      box-shadow: var(--shadow-glow);
      transform: translateY(-3px);
    }

    .genre-card:hover::before {
      opacity: 1;
    }

    .genre-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .genre-name {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .genre-usage {
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(0, 212, 255, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 99px;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .genre-def {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.6;
      min-height: 45px;
      margin-bottom: 1.25rem;
    }

    .genre-actions {
      display: flex;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-primary);
    }
  </style>
</head>

<body>
  <div id="navbar" class="navbar"></div>
  <div class="page-wrapper">
    <div class="page-content">

      <div class="page-header-row mb-3">
        <div>
          <h1>Platform Categories</h1>
          <p class="text-muted">Manage the taxonomies and genres that organize PlayCarys games</p>
        </div>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap">
          <button class="btn" style="background: rgba(255,255,255,0.08); color: var(--text-primary); border: 1px solid var(--border-primary);" onclick="navigate('dashboard')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Dashboard
          </button>
          <button class="btn btn-primary" onclick="openAddModal()">+ Create New Genre</button>
        </div>
      </div>

      <div id="genres-container" class="genre-grid"></div>

    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="genre-modal">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Create Genre</h3>
        <span class="modal-close" onclick="Modal.close('genre-modal')">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Genre Name</label>
          <input type="text" id="genre-name" class="form-input" placeholder="e.g. Tactical Simulation">
        </div>
        <div class="form-group">
          <label>Definition / Description</label>
          <textarea id="genre-desc" class="form-textarea"
            placeholder="Provide a clear definition for publishers and players..." style="height:100px"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('genre-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveGenre()">Save Category</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../data/db.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/player-skin.js"></script>
  <script>
    // navigate() provided globally by utils.js

    let editingId = null;

    function render() {
      const container = document.getElementById('genres-container');
      const genres = DB.genres;

      container.innerHTML = genres.map(g => {
        const usageCount = DB.games.filter(gm => gm.genre_id === g.id).length;
        return `
    <div class="genre-card">
      <div class="genre-card-header">
        <div class="genre-name">${g.name}</div>
        <span class="genre-usage">📦 ${usageCount} game${usageCount !== 1 ? 's' : ''}</span>
      </div>
      <div class="genre-def">${g.definition || 'No definition provided.'}</div>
      <div class="genre-actions">
        <button class="btn btn-sm btn-ghost" onclick="openEditModal(${g.id})">✏️ Edit</button>
        ${usageCount === 0 ? `<button class="btn btn-sm btn-ghost" style="color:var(--accent-red)" onclick="deleteGenre(${g.id})">🗑️ Delete</button>` : ''}
      </div>
    </div>`;
      }).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Create New Genre';
      document.getElementById('genre-name').value = '';
      document.getElementById('genre-desc').value = '';
      Modal.open('genre-modal');
    }

    function openEditModal(id) {
      const g = DB.genres.find(x => x.id === id);
      if (!g) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'Edit Genre';
      document.getElementById('genre-name').value = g.name;
      document.getElementById('genre-desc').value = g.definition || '';
      Modal.open('genre-modal');
    }

    function saveGenre() {
      const name = document.getElementById('genre-name').value.trim();
      const definition = document.getElementById('genre-desc').value.trim();

      if (!name || !definition) {
        Toast.error("Both Name and Definition are required.");
        return;
      }

      if (editingId) {
        const g = DB.genres.find(x => x.id === editingId);
        g.name = name;
        g.definition = definition;
        Toast.success("Genre updated successfully!");
      } else {
        const newId = DB.genres.length ? Math.max(...DB.genres.map(x => x.id)) + 1 : 1;
        DB.genres.push({ id: newId, name, definition });
        Toast.success("New platform category created!");
      }

      DB.save();
      Modal.close('genre-modal');
      render();
    }

    function deleteGenre(id) {
      confirmAction("Delete Category?", "Are you sure you want to remove this category from the platform? This cannot be undone.", () => {
        DB.genres = DB.genres.filter(x => x.id !== id);
        DB.save();
        Toast.info("Genre removed.");
        render();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.requireAuth(['publisher', 'admin', 'superuser']);
      if (!session) return;
      buildNavbar(session.role, 'dashboard');
      render();
    });
  </script>
</body>

</html>
