<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayCarys Chess</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg:        #1a1814;
      --surface:   #242019;
      --panel:     #1e1c17;
      --border:    #2e2b24;
      --border2:   #3a3730;
      --green:     #7fa650;
      --green-glow:#a5d16a;
      --gold:      #e8c96a;
      --red:       #e05555;
      --text:      #e8e4dc;
      --muted:     #8a847a;
      --faint:     #4a4640;
      --light-sq:  #f0d9b5;
      --dark-sq:   #b58863;
      --last-move-light: #cdd16f;
      --last-move-dark:  #aaa23a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top Nav ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .topnav-logo {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .topnav-logo .logo-piece { font-size: 1.3rem; }
    .topnav-logo span { color: var(--green-glow); }
    .topnav-meta {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-weight: 600;
      text-transform: uppercase;
    }
    .topnav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .mode-badge {
      background: rgba(127,166,80,0.12);
      border: 1px solid rgba(127,166,80,0.3);
      color: var(--green-glow);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }

    /* ── Main Layout ── */
    .game-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 1rem 1.25rem;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    /* ── Board Column ── */
    .board-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }

    /* ── Player Plate ── */
    .player-plate {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.5rem;
      gap: 0.75rem;
    }
    .player-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }
    .player-avatar {
      width: 38px; height: 38px;
      border-radius: 8px;
      background: var(--surface);
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: border-color 0.3s;
    }
    .player-avatar img { width: 26px; height: 26px; }
    .player-details { min-width: 0; }
    .player-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .player-rating {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
    }
    .player-captured {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 80px;
    }
    .cap-piece { font-size: 0.82rem; line-height: 1; }
    .material-adv {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--green-glow);
      margin-left: 2px;
    }

    /* ── Timer ── */
    .timer-box {
      font-family: 'DM Mono', monospace;
      font-size: 1.35rem;
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: 7px;
      min-width: 82px;
      text-align: center;
      letter-spacing: 0.04em;
      transition: background 0.25s, color 0.25s;
      flex-shrink: 0;
    }
    .timer-active  { background: #fff; color: #111; }
    .timer-idle    { background: #2a2720; color: var(--faint); border: 1px solid var(--border2); }
    .timer-danger  {
      background: var(--red);
      color: #fff;
      animation: timerPulse 0.7s ease-in-out infinite;
    }
    @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

    /* ── Board Frame ── */
    .board-frame {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--border),
        0 8px 32px rgba(0,0,0,0.6),
        0 2px 8px rgba(0,0,0,0.4);
    }
    #myBoard {
      width: min(500px, calc(100vh - 200px));
      display: block;
    }
    /* Override chessboard.js light/dark squares */
    .white-1e1d7 { background: var(--light-sq) !important; }
    .black-3c85d { background: var(--dark-sq) !important; }

    /* ── Highlight last move squares ── */
    .highlight-white { background: var(--last-move-light) !important; }
    .highlight-black { background: var(--last-move-dark) !important; }

    /* ── Check highlight ── */
    .king-in-check { background: rgba(220,50,50,0.7) !important; }

    /* ── Rank/File Labels ── */
    .board-labels {
      display: grid;
      position: absolute;
      pointer-events: none;
    }

    /* ── Status Bar ── */
    .status-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.3rem 0.5rem;
      min-height: 28px;
    }
    .status-check {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: rgba(220,60,60,0.12);
      border: 1px solid rgba(220,60,60,0.35);
      border-radius: 5px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f08080;
      animation: shakeX 0.4s ease;
    }
    .status-check.show { display: flex; }
    @keyframes shakeX {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-5px)}
      75%{transform:translateX(5px)}
    }
    .status-review {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: rgba(127,166,80,0.08);
      border: 1px solid rgba(127,166,80,0.25);
      border-radius: 5px;
      padding: 0.2rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
    }
    .status-review.show { display: flex; }

    /* ── Turn indicator ── */
    .turn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      transition: background 0.3s;
      display: inline-block;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: min(540px, calc(100vh - 80px));
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Sora', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.7rem 0.4rem;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 12%; right: 12%;
      height: 2px;
      background: var(--green);
      border-radius: 1px 1px 0 0;
    }
    .tab-btn:hover:not(.active) { color: #bbb; background: rgba(255,255,255,0.02); }

    /* ── Tab Content ── */
    .tab-pane { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .tab-pane.active { display: flex; }

    /* ── Draw offer ── */
    .draw-offer-bar {
      display: none;
      margin: 0.5rem 0.6rem 0;
      background: rgba(232,201,106,0.07);
      border: 1px solid rgba(232,201,106,0.3);
      border-radius: 7px;
      padding: 0.55rem 0.8rem;
      font-size: 0.78rem;
      color: var(--gold);
    }
    .draw-offer-bar.show { display: block; }
    .draw-offer-label { font-weight: 700; margin-bottom: 0.4rem; }
    .draw-offer-btns { display: flex; gap: 0.4rem; }
    .draw-yes, .draw-no {
      flex: 1;
      border: none;
      border-radius: 5px;
      padding: 0.3rem;
      font-family: 'Sora', sans-serif;
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .draw-yes { background: #2e6018; color: var(--green-glow); }
    .draw-yes:hover { filter: brightness(1.2); }
    .draw-no { background: rgba(220,60,60,0.12); color: #f08080; border: 1px solid rgba(220,60,60,0.25); }
    .draw-no:hover { filter: brightness(1.2); }

    /* ── Moves List ── */
    .moves-scroll {
      flex: 1;
      overflow-y: auto;
      background: #161410;
      min-height: 0;
    }
    .moves-scroll::-webkit-scrollbar { width: 4px; }
    .moves-scroll::-webkit-scrollbar-track { background: transparent; }
    .moves-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .move-row {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #1e1c18;
    }
    .move-num {
      width: 34px;
      background: #1a1815;
      color: var(--faint);
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      border-right: 1px solid #1e1c18;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .move-ply {
      flex: 1;
      padding: 0.42rem 0.65rem;
      font-size: 0.83rem;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      color: #c8c4bc;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      border-right: 1px solid #1e1c18;
    }
    .move-ply:last-child { border-right: none; }
    .move-ply:hover { background: #242018; color: #fff; }
    .move-ply.active { background: rgba(127,166,80,0.18); color: #d8f0a8; }
    .move-ply.empty { color: transparent; cursor: default; pointer-events: none; }

    .moves-empty {
      color: var(--faint);
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: 0.78rem;
      font-style: italic;
    }

    /* ── Controls ── */
    .controls-panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .playback-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .pb-btn {
      width: 36px; height: 32px;
      background: var(--panel);
      border: 1px solid var(--border2);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s;
    }
    .pb-btn:hover { background: var(--border2); color: var(--text); border-color: var(--faint); }
    .pb-btn:active { transform: scale(0.93); }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.65rem;
      gap: 0.35rem;
    }
    .act-left { display: flex; gap: 0.35rem; }
    .act-btn {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: #b0a99f;
      font-family: 'Sora', sans-serif;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 0.38rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .act-btn:hover { color: #fff; background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); }
    .act-btn.draw:hover { color: var(--gold); border-color: rgba(232,201,106,0.4); background: rgba(232,201,106,0.06); }
    .act-btn.resign:hover { color: #f08080; border-color: rgba(220,60,60,0.4); background: rgba(220,60,60,0.06); }
    .act-btn.exit { color: var(--green); border-color: rgba(127,166,80,0.35); background: rgba(127,166,80,0.06); }
    .act-btn.exit:hover { background: rgba(127,166,80,0.12); }

    /* ── Chat ── */
    .chat-history {
      flex: 1;
      padding: 0.75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 0;
    }
    .chat-history::-webkit-scrollbar { width: 4px; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .chat-msg { font-size: 0.8rem; line-height: 1.5; color: #c8c4bc; }
    .chat-name { font-weight: 800; margin-right: 0.3rem; }
    .chat-name.me { color: #fff; }
    .chat-name.opp { color: var(--green); }
    .chat-sys {
      text-align: center;
      font-size: 0.7rem;
      color: var(--gold);
      font-style: italic;
      padding: 0.15rem 0;
      opacity: 0.85;
    }
    .chat-empty {
      color: var(--faint);
      font-size: 0.75rem;
      text-align: center;
      font-style: italic;
      padding: 2rem 1rem;
    }
    .chat-input-row {
      display: flex;
      background: #141210;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-inp {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 0.8rem;
      padding: 0.7rem 0.75rem;
      outline: none;
    }
    .chat-inp::placeholder { color: var(--faint); }
    .chat-send {
      background: transparent;
      border: none;
      color: var(--green);
      cursor: pointer;
      padding: 0 0.75rem;
      font-size: 1rem;
      transition: color 0.15s;
    }
    .chat-send:hover { color: var(--green-glow); }

    /* ── Game Over Overlay ── */
    #go-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #go-overlay.show { display: flex; }

    .go-card {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 2.5rem 2.8rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      animation: popUp 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popUp {
      from { transform: scale(0.72) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .go-icon { font-size: 3.8rem; margin-bottom: 0.65rem; line-height: 1; }
    .go-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .go-reason {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
    .go-score {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.6rem;
    }
    .go-score-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1.1rem;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }
    .go-score-box strong { display: block; font-size: 1.05rem; color: var(--text); font-weight: 800; }
    .go-btns { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    .go-btn {
      padding: 0.62rem 1.3rem;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .go-ghost {
      background: rgba(255,255,255,0.05);
      color: #bbb;
      border: 1px solid rgba(255,255,255,0.13);
    }
    .go-ghost:hover { background: rgba(255,255,255,0.11); }
    .go-primary {
      background: linear-gradient(135deg, #7fa650, #5a8632);
      color: #fff;
    }
    .go-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .go-rematch {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      box-shadow: 0 4px 14px rgba(217,119,6,0.3);
    }
    .go-rematch:hover { filter: brightness(1.1); transform: translateY(-1px); }

    /* ── Mode Select Overlay ── */
    #mode-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      z-index: 10001;
      align-items: center;
      justify-content: center;
    }
    #mode-overlay.hidden { display: none; }
    .mode-card {
      background: #242019;
      border: 1px solid #3a3730;
      border-radius: 18px;
      padding: 2.5rem 2.8rem;
      text-align: center;
      max-width: 460px;
      width: 92%;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8);
      animation: popUp 0.38s cubic-bezier(0.34,1.56,0.64,1);
    }
    .mode-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      color: #e8e4dc;
    }
    .mode-title span { color: #a5d16a; }
    .mode-sub {
      font-size: 0.82rem;
      color: #8a847a;
      margin-bottom: 2rem;
    }
    .mode-name-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.6rem;
    }
    .mode-name-group {
      flex: 1;
      text-align: left;
    }
    .mode-name-group label {
      font-size: 0.72rem;
      color: #8a847a;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.35rem;
    }
    .mode-name-group input {
      width: 100%;
      background: #1a1814;
      border: 1px solid #3a3730;
      border-radius: 7px;
      color: #e8e4dc;
      font-family: 'Sora', sans-serif;
      font-size: 0.85rem;
      padding: 0.55rem 0.75rem;
      outline: none;
    }
    .mode-name-group input:focus { border-color: #7fa650; }
    .mode-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    .mode-btn {
      padding: 1rem 0.6rem;
      border-radius: 12px;
      border: 2px solid #3a3730;
      background: #1a1814;
      color: #e8e4dc;
      font-family: 'Sora', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .mode-btn .m-icon { font-size: 2.2rem; }
    .mode-btn:hover { border-color: #7fa650; background: rgba(127,166,80,0.1); color: #a5d16a; }
    .mode-btn.ai-btn:hover { border-color: #e8c96a; background: rgba(232,201,106,0.08); color: #e8c96a; }

    /* ── Confirm Dialog ── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.show { display: flex; }
    .confirm-card {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 1.8rem 2rem;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: popUp 0.3s ease;
    }
    .confirm-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .confirm-msg {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
      line-height: 1.55;
    }
    .confirm-btns { display: flex; gap: 0.5rem; justify-content: center; }
    .confirm-cancel {
      flex: 1;
      padding: 0.55rem;
      border-radius: 7px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: #aaa;
      font-family: 'Sora', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .confirm-cancel:hover { background: rgba(255,255,255,0.1); }
    .confirm-ok {
      flex: 1;
      padding: 0.55rem;
      border-radius: 7px;
      background: var(--red);
      border: none;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .confirm-ok:hover { filter: brightness(1.1); }

    /* ── Toast ── */
    #toast-stack {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 0.4rem;
      z-index: 10000;
      pointer-events: none;
    }
    .toast {
      background: #2c2920;
      border: 1px solid var(--border2);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease forwards;
      white-space: nowrap;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.info    { border-left: 3px solid #6ab0d4; }
    .toast.warning { border-left: 3px solid var(--gold); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Promotion Dialog ── */
    #promo-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 9997;
      align-items: center;
      justify-content: center;
    }
    #promo-overlay.show { display: flex; }
    .promo-card {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: popUp 0.3s ease;
    }
    .promo-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .promo-pieces {
      display: flex;
      gap: 0.5rem;
    }
    .promo-piece {
      width: 64px; height: 64px;
      background: var(--surface);
      border: 2px solid var(--border2);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .promo-piece:hover { background: var(--border2); border-color: var(--green); transform: translateY(-2px); }
    .promo-piece img { width: 48px; height: 48px; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .sidebar { width: 260px; }
      #myBoard { width: min(380px, calc(100vw - 300px)); }
    }
    @media (max-width: 640px) {
      .game-wrap { flex-direction: column; padding: 0.5rem; overflow-y: auto; }
      .sidebar { width: 100%; height: 280px; flex-shrink: 0; }
      #myBoard { width: min(360px, 96vw); }
    }

    /* ── Chessboard custom square highlights ── */
    .square-55d63 { transition: background 0.07s; }
    .highlight-from { box-shadow: inset 0 0 0 3px rgba(200,220,100,0.75) !important; }
    .highlight-to   { background-color: rgba(200,220,100,0.45) !important; }
  </style>
</head>
<body>

<!-- Top Nav -->
<nav class="topnav">
  <div class="topnav-logo">
    <span class="logo-piece">♟</span>
    Play<span>Carys</span>
  </div>
  <div class="topnav-meta" id="nav-meta">10+0 · Casual</div>
  <div class="topnav-right">
    <span class="mode-badge" id="nav-mode">In Progress</span>
  </div>
</nav>

<!-- Main -->
<div class="game-wrap">

  <!-- Board Column -->
  <div class="board-col" id="board-col">

    <!-- Top Player (Opponent) -->
    <div class="player-plate" id="top-plate">
      <div class="player-left">
        <div class="player-avatar" id="top-avatar">👤</div>
        <div class="player-details">
          <div class="player-name" id="top-name">Opponent</div>
          <div class="player-rating" id="top-rating">1200</div>
        </div>
      </div>
      <div class="player-captured" id="top-captured"></div>
      <div class="timer-box timer-idle" id="top-timer">10:00</div>
    </div>

    <!-- Board -->
    <div class="board-frame">
      <div id="myBoard"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-check" id="check-bar">⚠ CHECK</div>
      <div class="status-review" id="review-bar">👁 Review Mode</div>
    </div>

    <!-- Bottom Player (You) -->
    <div class="player-plate" id="bottom-plate">
      <div class="player-left">
        <div class="player-avatar" id="bottom-avatar">👤</div>
        <div class="player-details">
          <div class="player-name" id="bottom-name">You</div>
          <div class="player-rating" id="bottom-rating">1200</div>
        </div>
      </div>
      <div class="player-captured" id="bottom-captured"></div>
      <div class="timer-box timer-active" id="bottom-timer">10:00</div>
    </div>

  </div><!-- /board-col -->

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-moves-btn" onclick="switchTab('moves')">♟ Moves</button>
      <button class="tab-btn" id="tab-chat-btn" onclick="switchTab('chat')">💬 Chat</button>
    </div>

    <!-- Moves Tab -->
    <div class="tab-pane active" id="tab-moves">
      <!-- Draw Offer -->
      <div class="draw-offer-bar" id="draw-bar">
        <div class="draw-offer-label">½ Opponent offers a Draw</div>
        <div class="draw-offer-btns">
          <button class="draw-yes" onclick="respondDraw(true)">✓ Accept</button>
          <button class="draw-no" onclick="respondDraw(false)">✗ Decline</button>
        </div>
      </div>

      <!-- Move history -->
      <div class="moves-scroll" id="moves-list">
        <div class="moves-empty">Game hasn't started yet.</div>
      </div>

      <!-- Controls -->
      <div class="controls-panel">
        <div class="playback-row">
          <button class="pb-btn" onclick="navMove('start')" title="First move">⏮</button>
          <button class="pb-btn" onclick="navMove('prev')"  title="Previous">◀</button>
          <button class="pb-btn" onclick="navMove('next')"  title="Next">▶</button>
          <button class="pb-btn" onclick="navMove('end')"   title="Last move">⏭</button>
          <button class="pb-btn" onclick="board&&board.flip()" title="Flip board" style="margin-left:4px;">⇌</button>
        </div>
        <div class="action-row">
          <div class="act-left">
            <button class="act-btn draw" id="btn-draw" onclick="offerDraw()">½ Draw</button>
            <button class="act-btn resign" id="btn-resign" onclick="doResign()">🏳 Abort</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Tab -->
    <div class="tab-pane" id="tab-chat">
      <div class="chat-history" id="chat-history">
        <div class="chat-empty">Say hi to your opponent 👋</div>
      </div>
      <div class="chat-input-row">
        <input class="chat-inp" id="chat-inp" placeholder="Type a message…"
          onkeypress="if(event.key==='Enter')sendChat()">
        <button class="chat-send" onclick="sendChat()">➤</button>
      </div>
    </div>
  </div><!-- /sidebar -->

</div><!-- /game-wrap -->

<!-- Game Over Overlay -->
<div id="go-overlay">
  <div class="go-card">
    <div class="go-icon" id="go-icon">🏆</div>
    <div class="go-title" id="go-title">Game Over</div>
    <div class="go-reason" id="go-reason"></div>
    <div class="go-score" id="go-score"></div>
    <div class="go-btns" id="go-btns"></div>
  </div>
</div>

<!-- Mode Select Overlay -->
<div id="mode-overlay">
  <div class="mode-card">
    <div class="mode-title">♟ Play<span>Carys</span> Chess</div>
    <div class="mode-sub">Set player names and choose your game mode</div>
    <div class="mode-name-row" id="mode-name-row">
      <div class="mode-name-group">
        <label>⬜ White Player</label>
        <input id="inp-white" type="text" value="White" maxlength="18" placeholder="White's name">
      </div>
      <div class="mode-name-group" id="black-name-group">
        <label>⬛ Black Player</label>
        <input id="inp-black" type="text" value="Black" maxlength="18" placeholder="Black's name">
      </div>
    </div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="startGame('2p')">
        <span class="m-icon">👥</span>
        2-Player Local
        <span style="font-size:0.7rem;color:#8a847a;font-weight:600">Same screen</span>
      </button>
      <button class="mode-btn ai-btn" onclick="startGame('ai')">
        <span class="m-icon">🤖</span>
        vs Computer
        <span style="font-size:0.7rem;color:#8a847a;font-weight:600">Play against AI</span>
      </button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title" id="confirm-title">Confirm</div>
    <div class="confirm-msg" id="confirm-msg">Are you sure?</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-ok" id="confirm-ok">OK</button>
    </div>
  </div>
</div>

<!-- Promotion Dialog -->
<div id="promo-overlay">
  <div class="promo-card">
    <div class="promo-title">Choose Promotion</div>
    <div class="promo-pieces" id="promo-pieces"></div>
  </div>
</div>

<!-- Toast Stack -->
<div id="toast-stack"></div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
var board      = null;
var game       = new Chess();
var viewGame   = new Chess();
var viewIndex  = -1;         // -1 = live
var myColor    = 'w';        // only meaningful in AI/online mode
var gameMode   = 'ai';       // '2p', 'ai', or 'online'
var isReview   = false;
var timerInt   = null;
var gameEnded  = false;
var pendingPromo = null;     // { source, target, resolve }

// Online mode - Quick Play competitive state
var onlineSid   = null;      // session id from URL
var onlineMoveKey = null;    // localStorage key for move sync

// Simulated game state
var state = {
  whiteTime: 600,
  blackTime: 600,
  lastMoveTs: Date.now(),
  deadline: null,         // New: Deadline for the active turn (Unix TS)
  turn: 'w',
  drawOffer: null,
  result: null,
  chat: [],
  lastFrom: null,
  lastTo: null
};

// Player info
var players = {
  white: { name: 'White', rating: 1200 },
  black: { name: 'Black', rating: 1200 }
};

// ── Mode Select ────────────────────────────────────────────
function startGame(mode, opts) {
  opts = opts || {};
  gameMode = mode;

  if (mode === 'online') {
    // Competitive quick play — each tab owns one color
    myColor = opts.color || 'w';  // 'w' for host, 'b' for guest
    players.white = { name: opts.whiteName || 'White', rating: opts.whiteRating || 1200 };
    players.black = { name: opts.blackName || 'Black', rating: opts.blackRating || 1200 };
    onlineSid     = opts.sid;
    onlineMoveKey = 'chess_move_' + opts.sid;

    // Listen for opponent moves via localStorage
    window.addEventListener('storage', onOnlineStorageEvent);

    // MASTER SYNC: Pull session start_ts from DB
    try {
      var dbRaw = localStorage.getItem('playcarys_db');
      if (dbRaw) {
        var db = JSON.parse(dbRaw);
        var sess = (db.sessions || []).find(function(s) { 
          return String(s.session_id || s.id) === String(opts.sid); 
        });
        if (sess && sess.start_ts) {
          state.lastMoveTs = sess.start_ts;
          // Set initial deadline for White
          state.deadline = sess.start_ts + (state.whiteTime * 1000);
        }
      }
    } catch(e) {}
  } else {
    var wName = document.getElementById('inp-white').value.trim() || 'White';
    var bName = mode === 'ai'
      ? 'Computer'
      : (document.getElementById('inp-black').value.trim() || 'Black');
    players.white = { name: wName, rating: 1200 };
    players.black = { name: bName, rating: 1200 };
    myColor = 'w';
  }

  document.getElementById('mode-overlay').classList.add('hidden');

  if (!board) {
    initBoard();
  } else {
    resetAll();
  }

  if (mode === 'online') {
    _initSyncChannel(); // Setup BroadcastChannel
    _loadGameState();   // Load from localStorage as anchor
  } else {
    state.lastMoveTs = Date.now();
    startTimer();
  }

  // Update nav badge
  if (mode === 'online') {
    document.getElementById('nav-mode').textContent = '⚡ Quick Play';
    document.getElementById('nav-meta').textContent = 'Competitive · 10+0';
    // Flip board to face your color
    if (board) board.orientation(myColor === 'w' ? 'white' : 'black');
  } else {
    document.getElementById('nav-mode').textContent = mode === '2p' ? '2-Player' : 'vs AI';
  }
}

// ── Online Move Sync via localStorage ──────────────────────
function broadcastMove(move) {
  var payload = JSON.stringify({
    fen: game.fen(),
    from: move.from,
    to: move.to,
    promotion: move.promotion || null,
    timers: { w: state.whiteTime, b: state.blackTime, ts: state.lastMoveTs }
  });
  localStorage.setItem(onlineMoveKey, payload);
}

function onOnlineStorageEvent(e) {
  if (e.key !== onlineMoveKey || !e.newValue) return;
  if (gameEnded || game.game_over()) return;

  // Only process if it is NOT my turn (i.e. opponent just moved)
  if (game.turn() === myColor) return;

  try {
    var data = JSON.parse(e.newValue);
    _applyStateBundle(data);
  } catch(err) { console.warn('[Online] Move sync error', err); }
}

// ═══════════════════════════════════════════════════════════
// PIECE VALUES for material advantage
// ═══════════════════════════════════════════════════════════
var PIECE_VAL = { p:1, n:3, b:3, r:5, q:9 };

function getMaterial() {
  // Count captured pieces from move history perspective
  var fen = game.fen().split(' ')[0];
  var counts = { w:{p:0,n:0,b:0,r:0,q:0,k:0}, b:{p:0,n:0,b:0,r:0,q:0,k:0} };
  for (var ch of fen) {
    if (ch === '/') continue;
    if (!isNaN(ch)) continue;
    var c = ch === ch.toUpperCase() ? 'w' : 'b';
    counts[c][ch.toLowerCase()]++;
  }
  var start = { p:8, n:2, b:2, r:2, q:1, k:1 };
  var captured = { w:{}, b:{} };
  for (var pc of ['p','n','b','r','q']) {
    captured.w[pc] = start[pc] - counts.w[pc]; // captured by black
    captured.b[pc] = start[pc] - counts.b[pc]; // captured by white
  }
  return captured;
}

function renderCaptures() {
  var cap = getMaterial();
  // bottom = myColor captured pieces (shown for opponent who captured them)
  // top    = opponent's captures
  var myCapHTML = '';
  var oppCapHTML = '';
  var myScore = 0, oppScore = 0;

  for (var pc of ['q','r','b','n','p']) {
    var sym = { q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
    var wsym= { q:'♕', r:'♖', b:'♗', n:'♘', p:'♙' };
    // pieces captured by white (shown below board next to my plate)
    if (myColor === 'w') {
      for (var i=0; i<(cap.b[pc]||0); i++) myCapHTML += `<span class="cap-piece">${wsym[pc]}</span>`;
      myScore += (cap.b[pc]||0) * PIECE_VAL[pc];
      for (var i=0; i<(cap.w[pc]||0); i++) oppCapHTML += `<span class="cap-piece">${sym[pc]}</span>`;
      oppScore += (cap.w[pc]||0) * PIECE_VAL[pc];
    } else {
      for (var i=0; i<(cap.w[pc]||0); i++) myCapHTML += `<span class="cap-piece">${sym[pc]}</span>`;
      myScore += (cap.w[pc]||0) * PIECE_VAL[pc];
      for (var i=0; i<(cap.b[pc]||0); i++) oppCapHTML += `<span class="cap-piece">${wsym[pc]}</span>`;
      oppScore += (cap.b[pc]||0) * PIECE_VAL[pc];
    }
  }
  var myAdv = myScore - oppScore;
  if (myAdv > 0) myCapHTML += `<span class="material-adv">+${myAdv}</span>`;
  else if (myAdv < 0) oppCapHTML += `<span class="material-adv">+${-myAdv}</span>`;

  document.getElementById('bottom-captured').innerHTML = myCapHTML;
  document.getElementById('top-captured').innerHTML    = oppCapHTML;
}

// ═══════════════════════════════════════════════════════════
// BOARD INIT
// ═══════════════════════════════════════════════════════════
function updatePlayerPlates() {
  // In 2p mode, always show White at bottom, Black at top
  // In AI mode, human (myColor) is at bottom
  var wK = 'https://chessboardjs.com/img/chesspieces/wikipedia/wK.png';
  var bK = 'https://chessboardjs.com/img/chesspieces/wikipedia/bK.png';

  if (gameMode === '2p') {
    document.getElementById('bottom-name').textContent   = players.white.name;
    document.getElementById('bottom-rating').textContent = '♟ White';
    document.getElementById('top-name').textContent      = players.black.name;
    document.getElementById('top-rating').textContent    = '♟ Black';
    document.getElementById('bottom-avatar').innerHTML   = `<img src="${wK}">`;
    document.getElementById('top-avatar').innerHTML      = `<img src="${bK}">`;
  } else {
    var human = myColor === 'w' ? players.white : players.black;
    var ai    = myColor === 'w' ? players.black : players.white;
    document.getElementById('bottom-name').textContent   = human.name;
    document.getElementById('bottom-rating').textContent = human.rating;
    document.getElementById('top-name').textContent      = ai.name;
    document.getElementById('top-rating').textContent    = ai.rating;
    document.getElementById('bottom-avatar').innerHTML   = `<img src="${myColor==='w'?wK:bK}">`;
    document.getElementById('top-avatar').innerHTML      = `<img src="${myColor==='w'?bK:wK}">`;
  }
}

function initBoard() {
  updatePlayerPlates();

  board = Chessboard('myBoard', {
    draggable: true,
    position: 'start',
    orientation: 'white',
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    onMouseoverSquare: onHoverSq,
    onMouseoutSquare: onUnhoverSq
  });

  $(window).on('resize', () => board.resize());
  setTimeout(() => board.resize(), 80);

  // LOGIC MOVED TO startGame for atomic control
  // state.lastMoveTs = Date.now();
  // startTimer();
  // renderMoves();
  var msg = gameMode === '2p'
    ? 'Game started! ' + players.white.name + ' (White) goes first.'
    : 'Game started! You are playing as ' + (myColor==='w'?'White':'Black') + '.';
  systemChat(msg);
}

// ═══════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════
function onDragStart(source, piece) {
  if (isReview || gameEnded) return false;
  if (game.game_over()) return false;

  var turn = game.turn(); // 'w' or 'b'

  if (gameMode === 'online') {
    // Only drag your own color, and only on your turn
    if (turn !== myColor) return false;
    if (myColor === 'w' && piece[0] === 'b') return false;
    if (myColor === 'b' && piece[0] === 'w') return false;
  } else if (gameMode === '2p') {
    // In 2p mode, only the current turn's pieces can be dragged
    if (turn === 'w' && piece[0] === 'b') return false;
    if (turn === 'b' && piece[0] === 'w') return false;
  } else {
    // AI mode: only human's turn
    if (turn !== myColor) return false;
    if (myColor === 'w' && piece[0] === 'b') return false;
    if (myColor === 'b' && piece[0] === 'w') return false;
  }
  // Highlight legal moves
  highlightLegalMoves(source);
}

function onDrop(source, target) {
  removeHighlights();
  if (isReview || gameEnded) return 'snapback';
  if (game.game_over()) return 'snapback';

  // In online mode, block if not your turn
  if (gameMode === 'online' && game.turn() !== myColor) return 'snapback';
  // In AI mode, block moves that aren't the human's turn
  if (gameMode === 'ai' && game.turn() !== myColor) return 'snapback';

  // Check promotion
  var piece = game.get(source);
  var isPromo = piece && piece.type === 'p' &&
    ((piece.color==='w' && target[1]==='8') || (piece.color==='b' && target[1]==='1'));

  if (isPromo) {
    pendingPromo = { source, target };
    showPromoDialog(piece.color);
    return 'snapback';
  }

  var move = game.move({ from: source, to: target, promotion: 'q' });
  if (move === null) return 'snapback';

  // Broadcast move to opponent tab
  if (gameMode === 'online') broadcastMove(move);

  onMoveMade(source, target);
}

function onSnapEnd() {
  if (viewIndex === -1) board.position(game.fen(), false);
}

function onMoveMade(source, target) {
  viewIndex = -1;
  isReview = false;
  hideReviewBar();

  // Update time
  var elapsed = (Date.now() - state.lastMoveTs) / 1000;
  if (state.turn === 'w') state.whiteTime = Math.max(0, state.whiteTime - elapsed);
  else state.blackTime = Math.max(0, state.blackTime - elapsed);
  state.turn = game.turn();
  state.lastMoveTs = Date.now();
  state.drawOffer = null;
  // Calculate turn deadline for synchronization
  var nextPlayerTime = state.turn === 'w' ? state.whiteTime : state.blackTime;
  state.deadline = Date.now() + (nextPlayerTime * 1000);
  
  _saveGameState();

  highlightLastMove(source, target);
  renderMoves();
  renderCaptures();
  updateStatus();

  if (gameMode === 'online') {
    // In online mode: board stays oriented to myColor — no flip
    if (!gameEnded) {
      var nextColor = game.turn();
      if (nextColor !== myColor) {
        showToast("Opponent's turn — waiting...", 'info');
      } else {
        showToast('Your turn!', 'info');
      }
    }
  } else if (gameMode === '2p') {
    // In 2p mode flip board for next player after a short pause
    if (!gameEnded) {
      var nextColor = game.turn(); // 'w' or 'b' after move
      setTimeout(() => {
        board.orientation(nextColor === 'w' ? 'white' : 'black');
        var turnName = nextColor === 'w' ? players.white.name : players.black.name;
        var turnLabel = nextColor === 'w' ? 'White' : 'Black';
        showToast(turnName + "'s turn (" + turnLabel + ')', 'info');
      }, 180);
    }
  } else {
    // AI mode: let AI reply
    if (!gameEnded && game.turn() !== myColor) {
      setTimeout(aiMove, 500 + Math.random()*500);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// AI (random moves with capture preference)
// ═══════════════════════════════════════════════════════════
function aiMove() {
  if (gameEnded || game.game_over()) return;
  if (game.turn() === myColor) return;

  var moves = game.moves({ verbose: true });
  if (moves.length === 0) return;

  // Prefer captures, then checks
  var captures = moves.filter(m => m.captured);
  var checks   = moves.filter(m => m.san.includes('+'));
  var pool = captures.length ? captures : (checks.length ? checks : moves);
  var pick = pool[Math.floor(Math.random() * pool.length)];

  game.move(pick);

  var elapsed = (Date.now() - state.lastMoveTs) / 1000;
  if (state.turn === 'w') state.whiteTime = Math.max(0, state.whiteTime - elapsed);
  else state.blackTime = Math.max(0, state.blackTime - elapsed);
  state.turn = game.turn();
  state.lastMoveTs = Date.now();
  state.lastFrom = pick.from;
  state.lastTo   = pick.to;

  // AI turn finish: calculate human deadline
  var nextPlayerTime = state.turn === 'w' ? state.whiteTime : state.blackTime;
  state.deadline = Date.now() + (nextPlayerTime * 1000);

  highlightLastMove(pick.from, pick.to);
  board.position(game.fen(), true);
  renderMoves();
  renderCaptures();
  updateStatus();
}

// ═══════════════════════════════════════════════════════════
// SQUARE HIGHLIGHTS
// ═══════════════════════════════════════════════════════════
function highlightLegalMoves(sq) {
  removeHighlights();
  var moves = game.moves({ square: sq, verbose: true });
  moves.forEach(m => {
    $(`[data-square="${m.to}"]`).addClass('highlight-to');
  });
  $(`[data-square="${sq}"]`).addClass('highlight-from');
}

function removeHighlights() {
  $('.square-55d63').removeClass('highlight-from highlight-to');
}

function highlightLastMove(from, to) {
  $('.square-55d63').removeClass('highlight-from highlight-to');
  $(`[data-square="${from}"]`).css('background-color','');
  $(`[data-square="${to}"]`).css('background-color','');

  // Use CSS classes by checking square color
  var fromEl = $(`[data-square="${from}"]`);
  var toEl   = $(`[data-square="${to}"]`);
  fromEl.css('background-color', isLightSquare(from) ? 'rgba(200,220,80,0.45)' : 'rgba(170,185,50,0.5)');
  toEl.css('background-color',   isLightSquare(to)   ? 'rgba(200,220,80,0.55)' : 'rgba(170,185,50,0.6)');
}

function isLightSquare(sq) {
  var file = sq.charCodeAt(0) - 97; // a=0..h=7
  var rank = parseInt(sq[1]) - 1;
  return (file + rank) % 2 !== 0;
}

var _hoveredSq = null;
function onHoverSq(sq) {
  if (isReview || gameEnded) return;
  var piece = game.get(sq);
  if (!piece || piece.color !== myColor) return;
  _hoveredSq = sq;
}
function onUnhoverSq() {
  if (_hoveredSq) {
    if (viewIndex === -1 && state.lastFrom) {
      highlightLastMove(state.lastFrom, state.lastTo);
    }
  }
  _hoveredSq = null;
}

// ═══════════════════════════════════════════════════════════
// PROMOTION DIALOG
// ═══════════════════════════════════════════════════════════
function showPromoDialog(color) {
  var pieces = ['q','r','b','n'];
  var names = { q:'Queen', r:'Rook', b:'Bishop', n:'Knight' };
  var pieceCodes = { q: color==='w'?'wQ':'bQ', r: color==='w'?'wR':'bR', b: color==='w'?'wB':'bB', n: color==='w'?'wN':'bN' };
  var html = pieces.map(p =>
    `<div class="promo-piece" onclick="pickPromo('${p}')">
      <img src="https://chessboardjs.com/img/chesspieces/wikipedia/${pieceCodes[p]}.png" title="${names[p]}">
    </div>`
  ).join('');
  document.getElementById('promo-pieces').innerHTML = html;
  document.getElementById('promo-overlay').classList.add('show');
}

function pickPromo(piece) {
  document.getElementById('promo-overlay').classList.remove('show');
  if (!pendingPromo) return;
  var { source, target } = pendingPromo;
  pendingPromo = null;
  var move = game.move({ from: source, to: target, promotion: piece });
  if (move) {
    board.position(game.fen(), false);
    onMoveMade(source, target);
  }
}

// ═══════════════════════════════════════════════════════════
// MOVE NAVIGATION
// ═══════════════════════════════════════════════════════════
function navMove(dir) {
  var hist = game.history({ verbose: true });
  if (!hist.length) return;
  var cur = viewIndex === -1 ? hist.length - 1 : viewIndex;

  if (dir==='start')      viewIndex = 0;
  else if (dir==='end')   viewIndex = -1;
  else if (dir==='prev')  { if (cur <= 0) return; viewIndex = cur - 1; }
  else if (dir==='next')  {
    if (viewIndex === -1) return;
    viewIndex = viewIndex >= hist.length-1 ? -1 : viewIndex + 1;
  }

  viewGame = new Chess();
  var end = viewIndex === -1 ? hist.length : viewIndex + 1;
  for (var i=0; i<end; i++) viewGame.move(hist[i]);
  board.position(viewGame.fen(), false);

  isReview = viewIndex !== -1 && !gameEnded;
  isReview ? showReviewBar() : hideReviewBar();
  renderMoves();
}

function jumpMove(idx) {
  var hist = game.history({ verbose: true });
  viewIndex = idx;
  viewGame = new Chess();
  for (var i=0; i<=idx; i++) viewGame.move(hist[i]);
  board.position(viewGame.fen(), false);
  if (idx === hist.length - 1) {
    viewIndex = -1;
    isReview = false;
    hideReviewBar();
  } else {
    isReview = !gameEnded;
    if (isReview) showReviewBar();
  }
  renderMoves();
}

// ═══════════════════════════════════════════════════════════
// RENDER MOVES
// ═══════════════════════════════════════════════════════════
function renderMoves() {
  var hist = game.history();
  var el = document.getElementById('moves-list');
  if (!hist.length) {
    el.innerHTML = '<div class="moves-empty">No moves yet.</div>';
    return;
  }
  var active = viewIndex === -1 ? hist.length - 1 : viewIndex;
  var html = '';
  for (var i=0; i<hist.length; i+=2) {
    var w = hist[i], b = hist[i+1]||null;
    var wa = i===active ? ' active' : '';
    var ba = (i+1)===active ? ' active' : '';
    html += `<div class="move-row">
      <div class="move-num">${(i/2)+1}</div>
      <div class="move-ply${wa}" onclick="jumpMove(${i})">${w}</div>
      ${b !== null
        ? `<div class="move-ply${ba}" onclick="jumpMove(${i+1})">${b}</div>`
        : `<div class="move-ply empty"></div>`}
    </div>`;
  }
  el.innerHTML = html;
  var actEl = el.querySelector('.move-ply.active');
  if (actEl) actEl.scrollIntoView({ block: 'nearest' });
  else el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// PERSISTENCE & SYNC (BroadcastChannel / PGN / Timers)
// ═══════════════════════════════════════════════════════════
var syncChannel = null;

function _sessionKey() { return onlineMoveKey ? onlineMoveKey + '_state' : null; }

function _initSyncChannel() {
  if (!onlineSid) return;
  syncChannel = new BroadcastChannel('pc_chess_' + onlineSid);
  syncChannel.onmessage = function(e) {
    var d = e.data;
    if (d.type === 'SYNC_REQ') {
      // Another tab reloaded — send them our current state
      syncChannel.postMessage({
        type: 'SYNC_RES',
        pgn: game.pgn(),
        state: { w:state.whiteTime, b:state.blackTime, ts:state.lastMoveTs, dl:state.deadline, turn:state.turn, lf:state.lastFrom, lt:state.lastTo },
        chat: chatMsgs
      });
    } else if (d.type === 'SYNC_RES' || d.type === 'MOVE') {
      _applyStateBundle(d);
    }
  };
  // Ask other tabs for state (fixes refresh delay)
  syncChannel.postMessage({ type: 'SYNC_REQ' });
}

function _applyStateBundle(d) {
  if (!d.pgn && !d.state) return;
  try {
    if (d.pgn) {
      game.load_pgn(d.pgn);
      viewGame.load_pgn(d.pgn);
      board.position(game.fen());
    }
    if (d.state) {
      state.whiteTime  = d.state.w;
      state.blackTime  = d.state.b;
      state.lastMoveTs = d.state.ts;
      state.deadline   = d.state.dl;
      state.turn       = d.state.turn || game.turn();
      state.lastFrom   = d.state.lf;
      state.lastTo     = d.state.lt;
    }
    if (d.chat) chatMsgs = d.chat;
    
    _finishHydration();
  } catch(ex) { console.warn('[Sync] bundle error', ex); }
}

function _finishHydration() {
  renderMoves();
  renderCaptures();
  renderChat();
  updateStatus();
  if (state.lastFrom) highlightLastMove(state.lastFrom, state.lastTo);
  
  // Restart timer if needed
  if (!timerInt && !gameEnded) startTimer();
}

function _saveGameState() {
  if (gameMode !== 'online' || !_sessionKey()) return;
  var data = {
    pgn:   game.pgn(),
    state: {
      w: state.whiteTime,
      b: state.blackTime,
      ts: state.lastMoveTs,
      dl: state.deadline,
      turn: state.turn,
      lastFrom: state.lastFrom,
      lastTo: state.lastTo
    },
    chat: chatMsgs
  };
  localStorage.setItem(_sessionKey(), JSON.stringify(data));
  
  // Also Broadcast for instant sync
  if (syncChannel) {
    syncChannel.postMessage({ type: 'MOVE', pgn: data.pgn, state: data.state, chat: data.chat });
  }
}

function _loadGameState() {
  if (gameMode !== 'online' || !_sessionKey()) return;
  var raw = localStorage.getItem(_sessionKey());
  if (!raw) {
    // No saved moves yet — use session start time as anchor
    _finishHydration();
    return;
  }
  try {
    var data = JSON.parse(raw);
    _applyStateBundle(data);
  } catch(e) { 
    _finishHydration();
  }
}

function startTimer() {
  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(() => {
    if (gameEnded) return;
    
    var wT = state.whiteTime;
    var bT = state.blackTime;
    var now = Date.now();

    // If turn is active, calculate remaining from deadline or lastMoveTs
    if (state.turn === 'w') {
      if (state.deadline) wT = Math.max(0, (state.deadline - now)/1000);
      else wT = Math.max(0, state.whiteTime - (now - state.lastMoveTs)/1000);
    } else {
      if (state.deadline) bT = Math.max(0, (state.deadline - now)/1000);
      else bT = Math.max(0, state.blackTime - (now - state.lastMoveTs)/1000);
    }

    if (wT <= 0 && state.turn === 'w') { endGame(myColor==='w'?'b':'w', 'White ran out of time!'); return; }
    if (bT <= 0 && state.turn === 'b') { endGame(myColor==='b'?'w':'b', 'Black ran out of time!'); return; }

    setTimerEl('bottom-timer', myColor==='w'?wT:bT, state.turn === myColor);
    setTimerEl('top-timer',    myColor==='w'?bT:wT, state.turn !== myColor);
  }, 300);
}

function setTimerEl(id, secs, active) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = fmtTime(secs);
  var cls = secs < 30 && active ? 'timer-danger' : active ? 'timer-active' : 'timer-idle';
  el.className = 'timer-box ' + cls;
}

function fmtTime(s) {
  s = Math.max(0, s);
  var m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + (sec<10?'0':'') + sec;
}

// ═══════════════════════════════════════════════════════════
// GAME STATUS
// ═══════════════════════════════════════════════════════════
function updateStatus() {
  if (gameEnded) return;

  var checkBar = document.getElementById('check-bar');
  if (game.in_check() && !game.game_over()) {
    checkBar.classList.add('show');
    checkBar.style.animation = 'none';
    void checkBar.offsetWidth;
    checkBar.style.animation = 'shakeX 0.4s ease';
  } else {
    checkBar.classList.remove('show');
  }

  if (game.in_checkmate()) {
    var winner = game.turn()==='w' ? 'b' : 'w';
    endGame(winner, 'Checkmate!');
  } else if (game.in_stalemate()) {
    endGame('draw', 'Stalemate — no legal moves.');
  } else if (game.insufficient_material()) {
    endGame('draw', 'Insufficient material.');
  } else if (game.in_threefold_repetition()) {
    endGame('draw', 'Threefold repetition.');
  } else if (game.in_draw()) {
    endGame('draw', '50-move rule.');
  }
}

// ═══════════════════════════════════════════════════════════
// END GAME
// ═══════════════════════════════════════════════════════════
function endGame(winner, reason) {
  if (gameEnded) return;
  gameEnded = true;
  state.result = { winner, reason };
  clearInterval(timerInt);
  systemChat('Game Over: ' + reason);

  // Immediately purge QP session from local DB so getMyLive() returns null
  if (gameMode === 'online' && onlineSid) {
    _cleanupQPSession(onlineSid);
    // Notify the other tab to clean up too
    try { localStorage.setItem('chess_qp_ended_' + onlineSid, Date.now().toString()); } catch(ex) {}
  }

  // ── Tournament Result Reporting ──
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('mode') === 'tournament') {
    var mid = urlParams.get('matchId');
    var tid = urlParams.get('tournamentId');
    _reportTournamentResult(tid, mid, winner);
  }

  renderMoves();
  updateResignBtn();
  showGameOver(winner, reason);
}

function _reportTournamentResult(tid, mid, winner) {
  try {
    const winnerId = (winner === 'w') ? state.players.white.id : (winner === 'b' ? state.players.black.id : null);
    const myUid = players.me.id;
    
    if (window.DB && DB.reportResult) {
      DB.reportResult(mid, winnerId, myUid);
      systemChat('Tournament result reported to the engine. Waiting for verification.');
    } else {
      // Fallback if DB didn't load (unlikely)
      console.error('Tournament Engine not found!');
    }
  } catch(e) { console.warn('[Tourn Report]', e); }
}

function showGameOver(winner, reason) {
  var icon = document.getElementById('go-icon');
  var title = document.getElementById('go-title');
  var reasonEl = document.getElementById('go-reason');
  var scoreEl  = document.getElementById('go-score');
  var btnsEl   = document.getElementById('go-btns');

  if (winner === 'draw') {
    icon.textContent = '🤝'; title.textContent = 'Draw!'; title.style.color = '#e8c96a';
  } else if (winner === 'abort') {
    icon.textContent = '🚪'; title.textContent = 'Aborted'; title.style.color = '#888';
  } else if (gameMode === '2p') {
    var winName = winner === 'w' ? players.white.name : players.black.name;
    var winLabel = winner === 'w' ? 'White' : 'Black';
    icon.textContent = '🏆';
    title.textContent = winName + ' Wins!';
    title.style.color = '#a5d16a';
    reason = winLabel + ' wins by ' + reason;
  } else if (winner === myColor) {
    icon.textContent = '🏆'; title.textContent = 'You Win!'; title.style.color = '#a5d16a';
  } else {
    icon.textContent = '😞'; title.textContent = 'You Lose'; title.style.color = '#e05555';
  }

  reasonEl.textContent = reason;

  // Score boxes
  var moves = game.history().length;
  scoreEl.innerHTML = `
    <div class="go-score-box"><strong>${moves}</strong>Moves</div>
    <div class="go-score-box"><strong>${fmtTime(myColor==='w'?state.whiteTime:state.blackTime)}</strong>Time Left</div>
  `;

  var btnHtml = `
    <button class="go-btn go-ghost" onclick="reviewGame()">👁 Review</button>
    <button class="go-btn go-rematch" onclick="rematch()">⚡ Rematch</button>
  `;

  if (gameMode === 'online') {
    var isTourn = new URLSearchParams(window.location.search).get('mode') === 'tournament';
    if (isTourn) {
      btnHtml += `<button class="go-btn go-primary" onclick="window.location.href='../../pages/player/tournaments.html?id=${new URLSearchParams(window.location.search).get('tournamentId')}'">🏆 Return to Tournament</button>`;
    } else {
      btnHtml += `<button class="go-btn go-primary" onclick="quitToLobby()">🚪 Exit to Sessions</button>`;
    }
  } else {
    btnHtml += `<button class="go-btn go-primary" onclick="newGame()">New Game</button>`;
    btnHtml += `<button class="go-btn go-ghost" onclick="quitToLobby()">🚪 Exit to Sessions</button>`;
  }

  btnsEl.innerHTML = btnHtml;

  document.getElementById('go-overlay').classList.add('show');
}

function reviewGame() {
  document.getElementById('go-overlay').classList.remove('show');
  showReviewBar();
}

function rematch() {
  document.getElementById('go-overlay').classList.remove('show');

  if (gameMode === 'online') {
    // In online mode: ask the opponent first
    _sendRematchRequest();
    return;
  }
  if (gameMode === 'ai') myColor = myColor === 'w' ? 'b' : 'w'; // swap sides
  resetAll();
}

// ── Online Rematch Request / Response ──────────────────────
var _rematchBanner = null;

function _rematchKey() { return onlineMoveKey + '_rematch'; }

function _sendRematchRequest() {
  localStorage.setItem(_rematchKey(), JSON.stringify({ type: 'request', from: myColor, ts: Date.now() }));
  // Show waiting UI
  document.getElementById('go-btns').innerHTML = `
    <button class="go-btn go-ghost" id="rematch-cancel-btn" onclick="_cancelRematch()">✕ Cancel</button>
    <span style="font-size:0.85rem;color:#aaa;padding:0.5rem">Waiting for opponent...</span>
  `;
}

function _cancelRematch() {
  localStorage.setItem(_rematchKey(), JSON.stringify({ type: 'cancel', from: myColor, ts: Date.now() }));
  // Restore normal game-over buttons
  showGameOver(state.result?.winner || 'draw', state.result?.reason || '');
}

function _acceptRematch() {
  var b = document.getElementById('rematch-banner');
  if (b) b.remove();
  // Tell the requester we accepted
  localStorage.setItem(_rematchKey(), JSON.stringify({ type: 'accepted', from: myColor, ts: Date.now() }));
  // Reload with swapped color (guest becomes white, host becomes black)
  var newColor = myColor === 'w' ? 'b' : 'w';
  setTimeout(function() {
    window.location.href = window.location.pathname + '?sid=' + onlineSid + '&color=' + newColor;
  }, 400);
}

function _declineRematch() {
  var b = document.getElementById('rematch-banner');
  if (b) b.remove();
  localStorage.setItem(_rematchKey(), JSON.stringify({ type: 'declined', from: myColor, ts: Date.now() }));
  showToast('Rematch declined.', 'info');
}

// ── Clean up QP session from DB immediately when game ends ──
function _cleanupQPSession(sid) {
  if (!sid) return;
  try {
    var dbRaw = localStorage.getItem('playcarys_db');
    if (!dbRaw) return;
    var db = JSON.parse(dbRaw);
    // Mark session completed
    (db.sessions || []).forEach(function(s) {
      if (String(s.session_id || s.id) === String(sid)) s.status = 'completed';
    });
    // Remove player_session entries so getMyLive() returns null immediately
    db.player_session = (db.player_session || []).filter(function(ps) {
      return String(ps.session_id) !== String(sid);
    });
    localStorage.setItem('playcarys_db', JSON.stringify(db));
    // Also remove game-state persistence
    var sk = _sessionKey();
    if (sk) localStorage.removeItem(sk);
    var tk = onlineMoveKey ? onlineMoveKey + '_time' : null; // old key, cleanup just in case
    if (tk) localStorage.removeItem(tk);
  } catch(ex) { console.warn('[QP Cleanup]', ex); }
}

function newGame() {
  document.getElementById('go-overlay').classList.remove('show');
  if (gameMode === 'online') {
    quitToLobby();
    return;
  }
  // Return to mode select so players can reconfigure
  document.getElementById('mode-overlay').classList.remove('hidden');
}

function quitToLobby() {
  if (gameMode === 'online' && onlineSid) {
    _cleanupQPSession(onlineSid);
  }
  
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('mode') === 'tournament') {
    var tid = urlParams.get('tournamentId');
    window.location.href = '../../pages/player/tournaments.html' + (tid ? '?id=' + tid : '');
  } else {
    try {
      var authRaw = localStorage.getItem('playcarys_auth');
      if (authRaw) {
        var auth = JSON.parse(authRaw);
        if (auth.role === 'moderator') {
          window.location.href = '../../pages/moderator/sessions.html';
          return;
        } else if (auth.role === 'superuser') {
          window.location.href = '../../pages/superuser/hub.html';
          return;
        }
      }
    } catch(e) {}
    
    // Default for players
    if (onlineSid) {
      window.location.href = '../../pages/player/join-session.html';
    } else {
      window.location.href = '../../pages/player/games.html';
    }
  }
}

function resetAll() {
  game = new Chess();
  viewGame = new Chess();
  viewIndex = -1;
  isReview = false;
  gameEnded = false;
  state = {
    whiteTime: 600, blackTime: 600,
    lastMoveTs: Date.now(), turn: 'w',
    drawOffer: null, result: null,
    chat: [], lastFrom: null, lastTo: null
  };
  clearInterval(timerInt);
  document.getElementById('check-bar').classList.remove('show');
  hideReviewBar();
  document.getElementById('draw-bar').classList.remove('show');
  document.getElementById('bottom-captured').innerHTML = '';
  document.getElementById('top-captured').innerHTML = '';

  board.orientation('white');  // always start white at bottom; 2p mode will flip during play
  board.start();
  updatePlayerPlates();

  setTimerEl('bottom-timer', 600, true);
  setTimerEl('top-timer',    600, false);
  updateResignBtn();
  startTimer();
  renderMoves();
  document.getElementById('chat-history').innerHTML = '<div class="chat-empty">Say hi to your opponent 👋</div>';
  
  if (gameMode === 'online') {
    // Online state managed by _initSyncChannel Handshake
  } else {
    state.lastMoveTs = Date.now();
    startTimer();
  }

  if (gameMode === '2p') {
    systemChat('New game! ' + players.white.name + ' (White) goes first.');
  } else {
    systemChat('New game! Playing as ' + (myColor==='w'?'White':'Black') + '.');
    if (myColor === 'b') setTimeout(aiMove, 600 + Math.random()*400);
  }
}

// ═══════════════════════════════════════════════════════════
// DRAW / RESIGN / ABORT
// ═══════════════════════════════════════════════════════════
function offerDraw() {
  if (gameEnded) return;
  
  var offererColor = (gameMode === '2p') ? game.turn() : myColor;

  if (state.drawOffer === offererColor) { showToast('Already offered a draw.', 'info'); return; }
  state.drawOffer = offererColor;
  showToast('Draw offered!', 'info');
  systemChat((offererColor==='w'?'White':'Black') + ' offers a draw.');

  if (gameMode === 'online') {
    // Sync draw offer to opponent tab via localStorage
    localStorage.setItem(onlineMoveKey + '_draw', JSON.stringify({ from: myColor, ts: Date.now() }));
    showToast('Draw offer sent to opponent.', 'info');
  } else if (gameMode === '2p') {
    // In 2p mode, the offer stays until the next player answers it
  } else {
    // AI mode: simulate opponent randomly accepting
    setTimeout(() => {
      if (!gameEnded && state.drawOffer === offererColor) {
        if (Math.random() < 0.3) {
          endGame('draw', 'Draw by agreement.');
        } else {
          state.drawOffer = null;
          systemChat('Draw declined.');
          document.getElementById('draw-bar').classList.remove('show');
          showToast('Opponent declined the draw.', 'warning');
        }
      }
    }, 1800 + Math.random()*1200);
  }
}

function respondDraw(accept) {
  document.getElementById('draw-bar').classList.remove('show');
  state.drawOffer = null;
  if (accept) {
    if (gameMode === 'online') {
      // Broadcast draw acceptance
      localStorage.setItem(onlineMoveKey + '_draw', JSON.stringify({ from: 'accepted', ts: Date.now() }));
    }
    endGame('draw', 'Draw by agreement.');
  } else {
    if (gameMode === 'online') {
      localStorage.setItem(onlineMoveKey + '_draw', JSON.stringify({ from: 'declined', ts: Date.now() }));
    }
    systemChat('Draw offer declined.');
    showToast('Draw declined.', 'info');
  }
}

function checkDrawOfferBanner() {
  var bar = document.getElementById('draw-bar');
  if (!state.drawOffer || gameEnded) {
    bar.classList.remove('show');
    return;
  }
  
  var isOpponentOffer = false;
  if (gameMode === '2p') {
    isOpponentOffer = (state.drawOffer !== game.turn());
  } else {
    isOpponentOffer = (state.drawOffer !== myColor);
  }

  if (isOpponentOffer) {
    bar.classList.add('show');
    var label = document.querySelector('.draw-offer-label');
    if (label) {
      if (gameMode === '2p') {
        var oppColorName = state.drawOffer === 'w' ? players.white.name : players.black.name;
        label.textContent = '½ ' + oppColorName + ' offers a Draw';
      } else {
        label.textContent = '½ Opponent offers a Draw';
      }
    }
  } else {
    bar.classList.remove('show');
  }
}

function doResign() {
  if (gameEnded) { newGame(); return; }
  var isAbort  = game.history().length < 2;
  var title    = isAbort ? '🏳 Abort Match' : '🏳 Resign Game';
  var msg      = isAbort
    ? 'Abort this match? No rating points will change.'
    : 'Resign this game? This will count as a loss.';

  showConfirm(title, msg, function() {
    if (isAbort) {
      if (gameMode === 'online') {
        localStorage.setItem(onlineMoveKey + '_resign',
          JSON.stringify({ color: myColor, type: 'abort', ts: Date.now() }));
      }
      endGame('abort', 'Match aborted.');
    } else if (gameMode === 'online') {
      var opp = myColor === 'w' ? 'b' : 'w';
      localStorage.setItem(onlineMoveKey + '_resign',
        JSON.stringify({ color: myColor, type: 'resign', ts: Date.now() }));
      endGame(opp, (myColor === 'w' ? 'White' : 'Black') + ' resigned.');
    } else if (gameMode === '2p') {
      var curTurn  = game.turn();
      var winner   = curTurn === 'w' ? 'b' : 'w';
      var resigner = curTurn === 'w' ? players.white.name : players.black.name;
      endGame(winner, resigner + ' resigned.');
    } else {
      var opp = myColor === 'w' ? 'b' : 'w';
      endGame(opp, (myColor === 'w' ? 'White' : 'Black') + ' resigned.');
    }
  });
}

function updateResignBtn() {
  var btnResign = document.getElementById('btn-resign');
  var btnDraw = document.getElementById('btn-draw');
  
  if (gameEnded) {
    btnResign.textContent = '🔄 New Game';
    btnResign.className = 'act-btn exit';
    btnResign.onclick = newGame;
    
    btnDraw.style.display = 'flex';
    btnDraw.textContent = '🚪 Sessions';
    btnDraw.className = 'act-btn resign';
    btnDraw.onclick = quitToLobby;
  } else {
    var isAbort = game.history().length < 2;
    btnResign.textContent = isAbort ? '🏳 Abort' : '🏳 Resign';
    btnResign.className = 'act-btn resign';
    btnResign.onclick = doResign;

    btnDraw.style.display = 'flex';
    btnDraw.textContent = '½ Draw';
    btnDraw.className = 'act-btn draw';
    btnDraw.onclick = offerDraw;
  }
}

// ═══════════════════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════════════════
var chatMsgs = [];
function sendChat() {
  var inp = document.getElementById('chat-inp');
  var txt = inp.value.trim();
  if (!txt) return;
  chatMsgs.push({ from: 'me', name: players.me.name, text: txt });
  inp.value = '';
  renderChat();
  // Simulate reply
  var replies = ['Good move!', 'Interesting...', 'Let me think.', 'Nice one!', 'Hmm.', '👀'];
  setTimeout(() => {
    chatMsgs.push({ from: 'opp', name: players.opp.name, text: replies[Math.floor(Math.random()*replies.length)] });
    renderChat();
    _saveGameState();
  }, 800 + Math.random()*1500);
}

function systemChat(txt) {
  chatMsgs.push({ from: 'sys', text: txt });
  renderChat();
  _saveGameState();
}

function renderChat() {
  var el = document.getElementById('chat-history');
  if (!chatMsgs.length) {
    el.innerHTML = '<div class="chat-empty">Say hi to your opponent 👋</div>';
    return;
  }
  var atBottom = el.scrollHeight - el.clientHeight <= el.scrollTop + 60;
  el.innerHTML = chatMsgs.slice(-80).map(m => {
    if (m.from === 'sys') return `<div class="chat-sys">⚡ ${m.text}</div>`;
    var cls = m.from === 'me' ? 'me' : 'opp';
    return `<div class="chat-msg"><span class="chat-name ${cls}">${m.name}:</span>${m.text}</div>`;
  }).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// TAB SWITCH
// ═══════════════════════════════════════════════════════════
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+id+'-btn').classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
  if (id==='chat') {
    var h = document.getElementById('chat-history');
    setTimeout(() => h.scrollTop = h.scrollHeight, 50);
  }
}

// ═══════════════════════════════════════════════════════════
// REVIEW BAR
// ═══════════════════════════════════════════════════════════
function showReviewBar() { document.getElementById('review-bar').classList.add('show'); }
function hideReviewBar() { document.getElementById('review-bar').classList.remove('show'); }

// ═══════════════════════════════════════════════════════════
// CONFIRM DIALOG
// ═══════════════════════════════════════════════════════════
var _confirmCb = null;
function showConfirm(title, msg, cb) {
  _confirmCb = cb;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent   = msg;
  document.getElementById('confirm-overlay').classList.add('show');
  document.getElementById('confirm-ok').onclick = () => { 
    var cbToCall = _confirmCb;
    closeConfirm(); 
    if (cbToCall) cbToCall(); 
  };
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); _confirmCb = null; }

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function showToast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-stack').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.4s'; setTimeout(()=>el.remove(),400); }, 2800);
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  navMove('prev');
  if (e.key === 'ArrowRight') navMove('next');
  if (e.key === 'ArrowUp')    navMove('start');
  if (e.key === 'ArrowDown')  navMove('end');
  if (e.key === 'f')          board && board.flip();
});

// ═══════════════════════════════════════════════════════════
// BOOT — wait for mode selection before initing the board
// ═══════════════════════════════════════════════════════════
$(document).ready(() => {
  var urlParams  = new URLSearchParams(window.location.search);
  var mode       = urlParams.get('mode');
  var sid        = urlParams.get('sid');
  var colorParam = urlParams.get('color'); // 'w' or 'b' — set by games.html before redirect

  if (sid) {
    // Quick Play / Room Lobby → Online competitive mode
    document.getElementById('mode-overlay').style.display = 'none';

    // Color is passed directly in the URL — no guessing, no shared-key collision
    var myCol = (colorParam === 'b') ? 'b' : 'w';

    // Try to read player names from DB session
    var whiteName = 'White', blackName = 'Black';
    try {
      var dbRaw = localStorage.getItem('playcarys_db');
      if (dbRaw) {
        var db = JSON.parse(dbRaw);
        var sess = (db.sessions || []).find(function(s) {
          return String(s.session_id || s.id) === String(sid);
        });
        if (sess) {
          var hostId = String(sess.hostId || sess.created_by || '');
          var users  = db.users || [];
          var playerIds = (db.player_session || []).filter(function(ps) {
            return String(ps.session_id) === String(sess.session_id || sess.id);
          }).map(function(ps){ return String(ps.player_id); });
          var hostUser  = users.find(function(u){ return String(u.user_id) === hostId; });
          var guestUser = users.find(function(u){ return String(u.user_id) !== hostId && playerIds.includes(String(u.user_id)); });
          whiteName = (hostUser  && hostUser.user_name)  || 'White';
          blackName = (guestUser && guestUser.user_name) || 'Black';
        }
      }
    } catch(e) {}

    startGame('online', {
      sid:         sid,
      color:       myCol,
      whiteName:   whiteName,
      blackName:   blackName,
      whiteRating: 1200,
      blackRating: 1200
    });

    setTimeout(function() {
      if (board) board.orientation(myCol === 'w' ? 'white' : 'black');
      systemChat('Quick Play started! You play as ' + (myCol === 'w' ? 'White ⬜' : 'Black ⬛') + '.');
    }, 200);

    // Listen for opponent resign/draw events via localStorage
    window.addEventListener('storage', function(e) {
      if (!onlineMoveKey) return;
      // Other tab ended the game — clean up session here too
      if (e.key === 'chess_qp_ended_' + onlineSid && e.newValue) {
        _cleanupQPSession(onlineSid);
      }
      // Resign / Abort by opponent
      if (e.key === onlineMoveKey + '_resign' && e.newValue) {
        try {
          var data = JSON.parse(e.newValue);
          if (data.color !== myColor) { // opponent acted
            if (data.type === 'abort') {
              endGame('abort', 'Match aborted.');
            } else {
              endGame(myColor, (data.color==='w'?'White':'Black') + ' resigned. You win!');
            }
          }
        } catch(ex) {}
      }
      // Draw offer by opponent
      if (e.key === onlineMoveKey + '_draw' && e.newValue) {
        try {
          var data = JSON.parse(e.newValue);
          if (data.from === 'accepted') {
            if (!gameEnded) endGame('draw', 'Draw by agreement.');
          } else if (data.from === 'declined') {
            state.drawOffer = null;
            document.getElementById('draw-bar').classList.remove('show');
            showToast('Opponent declined your draw offer.', 'warning');
          } else if (!gameEnded && data.from !== myColor) {
            // Opponent is offering draw
            state.drawOffer = data.from;
            document.getElementById('draw-bar').classList.add('show');
          }
        } catch(ex) {}
      }
      // ── Rematch request / response ──
      if (e.key === _rematchKey() && e.newValue) {
        try {
          var rm = JSON.parse(e.newValue);
          if (rm.type === 'request' && rm.from !== myColor) {
            // Opponent wants a rematch — show banner
            var banner = document.createElement('div');
            banner.id = 'rematch-banner';
            banner.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2a1a;border:1px solid #4a7c4a;border-radius:12px;padding:1rem 1.5rem;z-index:9999;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 32px rgba(0,0,0,0.6)';
            banner.innerHTML = '<span style="font-size:1.2rem">⚡</span><span style="font-weight:700">Opponent wants a Rematch!</span>'
              + '<button onclick="_acceptRematch()" style="background:#2a7c2a;color:#fff;border:none;border-radius:8px;padding:0.45rem 1rem;font-weight:700;cursor:pointer">Accept</button>'
              + '<button onclick="_declineRematch()" style="background:#7c2a2a;color:#fff;border:none;border-radius:8px;padding:0.45rem 1rem;font-weight:700;cursor:pointer">Decline</button>';
            var old = document.getElementById('rematch-banner');
            if (old) old.remove();
            document.body.appendChild(banner);
          } else if (rm.type === 'accepted' && rm.from !== myColor) {
            // Opponent accepted our rematch — swap colors and reload
            var newColor = myColor === 'w' ? 'b' : 'w';
            window.location.href = window.location.pathname + '?sid=' + onlineSid + '&color=' + newColor;
          } else if (rm.type === 'declined' && rm.from !== myColor) {
            showToast('Opponent declined the rematch.', 'warning');
            // Restore game-over buttons
            showGameOver(state.result?.winner || 'draw', state.result?.reason || '');
          } else if (rm.type === 'cancel') {
            var b = document.getElementById('rematch-banner');
            if (b) b.remove();
          }
        } catch(ex) {}
      }
    });

  } else if (mode === 'tournament') {
    // Tournament Match Logic
    var tid = urlParams.get('tournamentId');
    var mid = urlParams.get('matchId');
    document.getElementById('mode-overlay').style.display = 'none';
    
    // Find match data to get opponents
    var p1 = 'P1', p2 = 'P2';
    try {
      var db = JSON.parse(localStorage.getItem('playcarys_db'));
      var m = (db.tournament_matches || []).find(x => String(x.match_id) === String(mid));
      if (m) {
        p1 = db.users.find(u => String(u.user_id) === String(m.player1))?.user_name || 'Player 1';
        p2 = db.users.find(u => String(u.user_id) === String(m.player2))?.user_name || 'Player 2';
      }
    } catch(e) {}

    startGame('online', {
      sid: 'T_' + mid,
      color: 'w', // Tournament matches usually have assigned colors, defaulting to w for now
      whiteName: p1,
      blackName: p2,
      whiteRating: 1500,
      blackRating: 1500
    });
    systemChat('TOURNAMENT MATCH: ' + p1 + ' vs ' + p2);

  } else if (mode === 'ai' || mode === '2p') {
    startGame(mode);
  }
  // else: show the mode overlay

  setInterval(checkDrawOfferBanner, 300);
});
</script>
