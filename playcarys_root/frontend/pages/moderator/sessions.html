<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PlayCarys — Live Sessions</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div id="navbar" class="navbar"></div>
  <div class="page-wrapper">
    <div class="page-content">

      <div class="page-header">
        <h1>Live Game Sessions</h1>
        <p class="text-muted">Monitor active game sessions in real-time</p>
      </div>

      <div class="stats-grid stats-grid-4 mb-3" id="stats-grid"></div>

      <div class="card mb-3" style="height: 320px; position: relative;">
        <h3 class="mb-2">Platform Session Trends</h3>
        <canvas id="sessionsChart"></canvas>
      </div>

      <div class="filter-bar">
        <select class="form-select" id="status-filter" onchange="renderSessions()" style="width:180px">
          <option value="">All Sessions</option>
          <option value="waiting">Waiting</option>
          <option value="in-progress">In Progress</option>
        </select>
        <select class="form-select" id="mode-filter" onchange="renderSessions()" style="width:180px">
          <option value="">All Modes</option>
          <option value="casual">Casual</option>
          <option value="ranked">Ranked</option>
          <option value="tournament">Tournament</option>
        </select>
      </div>

      <div id="sessions-list"></div>

    </div>
  </div>

  <!-- MONITOR MODAL -->
  <div class="modal-overlay" id="monitor-modal">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h3 class="modal-title" id="monitor-title">Monitor Session</h3>
        <span class="modal-close" onclick="Modal.close('monitor-modal')">✕</span>
      </div>
      <div id="monitor-content"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('monitor-modal')">Close</button>
        <button class="btn btn-red" id="terminate-btn">⛔ Terminate Session</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../data/db.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    // navigate() provided globally by utils.js (includes CSS fade transition)

    function renderStats() {
      const totalRaw = DB.sessions.length;
      const waiting = DB.sessions.filter(s => s.status === 'waiting').length;
      const inprog = DB.sessions.filter(s => s.status === 'in-progress').length;
      const activeSessions = DB.sessions.filter(s => s.status === 'waiting' || s.status === 'in-progress');
      const totalPlayers = activeSessions.reduce((sum, s) => sum + getPlayers(s).length, 0);

      const sessionsByDay = {};
      DB.sessions.forEach(s => {
        const d = new Date(s.createdAt || s.start_time).toISOString().split('T')[0];
        sessionsByDay[d] = (sessionsByDay[d] || 0) + 1;
      });
      const daysWithActivity = Object.keys(sessionsByDay).length || 1;
      const avgPerDay = Math.round(totalRaw / daysWithActivity);
      
      let peakDay = "N/A";
      let peakCount = 0;
      for (let d in sessionsByDay) {
        if (sessionsByDay[d] > peakCount) { peakCount = sessionsByDay[d]; peakDay = formatDate(d); }
      }

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="label">Total Active</div><div class="value text-cyan">${waiting + inprog}</div><div class="icon">🎮</div></div>
        <div class="stat-card"><div class="label">All-Time Sessions</div><div class="value text-purple">${totalRaw}</div><div class="icon">📈</div></div>
        <div class="stat-card"><div class="label">Avg Sessions/Day</div><div class="value text-green">${avgPerDay}</div><div class="icon">📅</div></div>
        <div class="stat-card"><div class="label">Peak Day</div><div class="value" style="font-size:1.1rem">${peakDay} (${peakCount})</div><div class="icon">🏔️</div></div>
      `;

      if (window.modChart) window.modChart.destroy();
      const ctx = document.getElementById('sessionsChart');
      if (ctx && totalRaw > 0) {
        const sortedDays = Object.keys(sessionsByDay).sort();
        window.modChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: sortedDays.map(d => formatDate(d)),
            datasets: [{
              label: 'Platform Sessions',
              data: sortedDays.map(d => sessionsByDay[d]),
              borderColor: '#a78bfa',
              backgroundColor: 'rgba(124, 58, 237, 0.1)',
              fill: true,
              tension: 0.4
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } }, scales: { x: { ticks:{color:'gray'} }, y: { ticks:{color:'gray'}, beginAtZero:true } } }
        });
      }
    }

    // Safe helper: works with or without the computed 'players' getter
    function getPlayers(s) {
      if (typeof s.players !== 'undefined') {
        try { return s.players; } catch(e) {}
      }
      const sid = s.session_id || s.id;
      return (DB.player_session || []).filter(ps => String(ps.session_id) === String(sid)).map(ps => String(ps.player_id));
    }

    function renderSessions() {
      const statusF = document.getElementById('status-filter').value;
      const modeF = document.getElementById('mode-filter').value;
      let sessions = DB.sessions.filter(s => s.session_id || s.id);
      if (statusF) sessions = sessions.filter(s => s.status === statusF);
      if (modeF) sessions = sessions.filter(s => s.mode === modeF);

      if (!sessions.length) {
        document.getElementById('sessions-list').innerHTML = `<div class="empty-state"><div class="icon">🎮</div><h3>No sessions found</h3><p>No sessions match your filters</p></div>`;
        return;
      }
      document.getElementById('sessions-list').innerHTML = sessions.map(s => {
        const plist = getPlayers(s);
        const sid = String(s.session_id || s.id);
        return `
    <div class="list-item">
      <div class="list-item-info">
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
          <span class="list-item-title">${s.name}</span>
          ${badgeHTML(s.status)} <span class="badge badge-review" style="font-size:0.68rem">${s.mode || 'casual'}</span>
        </div>
        <div class="list-item-sub mt-1">
          <span>🎮 ${s.game || s.game_name || 'Game'}</span>
          <span>👥 ${plist.length}/${s.maxPlayers}</span>
          <span>⏱ ${s.duration || 0} min</span>
        </div>
        <div class="list-item-sub">
          <span>Host: <strong>${s.host}</strong></span>
          <div style="display:flex;gap:0.2rem;flex-wrap:wrap">
            ${plist.map(pid => { const u = DB.users.find(u => String(u.user_id) === String(pid) || u.id === pid); return u ? `<div class="avatar avatar-sm">${u.avatar}</div>` : '' }).join('')}
          </div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="monitorSession('${sid}')">👁 Monitor</button>
    </div>`;
      }).join('');
    }

    function monitorSession(id) {
      const s = DB.sessions.find(s => String(s.session_id) === String(id) || s.id === id);
      if (!s) return;
      const plist = getPlayers(s);
      document.getElementById('monitor-title').textContent = `Monitoring: ${s.name}`;
      document.getElementById('monitor-content').innerHTML = `
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem">
      ${badgeHTML(s.status)} <span class="tag">${s.mode || 'casual'}</span>
    </div>
    <div class="detail-grid mb-2">
      <div class="detail-field"><label>Game</label><span>${s.game || s.game_name || 'Unknown'}</span></div>
      <div class="detail-field"><label>Host</label><span>${s.host}</span></div>
      <div class="detail-field"><label>Players</label><span>${plist.length} / ${s.maxPlayers}</span></div>
      <div class="detail-field"><label>Duration</label><span>${s.duration || 0} minutes</span></div>
    </div>
    <div>
      <h4 style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.5rem">PLAYERS IN SESSION</h4>
      ${plist.length === 0 ? '<p class="text-muted">No players in this session.</p>' : plist.map(pid => {
        const u = DB.users.find(u => String(u.user_id) === String(pid) || u.id === pid);
        if (!u) return '';
        return `<div class="list-item" style="padding:0.6rem 0.9rem;margin-bottom:0.4rem">
          <div class="avatar avatar-sm">${u.avatar}</div>
          <div style="flex:1;font-size:0.875rem">${u.user_name || u.username} ${badgeHTML(u.role || 'player')}</div>
          ${u.status === 'banned' ? '<span class="badge badge-banned">Banned</span>' : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="alert alert-warning mt-2">⚠️ Terminating will disconnect all players immediately</div>
  `;
      document.getElementById('terminate-btn').onclick = () => terminateSession(String(s.session_id || s.id));
      Modal.open('monitor-modal');
    }

    function terminateSession(id) {
      confirmAction('Terminate Session', 'This will disconnect all players from the session. Are you sure?', () => {
        const idx = DB.sessions.findIndex(s => String(s.session_id) === String(id) || s.id === id);
        if (idx > -1) DB.sessions.splice(idx, 1);
        DB.save();
        Modal.close('monitor-modal');
        Toast.success('Session terminated');
        renderStats(); renderSessions();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.requireAuth(['moderator']);
      if (!session) return;
      buildNavbar('moderator', 'sessions');
      renderStats(); renderSessions();
    });
  </script>
</body>

</html>
