<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlayCarys — Custom Room</title>
<link rel="stylesheet" href="../../css/variables.css"/>
<style>
  body {
    background: var(--bg-primary); /* Uses PlayCarys dark theme */
    color: var(--text-primary);
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  
  /* Invite Drawer */
  .invite-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; display: none; opacity: 0; transition: opacity 0.3s; }
  .invite-drawer { position: fixed; top: 0; left: -320px; bottom: 0; width: 320px; background: var(--bg-primary); z-index: 100; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid var(--border-primary); display: flex; flex-direction: column; }
  .invite-drawer.open { left: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
  .invite-overlay.open { display: block; opacity: 1; }
  .drawer-header { padding: 1.5rem; border-bottom: 1px solid var(--border-primary); display: flex; justify-content: space-between; align-items: center; }
  .friend-list { padding: 1rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
  .friend-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.05); }
  
  /* Responsive */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-secondary); border-bottom: 2px solid var(--accent-cyan);
    padding: 0.75rem 1.5rem;
  }
  .tb-title {
    font-weight: 800; font-family: 'Orbitron', monospace; font-size: 1.2rem;
    display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase;
  }
  .tb-id { color: var(--text-secondary); font-size: 0.8rem; font-family: monospace; }
  .btn-close {
    background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 0.4rem 1rem; border-radius: var(--radius-md); cursor: pointer; font-weight: 600;
  }

  /* Main Area */
  .lobby-container {
    display: flex; flex: 1; padding: 1.5rem; gap: 1.5rem; overflow: hidden; max-width: 1200px; margin: 0 auto; width: 100%;
  }

  /* Left Panel - Settings */
  .left-panel {
    flex: 0 0 350px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg);
    display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 1rem;
  }
  .game-cover { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border-primary); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .map-name {
    text-align: center; font-weight: 800; background: rgba(0,0,0,0.5); font-size: 0.9rem;
    padding: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-cyan);
  }
  .settings-group { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-primary); }
  .sg-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.6rem; }
  .sg-lbl { color: var(--text-secondary); font-weight: 500; }
  .sg-val { font-weight: 700; color: var(--text-primary); text-transform: uppercase; }
  
  .drop-list-title { color: var(--accent-cyan); font-weight: 800; text-transform: uppercase; margin-bottom: 0.75rem; font-size: 0.9rem; letter-spacing: 0.05em; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem; font-size: 0.8rem; }

  /* Right Panel - Slots */
  .right-panel {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .slots-header {
    background: var(--bg-secondary); padding: 0.75rem 1.25rem; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
    display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-primary);
  }
  
  .slots-grid {
    display: grid; grid-template-columns: 1fr 1fr; align-content: start; flex: 1; overflow-y: auto;
  }
  .slot-item {
    display: flex; align-items: center; border-bottom: 1px solid var(--border-primary); border-right: 1px solid var(--border-primary);
    padding: 0.5rem 1rem; height: 50px;
  }
  .slot-num { width: 30px; color: var(--text-muted); font-weight: 700; font-size: 0.9rem; }
  .slot-empty { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }
  .slot-filled { display: flex; align-items: center; gap: 0.75rem; flex: 1; font-size: 0.9rem; font-weight: 700; }
  .slot-av { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border-primary); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--accent-cyan); }

  /* Distance Chasing (1 Player) mode override */
  .slots-grid.single-player { grid-template-columns: 1fr; }
  .slot-item.single-player { height: 100px; font-size: 1.2rem; justify-content: center; background: rgba(0, 212, 255, 0.05); }

  /* Bottom Actions */
  .bottom-bar {
    background: var(--bg-secondary); padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid var(--border-primary); position: relative; z-index: 10;
  }
  .bb-left { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; max-width: 400px; position: relative; }
  .btn-invite { background: rgba(255,255,255,0.05); border: 1px solid var(--border-primary); color: var(--text-primary); padding: 0.6rem 1.25rem; font-weight: 600; cursor: pointer; border-radius: var(--radius-md); text-transform: uppercase; font-size: 0.8rem; transition: background 0.2s; align-self: flex-start; }
  .btn-invite:hover { background: rgba(255,255,255,0.1); }
  
  .chat-msg { font-size: 0.85rem; line-height: 1.3; word-wrap: break-word; }
  .chat-sender { font-weight: 800; color: var(--accent-yellow); margin-right: 0.3rem; }
  .chat-sender.me { color: var(--accent-cyan); }

  .bb-right { display: flex; align-items: center; gap: 1.5rem; }
  .room-card-icon { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0,212,255,0.3); color: var(--accent-cyan); padding: 0.4rem 0.8rem; font-weight: 700; font-size: 0.85rem; border-radius: var(--radius-md); }
  
  .btn-start { background: var(--gradient-brand); color: #fff; border: none; padding: 1rem 3rem; font-weight: 800; font-size: 1.1rem; cursor: pointer; border-radius: var(--radius-md); text-transform: uppercase; letter-spacing: 0.05em; transition: transform 0.2s, box-shadow 0.2s; }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
  
  .btn-leave { background: var(--bg-card); border: 1px solid var(--border-primary); color: var(--text-primary); padding: 0.8rem 1.5rem; font-weight: 600; cursor: pointer; border-radius: var(--radius-md); text-transform: uppercase; }

</style>
</head>
<body>

<div class="invite-overlay" id="invite-overlay" onclick="closeInviteDrawer()"></div>
<div class="invite-drawer" id="invite-drawer">
  <div class="drawer-header">
    <h3 style="margin:0;font-size:1.1rem;color:var(--text-primary)">📤 Invite Players</h3>
    <button class="btn btn-ghost" onclick="closeInviteDrawer()" style="padding:0.4rem;font-size:1.2rem;line-height:1">✕</button>
  </div>
  <div class="friend-list" id="friend-list">
    <!-- Populated by JS -->
  </div>
</div>

<div class="top-bar">
  <div class="tb-title" style="display:flex; align-items:center;">
    <button class="btn-ghost" onclick="goBackToSessions()" style="margin-right: 1.5rem; padding: 0.4rem 0.8rem; background: transparent; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; transition: color 0.2s;">&larr; Back to Sessions</button>
    <span style="color:#ffaa00; margin-right: 0.3rem;">⚔</span> <span id="r-name">Custom Room</span>
    <span class="tb-id" id="r-id">ID: ----</span>
    <button class="btn-invite" onclick="inviteFriends()" style="margin-left: 1rem; padding: 0.4rem 0.8rem; background: var(--accent-purple); color: #fff; font-size: 0.8rem; font-weight: 700; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: filter 0.2s;">+ Invite Friends</button>
  </div>
  <button class="btn-close" id="btn-top-close" onclick="leaveSession()">✕ Leave Room</button>
</div>

<div class="lobby-container">
  
  <!-- Left Panel -->
  <div class="left-panel">
    <div id="game-img-container"></div>
    <div class="map-name" id="l-map">Bermuda Day</div>
    
    <div class="settings-group">
      <div class="sg-row"><span class="sg-lbl">Room Mode</span><span class="sg-val" id="l-rmode">CASUAL</span></div>
      <div class="sg-row"><span class="sg-lbl">Room Type</span><span class="sg-val" id="l-rtype" style="color:#ffaa00">SOLO (0/48)</span></div>
      <div class="sg-row"><span class="sg-lbl">Game Mode</span><span class="sg-val" id="l-gmode">CLASSIC</span></div>
    </div>
    
    <div class="settings-group" style="margin-bottom: 0;">
      <div class="drop-list-title">DROP LIST &bull; CONFIG</div>
      <div class="config-grid" id="l-config">
        <!-- populated dynamically -->
      </div>
    </div>
    <div class="settings-group" style="margin-bottom: 0;">
      <div class="drop-list-title">DROP LIST &bull; CONFIG</div>
      <div class="config-grid" id="l-config">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="slots-header">
      <span id="host-name">HOST: ----</span>
      <span>NOT ENOUGH PLAYERS TO START</span>
    </div>
    <div class="slots-grid" id="slots-grid">
      <!-- slots injected via js -->
    </div>
  </div>
  
  <!-- Right Chat Panel -->
  <div class="chat-panel" style="flex: 0 0 320px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden;">
    <div style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary); padding: 0.75rem 1.25rem; font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan);">
      💬 LIVE ROOM CHAT
    </div>
    <div id="chat-history" style="flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;"></div>
    <div class="chat-box" style="border-top: 1px solid var(--border-primary); display: flex; background: var(--bg-secondary);">
      <span style="padding:0.6rem 0.4rem 0.6rem 0.8rem;color:var(--text-muted)">💬</span>
      <input type="text" id="chat-input" placeholder="Say hello..." onkeypress="if(event.key==='Enter') sendChat()" style="background:transparent;border:none;color:white;padding:0.6rem;outline:none;flex:1;font-size:0.85rem;"/>
      <button onclick="sendChat()" style="background:var(--accent-cyan);color:black;font-weight:bold;border:none;padding:0 1rem;cursor:pointer;transition:filter 0.2s;">SEND</button>
    </div>
  </div>

</div>

<div class="bottom-bar">
  <div class="bb-left" style="flex: 1;">
    <!-- Moved Chat to Left Panel -->
  </div>
  <div class="bb-right">
    <div class="room-card-icon" id="room-card-count">🎟 1</div>
    <button id="btn-action" class="btn-start" onclick="startGame()">START</button>
  </div>
</div>

<script src="../../data/db.js"></script>
<script src="../../js/utils.js"></script>
<script>
let sid = null;
let currentSession = null;
let currentGame = null;

function renderSettings(game) {
  const gType = (game.game_type || game.genre || 'Action').toLowerCase();
  let conf = {};

  if (gType === 'fps' || gType === 'battle royale') {
    conf = {
      "HP": "200", "EP": "0", "Character Skill": "YES", "Fall Damage": "YES", 
      "Loadout": "YES", "Limited Ammo": "YES", "Airdrop": "YES", "Movement Speed": "100%", "Vehicles": "YES"
    };
    document.getElementById('l-map').textContent = "Bermuda Day";
  } else if (gType === 'board' || game.id === 'g7') { // Chess
    conf = {
      "Time Control": "10 | 0", "Time Mode": "Rapid", "Engine Assist": "NO", "Takebacks": "NO", 
      "Premoves": "YES", "Rated": "YES", "Variant": "Standard"
    };
    document.getElementById('l-map').textContent = "Classic Board";
  } else if (gType === 'racing' || game.id === 'g8' || game.game_id == 8) { // Hill Climbing
    conf = {
      "Physics": currentSession.forkGravity ? `Grav: ${currentSession.forkGravity}` : "Bumpy", 
      "Fuel": "Limited", "Vehicle": "Jeep", "Upgrades": "Max", 
      "Weather": "Clear", "Gravity": currentSession.forkGravity || "Earth", "Infinite Map": "YES"
    };
    document.getElementById('l-map').textContent = "Countryside";
    
    if (!window.promptFork) {
        window.promptFork = function() {
            let grav = prompt("Remix Engine: Enter Custom Gravity (Default 20, Moon 5, Heavy 40):", "20");
            if(grav && !isNaN(grav)) {
                currentSession.forkGravity = parseInt(grav);
                DB.save();
                renderSettings(game);
                Toast.success("Room ruleset remixed! Players will use Gravity " + grav);
            }
        };
    }
    
    setTimeout(() => {
        const lp = document.querySelector('.left-panel');
        let fb = document.getElementById('fork-btn-hc');
        if (!fb && lp) {
             fb = document.createElement('button');
             fb.id = 'fork-btn-hc';
             fb.className = 'btn btn-purple btn-sm w-full';
             fb.style.marginTop = '1rem';
             fb.innerHTML = '⚙️ Fork / Remix Physics Mode';
             fb.onclick = window.promptFork;
             lp.appendChild(fb);
        }
    }, 100);
  } else if (gType === 'puzzle' || game.id === 'g9') { // Candy Crush
    conf = {
      "Moves Limit": "30", "Target Score": "10,000", "Powerups": "Allowed", "Shuffle": "Once", 
      "Difficulty": "Hard", "Timer": "NO"
    };
    document.getElementById('l-map').textContent = "Sweet Kingdom";
  } else {
    conf = { "Mode": "Standard", "Ranked": "NO", "Voice Chat": "YES", "Spectators": "YES" };
    document.getElementById('l-map').textContent = "Default Map";
  }

  const grid = document.getElementById('l-config');
  grid.innerHTML = Object.keys(conf).map(k => `
    <div><span style="color:#888">${k}</span></div>
    <div style="text-align:right;color:#e2e2e2;font-weight:bold">${conf[k]}</div>
  `).join('');
}

function renderSlots() {
  const players = currentSession.players || [];
  let max = currentSession.maxPlayers || 16;
  if (currentGame && currentGame.players) {
    const pStr = String(currentGame.players);
    const maxAllowed = parseInt(pStr.includes('-') ? pStr.split('-')[1] : pStr, 10);
    if (!isNaN(maxAllowed)) max = Math.min(max, maxAllowed);
  }
  const grid = document.getElementById('slots-grid');
  
  // Custom single-player view for Hill Climbing (Distance Chasing)
  const isDistanceChasing = (currentGame && (currentGame.id === 'g8' || currentGame.game_name === 'Hill Climbing'));
  
  let html = '';
  if (isDistanceChasing) {
    grid.className = 'slots-grid single-player';
    const isMeInIt = players.includes(Auth.getSession().userId);
    const uArr = players.map(pid => DB.users.find(x => x.id === pid));
    const p1 = uArr[0];
    
    html = `
      <div class="slot-item single-player">
        ${p1 ? `<div class="slot-filled" style="justify-content:center"><div class="slot-av" style="width:40px;height:40px;font-size:1.2rem">${p1.avatar||'??'}</div><span style="color:#ffaa00;font-size:1.5rem">${p1.username}</span></div>` 
             : `<div class="slot-empty" style="font-size:1.2rem;color:#666">READY FOR CHASE</div>`}
      </div>
    `;
    document.getElementById('l-rmode').textContent = 'DISTANCE CHASE';
    document.getElementById('l-rtype').textContent = `SINGLE (1/1)`;
  } else if (currentSession.mode === 'tournament' && currentGame) {
     let maxPower2 = Math.pow(2, Math.ceil(Math.log2(max)));
     if (maxPower2 < 2) maxPower2 = 2;
     let numRounds = Math.log2(maxPower2);
     
     if (!currentSession.bracket) {
        currentSession.bracket = [];
        for (let r=0; r<numRounds; r++) {
           currentSession.bracket.push(new Array(maxPower2 / Math.pow(2, r)).fill(null));
        }
        DB.save();
     }
     
     let dirty = false;
     players.forEach((pid, idx) => {
        if (currentSession.bracket[0] && String(currentSession.bracket[0][idx]) !== String(pid) && idx < maxPower2) {
           currentSession.bracket[0][idx] = pid;
           dirty = true;
        }
     });
     if (dirty) DB.save();
     
     grid.className = 'slots-grid';
     grid.style.display = 'flex';
     grid.style.padding = '1.5rem';
     grid.style.gap = '3rem';
     grid.style.overflowX = 'auto';
     grid.style.alignItems = 'center';
     
     const uid = Auth.getSession().userId;
     const isHost = String(currentSession.hostId) === String(uid);

     html += `<div style="display:flex; gap:3rem; min-width:max-content; align-items:center;">`;
     
     for (let r=0; r<numRounds; r++) {
        html += `<div style="display:flex; flex-direction:column; justify-content:space-around; gap:1.5rem; height:100%;">`;
        let slotsInRound = maxPower2 / Math.pow(2, r);
        let matchesInRound = slotsInRound / 2;
        
        for (let m=0; m<matchesInRound; m++) {
           let p1_id = currentSession.bracket[r][m*2];
           let p2_id = currentSession.bracket[r][m*2+1];
           
           let p1 = p1_id ? DB.users.find(u => String(u.id || u.user_id) === String(p1_id)) : null;
           let p2 = p2_id ? DB.users.find(u => String(u.id || u.user_id) === String(p2_id)) : null;
           let p1_name = p1 ? (p1.username || p1.user_name) : 'TBD';
           let p2_name = p2 ? (p2.username || p2.user_name) : 'TBD';
           
           let winner_id = (r + 1 < numRounds) ? currentSession.bracket[r+1][m] : currentSession.bracketWinner;
           let p1_win_class = (winner_id && String(winner_id) === String(p1_id)) ? 'background:rgba(16,185,129,0.2); border-color:#10b981;' : '';
           let p2_win_class = (winner_id && String(winner_id) === String(p2_id)) ? 'background:rgba(16,185,129,0.2); border-color:#10b981;' : '';

           let p1_action = (isHost && p1_id && !winner_id) ? `onclick="advanceTournament('${r}','${m}','${p1_id}')" style="cursor:pointer;" title="Advance to next round"` : '';
           let p2_action = (isHost && p2_id && !winner_id) ? `onclick="advanceTournament('${r}','${m}','${p2_id}')" style="cursor:pointer;" title="Advance to next round"` : '';
           let p1_hover = (isHost && p1_id && !winner_id) ? `onmouseenter="this.style.background='rgba(0,212,255,0.1)'" onmouseleave="this.style.background=''"` : '';
           let p2_hover = (isHost && p2_id && !winner_id) ? `onmouseenter="this.style.background='rgba(0,212,255,0.1)'" onmouseleave="this.style.background=''"` : '';

           html += `
             <div style="background:var(--bg-card); border:1px solid var(--border-primary); border-radius:var(--radius-md); width:200px; position:relative; box-shadow:0 4px 6px rgba(0,0,0,0.3);">
                <div ${p1_action} ${p1_hover} style="padding:0.6rem; border-bottom:1px solid var(--border-primary); ${p1_win_class} display:flex; align-items:center; gap:0.6rem; transition:background 0.2s; border-radius:var(--radius-md) var(--radius-md) 0 0;">
                   <div style="width:24px;height:24px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-muted);">${p1 ? p1_name.slice(0,2).toUpperCase() : '?'}</div>
                   <span style="font-size:0.85rem; font-weight:700; color:${p1?'#fff':'#666'}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p1_name}</span>
                </div>
                <div ${p2_action} ${p2_hover} style="padding:0.6rem; ${p2_win_class} display:flex; align-items:center; gap:0.6rem; transition:background 0.2s; border-radius:0 0 var(--radius-md) var(--radius-md);">
                   <div style="width:24px;height:24px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-muted);">${p2 ? p2_name.slice(0,2).toUpperCase() : '?'}</div>
                   <span style="font-size:0.85rem; font-weight:700; color:${p2?'#fff':'#666'}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p2_name}</span>
                </div>
             </div>
           `;
        }
        html += `</div>`;
     }
     
     html += `<div style="display:flex; flex-direction:column; justify-content:center;">`;
     let fw = currentSession.bracketWinner ? DB.users.find(u => String(u.id || u.user_id) === String(currentSession.bracketWinner)) : null;
     html += `
        <div style="background:rgba(245,158,11,0.1); border:2px solid var(--accent-yellow); border-radius:var(--radius-lg); width:180px; padding:1.5rem 1rem; text-align:center; box-shadow:0 0 20px rgba(245,158,11,0.2);">
           <div style="font-size:2rem; margin-bottom:0.5rem;">🏆</div>
           <div style="font-size:1.1rem; font-weight:800; color:var(--accent-yellow); text-transform:uppercase; word-break:break-all;">${fw ? (fw.username||fw.user_name) : 'CHAMPION'}</div>
        </div>
     `;
     html += `</div></div>`;
     
     document.getElementById('l-rmode').textContent = 'TOURNAMENT BRACKET';
     document.getElementById('l-rtype').textContent = `BRACKET (${players.length}/${maxPower2})`;

  } else {
    grid.className = 'slots-grid';
    const uid = Auth.getSession().userId;
    const isHost = String(currentSession.hostId) === String(uid);
    for (let i = 0; i < max; i++) {
      const pid = players[i];
      if (pid) {
        const u = DB.users.find(x => x.id === pid) || { username: 'Player '+pid, avatar: 'P' };
        const isThisHost = String(pid) === String(currentSession.hostId);
        const isMe = String(pid) === String(uid);
        const hostBadge = isThisHost ? `<span style="font-size:0.6rem;background:rgba(255,170,0,0.2);color:#ffaa00;border:1px solid rgba(255,170,0,0.5);border-radius:4px;padding:0.1rem 0.35rem;margin-left:0.4rem;">HOST</span>` : '';
        // Host can click on any Non-host slot to manage them
        const clickable = isHost && !isThisHost;
        html += `
          <div class="slot-item" ${clickable ? `onclick="openManagePlayer('${pid}','${u.username || u.user_name}')" style="cursor:pointer;"` : ''} 
               title="${clickable ? 'Click to manage player' : ''}"
               onmouseenter="${clickable ? 'this.style.background=\'rgba(0,212,255,0.06)\'':''}"
               onmouseleave="${clickable ? 'this.style.background=\'\''  :''}"
          >
            <span class="slot-num">${i+1}</span>
            <div class="slot-filled">
              <div class="slot-av" style="position:relative;">${u.avatar||u.username.slice(0,2).toUpperCase()}</div>
              <span style="cursor:pointer; position:relative; overflow:hidden;" onclick="showUserProfile('${u.username}', event)" onmouseover="this.style.color='var(--accent-cyan)'" onmouseout="this.style.color='inherit'">${u.username}</span>${hostBadge}
              ${clickable ? `<span style="margin-left:auto;font-size:0.75rem;color:var(--text-muted);">⚙</span>` : ''}
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="slot-item">
            <span class="slot-num">${i+1}</span>
            <div class="slot-empty">Empty</div>
          </div>
        `;
      }
    }
    document.getElementById('l-rmode').textContent = currentSession.mode ? currentSession.mode.toUpperCase() : 'CASUAL';
    document.getElementById('l-rtype').textContent = `PRIVATE (${players.length}/${max})`;
  }
  
  grid.innerHTML = html;
  
  // Start/Ready button logic
  const uid = Auth.getSession().userId;
  const isHost = currentSession.hostId === uid;
  const btn = document.getElementById('btn-action');
  
  if (currentSession.status === 'in-progress') {
    const topCloseBtn = document.getElementById('btn-top-close');
    if(topCloseBtn) topCloseBtn.style.display = 'none';
    
    btn.textContent = "REJOIN GAME";
    btn.style.background = "#ffbb00";
    btn.onclick = () => {
      if (currentGame && currentGame.img === 'chess') window.location.href = '../../games/chess/index.html?sid=' + currentSession.id;
      else window.location.href = 'dashboard.html';
    };
  } else if (isHost) {
    btn.textContent = "START";
    btn.onclick = () => startGame();
    const topCloseBtn = document.getElementById('btn-top-close');
    if(topCloseBtn){
      topCloseBtn.innerHTML = '✕ Disband Room';
      topCloseBtn.style.color = '#ef4444';
      topCloseBtn.style.borderColor = 'rgba(239, 68, 68, 0.6)';
    }
  } else {
    btn.textContent = "READY";
    btn.style.background = "#10b981"; // green ready
    btn.onclick = () => { btn.style.background = "#ffaa00"; btn.textContent = "WAITING..."; };
  }
}

function goBackToSessions() {
  let redirect = 'join-session.html';
  if (currentSession && (currentSession.gameId || currentSession.game_id)) {
    redirect += '?gameId=' + (currentSession.gameId || currentSession.game_id);
  }
  window.location.href = redirect;
}

function executeLeave() {
  const uid = Auth.getSession()?.userId;
  if(uid && currentSession) {
    if (String(currentSession.hostId) === String(uid)) {
      // If game in progress, just mark disbanded — don't delete, let players finish
      if (currentSession.status === 'in-progress') {
        currentSession.disbanded = true;
        DB.save();
      } else {
        // Pre-game: fully delete the session
        DB.sessions = DB.sessions.filter(s => String(s.id) !== String(currentSession.id) && String(s.session_id) !== String(currentSession.session_id));
        DB.player_session = DB.player_session.filter(ps => String(ps.session_id) !== String(currentSession.session_id));
        DB.save();
      }
    } else {
      currentSession.players = currentSession.players.filter(p => String(p) !== String(uid));
      DB.player_session = DB.player_session.filter(ps => !(String(ps.session_id) === String(currentSession.session_id) && String(ps.player_id) === String(uid)));
      DB.save();
    }
  }
  let redirect = 'join-session.html';
  if (currentSession && (currentSession.gameId || currentSession.game_id)) {
    redirect += '?gameId=' + (currentSession.gameId || currentSession.game_id);
  }
  window.location.href = redirect;
}

function leaveSession() {
  const uid = Auth.getSession()?.userId;
  if(!uid || !currentSession) return;
  
  if(String(currentSession.hostId) === String(uid)) {
    confirmAction(
      'Disband Room',
      'You are the host. Leaving will disband the room for everyone. Continue?',
      () => executeLeave()
    );
  } else {
    confirmAction(
      'Leave Room',
      'Are you sure you want to leave this room?',
      () => executeLeave()
    );
  }
}

/** Check if a game has a working engine in /games/ folder */
function hasEngine(gameId) {
  // Only Chess (7) and Hill Climbing (8) are currently integrated
  const implemented = ['7', '8'];
  const gid = String(gameId).replace('g', '');
  return implemented.includes(gid);
}

function startGame() {
  if (!hasEngine(currentSession.gameId || currentSession.game_id)) {
    Toast.info("Coming soon! 🚀 This game engine is currently being integrated.");
    return;
  }

  const pCount = currentSession.players.length;
  let min = 1;
  if (currentGame && currentGame.players) {
    const pStr = String(currentGame.players);
    min = parseInt(pStr.split('-')[0], 10);
    if (isNaN(min)) min = 1;
  }
  
  if (pCount < min) {
    Toast.error(`Cannot Start: This game requires at least ${min} player(s)!`);
    return;
  }

  confirmAction(
    'Start Match',
    'Are you absolutely ready to jump into the game?',
    () => {
      currentSession.status = 'in-progress';
      DB.save();
      
      const gImg = currentGame?.img || 'generic';
      window.location.href = `../../games/${gImg}/index.html?sid=` + (currentSession.id || currentSession.session_id);
    }
  );
}

function openInviteDrawer() {
  // Block invites if the room is already full
  if (currentSession && currentGame) {
    const maxPlayers = parseInt(String(currentGame.players || '8').split('-').pop(), 10);
    const currentCount = currentSession.players?.length || 0;
    if (currentCount >= maxPlayers) {
      Toast.error('Room is full! No more players can be invited.');
      return;
    }
  }

  document.getElementById('invite-overlay').classList.add('open');
  document.getElementById('invite-drawer').classList.add('open');
  
  // Populate users
  const flist = document.getElementById('friend-list');
  const session = Auth.getSession();
  if(!session) return;
  const uid = String(session.userId);
  
  // Exclusively load from Friends list
  const userObj = DB.users.find(u => String(u.user_id) === uid);
  let friendsList = [];
  if (userObj && userObj.friends) {
     friendsList = userObj.friends.map(f => DB.users.find(x => x.user_name === f.name)).filter(Boolean);
  }
  
  // Optional demo fallback directly ported from utils.js if mock friends missing
  if (friendsList.length === 0 && ['DragonSlayer', 'NightHawk', 'ShadowMaster'].includes(session.username)) {
      const fallbackNames = ['NightHawk', 'PhoenixRise', 'ShadowMaster'].filter(n => n !== session.username);
      friendsList = DB.users.filter(u => fallbackNames.includes(u.user_name));
  }
  
  if(!friendsList.length) {
    flist.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:1rem;">You do not have any friends yet. Add friends using the Global Navbar!</div>';
    return;
  }
  
  flist.innerHTML = friendsList.map(u => {
    // Check if already in room
    const inRoom = currentSession.players.includes(String(u.user_id));
    return `
      <div class="friend-item">
        <div style="font-weight:600;font-size:0.9rem">${u.user_name}</div>
        <button class="btn ${inRoom ? 'btn-ghost' : 'btn-purple'} btn-sm" 
          onclick="${inRoom ? '' : `sendInvite('${u.user_id}', '${u.user_name}')`}" 
          ${inRoom ? 'disabled' : ''}>
          ${inRoom ? 'In Room' : 'Invite'}
        </button>
      </div>
    `;
  }).join('');
}

function closeInviteDrawer() {
  document.getElementById('invite-overlay').classList.remove('open');
  document.getElementById('invite-drawer').classList.remove('open');
}

function sendInvite(targetId, targetName) {
  const session = Auth.getSession();
  const roomName = currentSession.name;
  if (!DB.notifications) DB.notifications = [];
  DB.notifications.push({
    id: Date.now(),
    toRole: null,
    toUser: parseInt(targetId, 10),
    from: session.username,
    avatar: session.username.slice(0,2).toUpperCase(),
    fromRole: 'player',
    fromUserId: session.userId,
    msg: `invited you to join room "${roomName}".`,
    type: 'invite',
    sessionId: currentSession.id || currentSession.session_id,
    time: "Just now",
    read: false,
    replies: []
  });
  DB.save();
  Toast.success(`Invite sent to ${targetName}!`);
  closeInviteDrawer();
}

function inviteFriends() {
  openInviteDrawer();
}

function sendChat() {
  const inp = document.getElementById('chat-input');
  const txt = inp.value.trim();
  if(!txt) return;
  if(!currentSession.chat) currentSession.chat = [];
  const session = Auth.getSession();
  currentSession.chat.push({ senderId: session.userId, sender: session.username, text: txt, time: Date.now() });
  DB.save();
  inp.value = '';
  renderChat();
}

function renderChat() {
  const hist = document.getElementById('chat-history');
  if(!currentSession.chat || currentSession.chat.length === 0) {
    hist.innerHTML = '<div style="color:var(--text-muted);font-style:italic;font-size:0.8rem;text-align:center;padding:1rem;">Say hi to the room!</div>';
    return;
  }
  const myId = Auth.getSession().userId;
  let html = '';
  currentSession.chat.slice(-20).forEach(msg => {
    const isMe = String(msg.senderId) === String(myId);
    html += `<div class="chat-msg"><span class="chat-sender ${isMe?'me':''}" style="cursor:pointer;" onclick="showUserProfile('${msg.sender}', event)">${msg.sender}:</span><span style="color:#e2e2e2">${msg.text}</span></div>`;
  });
  
  const isScrolledToBottom = hist.scrollHeight - hist.clientHeight <= hist.scrollTop + 30;
  hist.innerHTML = html;
  if(isScrolledToBottom) hist.scrollTop = hist.scrollHeight;
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  sid = params.get('sid');
  const session = Auth.requireAuth(['player', 'guest']);
  if (!session) return;
  
  currentSession = DB.sessions.find(s => String(s.id) === String(sid) || String(s.session_id) === String(sid));
  
  if (!currentSession) {
    Toast.error("Room not found!");
    setTimeout(() => { window.location.href = 'join-session.html'; }, 1500);
    return;
  }
  
  // Ensure player is added (this handles the ?sid= parameter auto-join)
  const uid = session.userId;
  if (!currentSession.players.includes(uid)) {
    if (currentSession.players.length < currentSession.maxPlayers) {
      currentSession.players = [...currentSession.players, uid]; // Invokes setter
      DB.save();
    } else {
      Toast.error("Room is full!");
      setTimeout(() => { window.location.href = 'join-session.html'; }, 1500);
      return;
    }
  }

  currentGame = DB.games.find(g => g.id === currentSession.gameId || g.game_id === currentSession.game_id);
  
  // Top bar info
  document.getElementById('r-name').textContent = currentSession.name;
  document.getElementById('r-id').textContent = 'ID: ' + String(currentSession.id || currentSession.session_id).toUpperCase();
  document.getElementById('host-name').textContent = 'HOST: ' + currentSession.host;

  
  // Game Cover extraction using utils getter
  if (currentGame) {
    // Extract real path from utils getGameIconHTML
    const div = document.createElement('div');
    // For the banner, we just want the real image
    div.innerHTML = getGameIconHTML(currentGame, 0, '100%', 'height:180px;border-radius:8px 8px 0 0;object-fit:cover');
    const lmap = document.getElementById('game-img-container');
    lmap.appendChild(div);
  }

  renderSettings(currentGame || {});
  renderSlots();
  renderChat();
  
  // Native Cross-Tab Sync Mechanism for Live Updates
  window.addEventListener('storage', (e) => {
    if (e.key === 'playcarys_db_store_v2' && sid && currentSession) {
      try {
        const parsed = JSON.parse(e.newValue);
        const updatedSession = parsed.sessions.find(s => String(s.id) === String(sid) || String(s.session_id) === String(sid));
        const myUid = Auth.getSession()?.userId;
        
        if (updatedSession && parsed.player_session) {
          // Reconstruct players array natively, since JSON.parse strips getters
          updatedSession.players = parsed.player_session
            .filter(ps => String(ps.session_id) === String(updatedSession.session_id))
            .map(ps => String(ps.player_id));
        }

        if (updatedSession) {
          // Check for new players or bracket updates
          const oldPCount = currentSession.players?.length || 0;
          const newPCount = updatedSession.players?.length || 0;
          
          let bracketChanged = false;
          if (currentSession.mode === 'tournament') {
             if (JSON.stringify(currentSession.bracket) !== JSON.stringify(updatedSession.bracket) ||
                 currentSession.bracketWinner !== updatedSession.bracketWinner) {
                 bracketChanged = true;
             }
          }
          
          if (oldPCount !== newPCount || bracketChanged) {
             currentSession.players = updatedSession.players;
             if (bracketChanged) {
                 currentSession.bracket = updatedSession.bracket;
                 currentSession.bracketWinner = updatedSession.bracketWinner;
             }
             renderSlots();
          }
          
          // Check if I was kicked
          if (oldPCount > newPCount && !updatedSession.players.includes(String(myUid))) {
            Toast.error('You were removed from this room by the host.');
            setTimeout(() => { window.location.href = 'join-session.html'; }, 2000);
            return;
          }
          // Check for new chat messages
          const oldChatLen = currentSession.chat?.length || 0;
          const newChatLen = updatedSession.chat?.length || 0;
          if (newChatLen > oldChatLen) {
            currentSession.chat = updatedSession.chat;
            renderChat();
          }
          // Check game start
          if (updatedSession.status === 'in-progress' && currentSession.status !== 'in-progress') {
            currentSession.status = 'in-progress';
            renderSlots();
            Toast.success('The host has started the game! Teleporting...');
            setTimeout(() => {
              document.getElementById('btn-action').click(); // Auto join game
            }, 1000);
          }
          // Check if host disbanded mid-lobby (not in-game)
          if (updatedSession.disbanded && currentSession.status !== 'in-progress') {
            Toast.error('The host has disbanded this room.');
            setTimeout(() => { window.location.href = 'join-session.html'; }, 2500);
          }
        } else {
          // Session was deleted from DB (pre-match disband)
          if (String(currentSession.hostId) !== String(myUid)) {
            // Only affect non-host players
            confirmAction('Room Disbanded', 'The host has disbanded this room. You will be returned to the sessions page.', () => {
              window.location.href = 'join-session.html';
            });
          }
        }
      } catch(err) {}
    }
  });

});

// ── Host: manage player popup ────────────────────────────────────
function openManagePlayer(playerId, playerName) {
  const uid = Auth.getSession()?.userId;
  if(!currentSession || String(currentSession.hostId) !== String(uid)) return;
  // Don't allow host to manage themselves
  if(String(playerId) === String(uid)) return;

  confirmAction(
    `Manage: ${playerName}`,
    `Kick "${playerName}" from this room?`,
    () => kickPlayer(playerId, playerName)
  );
}

function kickPlayer(playerId, playerName) {
  if(!currentSession) return;
  currentSession.players = currentSession.players.filter(p => String(p) !== String(playerId));
  DB.player_session = DB.player_session.filter(
    ps => !(String(ps.session_id) === String(currentSession.session_id) && String(ps.player_id) === String(playerId))
  );
  
  if (currentSession.mode === 'tournament' && currentSession.bracket && currentSession.bracket[0]) {
      currentSession.bracket[0] = currentSession.bracket[0].map(p => String(p) === String(playerId) ? null : p);
  }
  
  currentSession.kicked = currentSession.kicked || [];
  currentSession.kicked.push(String(playerId));
  DB.save();
  Toast.success(`${playerName} has been kicked from the room.`);
  renderSlots();
}

// ── Host: Bracket Advance ─────────────────────────────────────
window.advanceTournament = function(roundStr, matchStr, playerId) {
    let r = parseInt(roundStr, 10);
    let m = parseInt(matchStr, 10);
    currentSession.bracket = currentSession.bracket || [];
    
    if (r + 1 < currentSession.bracket.length) {
        currentSession.bracket[r+1][m] = playerId;
        Toast.success("Player advanced to the next round!");
    } else {
        currentSession.bracketWinner = playerId;
        currentSession.status = 'finished';
        Toast.success("Tournament Winner Crowned! 🏆");
    }
    
    DB.save();
    renderSlots();
}
</script>
