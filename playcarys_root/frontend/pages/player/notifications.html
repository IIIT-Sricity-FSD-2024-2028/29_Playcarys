<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlayCarys — Notification Hub</title>
<link rel="stylesheet" href="../../css/variables.css"/>
<style>
/* ── Notification Hub ──────────────────────────────────── */
.notif-shell { max-width:860px; margin:0 auto; }

/* Category Tabs */
.notif-tabs { display:flex; gap:0.4rem; margin-bottom:1.5rem; flex-wrap:wrap; }
.notif-tab {
  padding:0.45rem 1.1rem;
  border-radius:var(--radius-md);
  font-size:0.8rem; font-weight:600;
  cursor:pointer;
  border:1px solid var(--border-primary);
  color:var(--text-secondary);
  background:transparent;
  transition:all 0.15s;
  position:relative;
}
.notif-tab:hover { border-color:rgba(0,212,255,0.3); color:var(--text-primary); }
.notif-tab.active { background:rgba(0,212,255,0.1); border-color:var(--accent-cyan); color:var(--accent-cyan); }
.notif-tab .tab-count {
  display:inline-block; background:var(--accent-cyan); color:#000;
  border-radius:99px; font-size:0.6rem; font-weight:900;
  padding:0.05rem 0.38rem; margin-left:0.3rem; vertical-align:middle;
}
.notif-tab.active .tab-count { background:var(--accent-purple); color:#fff; }

/* Notification Item */
.notif-item {
  background:var(--bg-card);
  border:1px solid var(--border-primary);
  border-radius:var(--radius-lg);
  padding:1.1rem 1.25rem;
  display:flex;
  gap:1rem;
  margin-bottom:0.75rem;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.notif-item::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--border-primary);
  border-radius:3px 0 0 3px;
}
.notif-item.unread { background:rgba(0,212,255,0.02); }
.notif-item.unread::before { background:var(--accent-cyan); }
.notif-item.type-warning::before { background:var(--accent-yellow); }
.notif-item.type-ban::before { background:var(--accent-red); }
.notif-item.type-reward::before { background:var(--accent-green); }
.notif-item.type-tournament::before { background:var(--accent-purple); }
.notif-item:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.3); }

.notif-icon-wrap {
  width:44px; height:44px; border-radius:50%;
  background:var(--bg-secondary);
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; flex-shrink:0;
}
.notif-body { flex:1; min-width:0; }
.notif-msg { font-size:0.88rem; line-height:1.5; color:var(--text-primary); }
.notif-meta { font-size:0.7rem; color:var(--text-secondary); margin-top:0.3rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
.notif-from-badge { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:99px; padding:0.1rem 0.5rem; font-weight:600; }
.notif-actions { display:flex; gap:0.5rem; margin-top:0.7rem; flex-wrap:wrap; }
.notif-unread-dot { width:8px; height:8px; border-radius:50%; background:var(--accent-cyan); flex-shrink:0; margin-top:0.4rem; }
.notif-reply-input { width:100%; background:var(--bg-secondary); border:1px solid var(--border-primary); border-radius:var(--radius-md); padding:0.6rem 0.9rem; font-size:0.82rem; color:var(--text-primary); resize:none; margin-top:0.5rem; font-family:inherit; }
.notif-reply-input:focus { outline:none; border-color:var(--accent-cyan); }

/* Stats bar */
.notif-stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:0.7rem; margin-bottom:1.5rem; }
@media(max-width:600px){ .notif-stats-row { grid-template-columns:1fr 1fr; } }
.notif-stat { background:var(--bg-card); border:1px solid var(--border-primary); border-radius:var(--radius-md); padding:0.75rem 1rem; }
.notif-stat-val { font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:900; }
.notif-stat-lbl { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-secondary); margin-top:0.2rem; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div class="page-wrapper">
<div class="page-content">

  <div class="page-header-row mb-2">
    <div style="display:flex;align-items:center;gap:1rem">
      <button class="btn btn-ghost" onclick="window.location.href='dashboard.html'" style="padding:0.5rem">❮ Dashboard</button>
      <div>
        <h1 style="margin-bottom:0">🔔 Notification Hub</h1>
        <p class="text-muted" style="margin-top:0.25rem">Stay updated with matches, rewards, and platform alerts</p>
      </div>
    </div>
    <div style="display:flex;gap:0.6rem">
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">✓ Mark All Read</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--accent-red)" onclick="clearAll()">🗑 Clear</button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="notif-stats-row" id="notif-stats"></div>

  <!-- Category Tabs -->
  <div class="notif-tabs" id="notif-tabs"></div>

  <div class="notif-shell">
    <div id="page-notif-list"></div>
  </div>

</div>
</div>

<div id="toast-container"></div>
<script src="../../data/db.js"></script>
<script src="../../js/utils.js"></script>
<script>
let activeTab = 'all';

// Inline time formatter — timeAgo was not defined globally
function formatNotifTime(t) {
  if (!t) return '';
  // Already relative string like '5h ago', 'just now', '1d ago'
  if (typeof t === 'string' && t.includes('ago') || t === 'just now') return t;
  // Try to parse as date
  const d = new Date(t);
  if (isNaN(d.getTime())) return t;
  const diff = Date.now() - d.getTime();
  if (diff < 60000)   return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000)return Math.floor(diff / 3600000) + 'h ago';
  return Math.floor(diff / 86400000) + 'd ago';
}

const TYPE_CONFIG = {
  friend_request: { icon:'👤', label:'Social',     color:'#7c3aed', cat:'social' },
  invite:         { icon:'🎮', label:'Game Invite', color:'#00d4ff', cat:'game'   },
  tournament:     { icon:'🏆', label:'Tournament',  color:'#f59e0b', cat:'tournament' },
  reward:         { icon:'💰', label:'Reward',      color:'#10b981', cat:'reward' },
  warning:        { icon:'⚠️', label:'Warning',     color:'#f59e0b', cat:'system' },
  ban:            { icon:'🚫', label:'Ban Notice',  color:'#ef4444', cat:'system' },
  report:         { icon:'📋', label:'Report',      color:'#6366f1', cat:'system' },
  escalation:     { icon:'📨', label:'Escalation',  color:'#f59e0b', cat:'system' },
  system:         { icon:'🔧', label:'System',      color:'#6b7a99', cat:'system' },
};

function getTypeConfig(n) {
  if (n.type && TYPE_CONFIG[n.type]) return TYPE_CONFIG[n.type];
  const msg = (n.msg || '').toLowerCase();
  if (msg.includes('warning') || msg.includes('[moderator escalation]')) return TYPE_CONFIG['warning'];
  if (msg.includes('ban')) return TYPE_CONFIG['ban'];
  if (msg.includes('reward') || msg.includes('pcp') || msg.includes('bonus')) return TYPE_CONFIG['reward'];
  if (msg.includes('tournament')) return TYPE_CONFIG['tournament'];
  if (msg.includes('report')) return TYPE_CONFIG['report'];
  return TYPE_CONFIG['system'];
}

function getCat(n) { return getTypeConfig(n).cat; }

function render() {
  const session = Auth.getSession();
  const uid = parseInt(session.userId, 10);

  const all = DB.notifications
    .filter(n => n.toUser === uid || n.toRole === session.role)
    .sort((a,b) => b.id - a.id);

  const unread = all.filter(n => !n.read);

  // Counts per category
  const cats = { all: all.length, unread: unread.length, game: 0, social: 0, tournament: 0, system: 0, reward: 0 };
  all.forEach(n => { const c = getCat(n); if (cats[c] !== undefined) cats[c]++; });

  // Stats
  document.getElementById('notif-stats').innerHTML = [
    { label: 'Total', val: all.length, color:'var(--accent-cyan)' },
    { label: 'Unread', val: unread.length, color:'var(--accent-yellow)' },
    { label: 'Game', val: cats.game + cats.tournament, color:'var(--accent-purple)' },
    { label: 'System', val: cats.system, color:'var(--text-secondary)' },
  ].map(s => `
    <div class="notif-stat">
      <div class="notif-stat-val" style="color:${s.color}">${s.val}</div>
      <div class="notif-stat-lbl">${s.label}</div>
    </div>`).join('');

  // Tabs
  const TABS = [
    { id:'all',        label:'All',       count: all.length },
    { id:'unread',     label:'Unread',    count: unread.length },
    { id:'game',       label:'🎮 Game',   count: cats.game },
    { id:'tournament', label:'🏆 Events', count: cats.tournament },
    { id:'social',     label:'👥 Social', count: cats.social },
    { id:'reward',     label:'💰 Rewards',count: cats.reward },
    { id:'system',     label:'⚙️ System', count: cats.system },
  ];
  document.getElementById('notif-tabs').innerHTML = TABS.map(t => `
    <div class="notif-tab ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${t.label}
      ${t.count > 0 ? `<span class="tab-count">${t.count}</span>` : ''}
    </div>`).join('');

  // Filter by tab
  let filtered = all;
  if (activeTab === 'unread') filtered = unread;
  else if (activeTab !== 'all') filtered = all.filter(n => getCat(n) === activeTab);

  if (!filtered.length) {
    document.getElementById('page-notif-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">✅</div>
        <h3>${activeTab === 'unread' ? 'All caught up!' : 'Nothing here'}</h3>
        <p>${activeTab === 'unread' ? 'No unread notifications.' : 'No notifications in this category.'}</p>
      </div>`;
    return;
  }

  document.getElementById('page-notif-list').innerHTML = filtered.map(n => {
    const tc = getTypeConfig(n);
    const catClass = `type-${getCat(n)}`;
    const icon = n.avatar && n.avatar.length <= 2 ? `<div style="background:linear-gradient(135deg,${tc.color}44,${tc.color}22);border:1px solid ${tc.color}55;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:800;color:${tc.color}">${n.avatar}</div>` : `<div class="notif-icon-wrap" style="background:${tc.color}18;border:1px solid ${tc.color}33">${tc.icon}</div>`;

    const replies = (n.replies || []);
    const repliesHTML = replies.length ? `
      <div style="margin-top:0.6rem;border-left:2px solid rgba(255,255,255,0.08);padding-left:0.75rem;display:flex;flex-direction:column;gap:0.4rem">
        ${replies.map(r => `<div style="font-size:0.78rem;color:var(--text-secondary)"><strong style="color:var(--text-primary)">${r.from}:</strong> ${r.msg}</div>`).join('')}
      </div>` : '';

    return `
    <div class="notif-item ${n.read ? '' : 'unread'} ${catClass}" id="notif-${n.id}">
      ${icon}
      <div class="notif-body">
        <div class="notif-msg">${n.msg}</div>
        <div class="notif-meta">
          <span class="notif-from-badge">${n.fromRole || 'System'}: ${n.from || 'PlayCarys'}</span>
          <span>${formatNotifTime(n.time)}</span>
          <span style="background:${tc.color}22;color:${tc.color};border-radius:99px;padding:0.1rem 0.45rem;font-size:0.65rem;font-weight:700;border:1px solid ${tc.color}44">${tc.label}</span>
        </div>
        ${repliesHTML}
        ${!n.read ? `<div class="notif-actions">
          ${n.type === 'friend_request' ? `
            <button class="btn btn-sm btn-primary" onclick="acceptFriendReq(${n.id}); render()">Accept</button>
            <button class="btn btn-sm btn-ghost" onclick="rejectFriendReq(${n.id}); render()">Decline</button>
          ` : n.type === 'invite' ? `
            <button class="btn btn-sm btn-cyan" onclick="acceptInviteReq(${n.id})">Join Room</button>
            <button class="btn btn-sm btn-ghost" onclick="rejectInviteReq(${n.id}); render()">Decline</button>
          ` : ''}
          <button class="btn btn-sm btn-ghost" onclick="toggleReply(${n.id})">💬 Reply</button>
          <button class="btn btn-sm btn-ghost" onclick="markRead(${n.id})" style="font-size:0.72rem">✓ Read</button>
        </div>` : `<div style="margin-top:0.5rem"><button class="btn btn-ghost btn-sm" onclick="toggleReply(${n.id})" style="font-size:0.7rem">💬 Reply</button></div>`}
        <div id="reply-box-${n.id}" style="display:none;margin-top:0.5rem">
          <textarea class="notif-reply-input" id="reply-text-${n.id}" rows="2" placeholder="Write a reply…"></textarea>
          <div style="display:flex;gap:0.5rem;margin-top:0.4rem">
            <button class="btn btn-sm btn-primary" onclick="sendReply(${n.id})">Send</button>
            <button class="btn btn-sm btn-ghost" onclick="toggleReply(${n.id})">Cancel</button>
          </div>
        </div>
      </div>
      ${!n.read ? '<div class="notif-unread-dot"></div>' : ''}
    </div>`;
  }).join('');
}

function setTab(tab) {
  activeTab = tab;
  render();
}

function toggleReply(id) {
  const box = document.getElementById(`reply-box-${id}`);
  if (box) { box.style.display = box.style.display === 'none' ? 'block' : 'none'; }
}

function sendReply(notifId) {
  const txt = document.getElementById(`reply-text-${notifId}`)?.value?.trim();
  if (!txt) { Toast.error('Reply cannot be empty'); return; }
  const n = DB.notifications.find(x => x.id === notifId);
  if (!n) return;
  if (!n.replies) n.replies = [];
  const session = Auth.getSession();
  n.replies.push({ from: session.username, msg: txt, time: new Date().toISOString() });
  n.read = true;
  DB.save();
  Toast.success('Reply sent');
  render();
}

function markRead(id) {
  const n = DB.notifications.find(x => x.id === id);
  if (n) n.read = true;
  DB.save(); render(); updateNavBadge && updateNavBadge();
}

function markAllRead() {
  const session = Auth.getSession();
  const uid = parseInt(session.userId, 10);
  DB.notifications.forEach(n => { if(n.toUser === uid || n.toRole === session.role) n.read = true; });
  DB.save(); render(); updateNavBadge && updateNavBadge();
  Toast.success('All notifications marked as read');
}

function clearAll() {
  confirmAction('Clear All', 'Permanently delete all your notifications?', () => {
    const session = Auth.getSession();
    const uid = parseInt(session.userId, 10);
    DB.notifications = DB.notifications.filter(n => !(n.toUser === uid || n.toRole === session.role));
    DB.save(); render(); updateNavBadge && updateNavBadge();
    Toast.success('All notifications cleared');
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const session = Auth.requireAuth(['player', 'publisher', 'admin', 'superuser', 'moderator']);
  if (!session) return;
  buildNavbar(session.role, 'dashboard');
  render();
});
</script>
</body>
</html>
