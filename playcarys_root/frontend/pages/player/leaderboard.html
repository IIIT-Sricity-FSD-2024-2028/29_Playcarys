<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlayCarys — Global Leaderboard</title>
<link rel="stylesheet" href="../../css/variables.css"/>
<style>
/* Podium */
.podium { display:flex; justify-content:center; align-items:flex-end; gap:1.5rem; margin-bottom:2.5rem; flex-wrap:wrap; }
.podium-slot { text-align:center; position:relative; }
.podium-slot .plinth { background:var(--bg-card); border:1px solid var(--border-primary); border-radius:var(--radius-xl) var(--radius-xl) 0 0; display:flex; flex-direction:column; align-items:center; padding:1.5rem 1.75rem 1rem; width:180px; transition:all 0.3s; }
.podium-slot.rank-1 .plinth { background:linear-gradient(175deg,rgba(245,158,11,0.18),rgba(245,158,11,0.04)); border-color:rgba(245,158,11,0.5); box-shadow:0 0 30px rgba(245,158,11,0.12); }
.podium-slot.rank-2 .plinth { background:linear-gradient(175deg,rgba(192,192,192,0.12),rgba(192,192,192,0.02)); border-color:rgba(192,192,192,0.3); }
.podium-slot.rank-3 .plinth { background:linear-gradient(175deg,rgba(205,127,50,0.12),rgba(205,127,50,0.02)); border-color:rgba(205,127,50,0.3); }
.base-block { background:var(--bg-secondary); border:1px solid var(--border-primary); border-top:none; width:180px; border-radius:0 0 var(--radius-lg) var(--radius-lg); }
.podium-slot.rank-1 .base-block { height:60px; }
.podium-slot.rank-2 .base-block { height:40px; }
.podium-slot.rank-3 .base-block { height:24px; }
.podium-rank-medal { position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:2rem; }
.podium-avatar { width:64px; height:64px; border-radius:50%; background:var(--bg-secondary); border:3px solid var(--border-primary); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; margin-bottom:0.75rem; }
.podium-slot.rank-1 .podium-avatar { border-color:var(--accent-yellow); box-shadow:0 0 24px rgba(245,158,11,0.5); animation: glow-gold 2s infinite alternate; }
.podium-slot.rank-2 .podium-avatar { border-color:#c0c0c0; }
.podium-slot.rank-3 .podium-avatar { border-color:#cd7f32; }
@keyframes glow-gold { from { box-shadow:0 0 16px rgba(245,158,11,0.4); } to { box-shadow:0 0 32px rgba(245,158,11,0.7); } }
.podium-name { font-weight:800; font-size:0.95rem; margin-bottom:0.25rem; cursor:pointer; }
.podium-pts { font-family:'Orbitron',monospace; font-size:1.1rem; font-weight:800; color:var(--accent-cyan); }

/* Your Rank Banner */
.my-rank-banner {
  background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.06));
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: var(--radius-lg);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

/* Search + Filter */
.lb-filter { display:flex; gap:0.75rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.tab-row { display:flex; gap:0.4rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.lb-tab { padding:0.35rem 0.9rem; border-radius:var(--radius-md); font-size:0.78rem; font-weight:600; cursor:pointer; border:1px solid var(--border-primary); color:var(--text-secondary); background:transparent; transition:all 0.15s; }
.lb-tab:hover { border-color:rgba(0,212,255,0.3); color:var(--text-primary); }
.lb-tab.active { background:rgba(0,212,255,0.1); border-color:var(--accent-cyan); color:var(--accent-cyan); }

/* Rankings table */
.lb-row { display:grid; grid-template-columns:60px 1fr 110px 80px 80px 90px; align-items:center; gap:0.75rem; padding:0.85rem 1.25rem; background:var(--bg-card); border:1px solid var(--border-primary); border-radius:var(--radius-lg); margin-bottom:0.5rem; transition:all .18s; }
.lb-row:hover { background:rgba(0,212,255,0.04); border-color:rgba(0,212,255,0.2); transform:translateX(4px); }
.lb-row.me-row { border-color:var(--accent-cyan); background:rgba(0,212,255,0.06); box-shadow:0 0 16px rgba(0,212,255,0.06); }
.lb-rank-num { font-family:'Orbitron',monospace; font-weight:800; font-size:1.05rem; color:var(--text-secondary); text-align:center; }
.lb-player { display:flex; align-items:center; gap:0.75rem; min-width:0; }
.lb-pcp-val { font-family:'Orbitron',monospace; font-weight:800; color:var(--accent-cyan); font-size:0.9rem; text-align:right; }
.lb-col-header { font-size:0.65rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.07em; font-weight:700; }
.tier-badge { font-size:0.62rem; font-weight:700; padding:0.15rem 0.45rem; border-radius:99px; }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div class="page-wrapper">
<div class="page-content">

  <div class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</div>

  <div class="page-header" style="text-align:center;margin-bottom:2rem">
    <h1 style="font-size:2.2rem">🏆 Global Champions</h1>
    <p class="text-muted">Top competitive players ranked by PlayCarys Points (PCP)</p>
  </div>

  <!-- Podium -->
  <div id="podium-container" class="podium"></div>

  <!-- Your Rank Banner -->
  <div class="my-rank-banner" id="my-rank-banner" style="display:none">
    <div style="font-size:2rem">🎯</div>
    <div style="flex:1">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-secondary);margin-bottom:0.2rem">Your Current Rank</div>
      <div id="my-rank-text" style="font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:900;color:var(--accent-cyan)"></div>
    </div>
    <div style="text-align:right">
      <div id="my-rank-pcp" style="font-family:'Orbitron',monospace;font-size:0.95rem;font-weight:700;color:var(--accent-yellow)"></div>
      <div id="my-rank-gap" style="font-size:0.72rem;color:var(--text-secondary);margin-top:0.2rem"></div>
    </div>
  </div>

  <!-- Tabs + Search -->
  <div class="lb-filter">
    <div style="flex:1;min-width:200px;position:relative">
      <span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--text-secondary)">🔍</span>
      <input class="form-input" id="lb-search" placeholder="Search player…" oninput="render()" style="padding-left:2.2rem"/>
    </div>
    <select class="form-select" id="lb-sort" onchange="render()" style="width:160px">
      <option value="pcp">🏅 By PCP</option>
      <option value="wins">🏆 By Wins</option>
      <option value="elo">⚡ By Elo</option>
      <option value="streaks">🔥 By Streak</option>
    </select>
  </div>

  <!-- Column Headers -->
  <div class="lb-row" style="background:transparent;border-color:transparent;padding-bottom:0.25rem;margin-bottom:0">
    <div class="lb-col-header" style="text-align:center">Rank</div>
    <div class="lb-col-header">Player</div>
    <div class="lb-col-header" style="text-align:right">PCP Points</div>
    <div class="lb-col-header" style="text-align:center">Wins</div>
    <div class="lb-col-header" style="text-align:center">Elo</div>
    <div class="lb-col-header" style="text-align:center">Streak</div>
  </div>

  <div id="leaderboard-list"></div>

</div>
</div>

<div id="toast-container"></div>
<script src="../../data/db.js"></script>
<script src="../../js/utils.js"></script>
<script>
// navigate() provided globally by utils.js

function render() {
  const session = Auth.getSession();
  const myUid = session ? parseInt(session.userId, 10) : null;
  const search = (document.getElementById('lb-search')?.value || '').toLowerCase().trim();
  const sortBy = document.getElementById('lb-sort')?.value || 'pcp';

  // Build enriched player list
  let players = DB.player_profiles.map(p => {
    const user = DB.users.find(u => u.user_id === p.user_id);
    const mySessions = DB.sessions.filter(s => (s.players||[]).includes(p.user_id) || (s.players||[]).includes(String(p.user_id)));
    const totalMatches = user?.matches || mySessions.length || 0;
    const wins = user?.wins || p.matches_won || 0;
    const elo = user?.elo || 1200;
    const winRate = totalMatches > 0 ? Math.round((wins / totalMatches) * 100) : 0;
    const streak = user?.loginStreak || 0;
    const tier = (typeof Economy !== 'undefined' && Economy.getTierFromElo) ? Economy.getTierFromElo(elo) : { name:'Bronze', color:'#d97706' };
    return { p, user, wins, elo, winRate, streak, tier, totalMatches };
  });

  // Sort
  if (sortBy === 'wins') players.sort((a,b) => b.wins - a.wins);
  else if (sortBy === 'elo') players.sort((a,b) => b.elo - a.elo);
  else if (sortBy === 'streaks') players.sort((a,b) => b.streak - a.streak);
  else players.sort((a,b) => (b.p.carys_points||0) - (a.p.carys_points||0));

  // Search filter
  if (search) players = players.filter(({ user }) => (user?.username||user?.user_name||'').toLowerCase().includes(search));

  // ── My Rank Banner ───────────────────────────────────────────
  const myIdx = players.findIndex(({ p }) => p.user_id === myUid);
  const myRankBanner = document.getElementById('my-rank-banner');
  if (myIdx >= 0 && myRankBanner) {
    myRankBanner.style.display = 'flex';
    const myData = players[myIdx];
    const myRank = myIdx + 1;
    document.getElementById('my-rank-text').textContent = `#${myRank} of ${players.length}`;
    document.getElementById('my-rank-pcp').textContent = (myData.p.carys_points||0).toLocaleString() + ' PCP';
    if (myIdx > 0) {
      const above = players[myIdx - 1];
      const gap = (above.p.carys_points||0) - (myData.p.carys_points||0);
      document.getElementById('my-rank-gap').textContent = `${gap} PCP behind #${myRank-1} ${above.user?.username||''}`;
    } else {
      document.getElementById('my-rank-gap').textContent = '🏆 You are #1!';
    }
  }

  // ── Podium (top 3) ──────────────────────────────────────────
  const medalEmoji = ['🥇','🥈','🥉'];
  const podiumOrder = [1, 0, 2];
  const podiumEl = document.getElementById('podium-container');
  podiumEl.innerHTML = podiumOrder.filter(i => players[i]).map(i => {
    const { p, user, wins, elo, tier } = players[i];
    const rank = i + 1;
    const isMe = p.user_id === myUid;
    const name = user?.username || user?.user_name || 'Unknown';
    return `
    <div class="podium-slot rank-${rank}">
      <div style="position:relative">
        <div class="podium-rank-medal">${medalEmoji[i]}</div>
        <div class="plinth">
          <div class="podium-avatar">${user?.avatar || name.slice(0,2).toUpperCase()}</div>
          <div class="podium-name" onclick="showUserProfile('${name}', event)">${name} ${isMe ? '⭐' : ''}</div>
          <div style="font-size:0.68rem;margin:0.2rem 0"><span class="tier-badge" style="background:${tier.color}22;color:${tier.color};border:1px solid ${tier.color}44">${tier.name}</span></div>
          <div class="podium-pts">${(p.carys_points||0).toLocaleString()}</div>
          <div style="font-size:0.68rem;color:var(--text-secondary);margin-top:0.3rem">⚡ ${elo} Elo · 🏆 ${wins}W</div>
        </div>
      </div>
      <div class="base-block"></div>
    </div>`;
  }).join('');

  // ── Ranked List ──────────────────────────────────────────────
  const list = document.getElementById('leaderboard-list');
  list.innerHTML = players.map(({ p, user, wins, elo, winRate, streak, tier }, i) => {
    const isMe = p.user_id === myUid;
    const rank = i + 1;
    const rankDisplay = rank <= 3 ? medalEmoji[i] : `#${rank}`;
    const name = user?.username || user?.user_name || 'Unknown';
    return `
    <div class="lb-row ${isMe ? 'me-row' : ''}">
      <div class="lb-rank-num">${rankDisplay}</div>
      <div class="lb-player">
        <div class="avatar">${user?.avatar || name.slice(0,2).toUpperCase()}</div>
        <div style="min-width:0">
          <div style="font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" onclick="showUserProfile('${name}', event)">
            ${name} ${isMe ? '<span class="badge badge-cyan" style="font-size:0.5rem;vertical-align:middle">YOU</span>' : ''}
          </div>
          <div style="display:flex;align-items:center;gap:0.35rem;margin-top:0.15rem">
            <span class="tier-badge" style="background:${tier.color}22;color:${tier.color};border:1px solid ${tier.color}44">${tier.name}</span>
            <span style="font-size:0.65rem;color:var(--text-secondary)">${winRate}% WR</span>
          </div>
        </div>
      </div>
      <div class="lb-pcp-val">${(p.carys_points||0).toLocaleString()}</div>
      <div style="text-align:center;font-weight:700;color:var(--accent-green)">${wins}</div>
      <div style="text-align:center;font-family:'Orbitron',monospace;font-size:0.82rem;color:${tier.color}">${elo}</div>
      <div style="text-align:center;font-size:0.82rem">${streak > 0 ? `🔥 ${streak}d` : '<span style="color:var(--text-muted)">—</span>'}</div>
    </div>`;
  }).join('') || `<div class="empty-state"><div class="icon">🔍</div><h3>No players found</h3><p>Try a different search term</p></div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const session = Auth.requireAuth(['player', 'guest']);
  if (!session) return;
  buildNavbar(session.role, 'leaderboard');
  render();
});
</script>
</body>
</html>
