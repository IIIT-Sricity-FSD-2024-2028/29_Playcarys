<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PlayCarys — Admin Dashboard</title>
  <link rel="stylesheet" href="../../css/variables.css" />
</head>

<body>
  <div id="navbar" class="navbar"></div>
  <div class="page-wrapper">
    <div class="page-content">

      <!-- Header -->
      <div class="page-header">
        <h1>Admin Dashboard</h1>
        <p>Platform administration and management</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid stats-grid-4" id="stats-grid"></div>

      <!-- Distribution & Overview -->
      <div class="cards-grid-2 mt-3" id="overview-section"></div>

      <!-- Recent Activity -->
      <div class="card mt-3">
        <div class="flex items-center justify-between mb-2">
          <h3>Recent Activity</h3>
          <button class="btn btn-ghost btn-sm" onclick="navigate('approvals')">View Approvals →</button>
        </div>
        <div id="activity-list"></div>
      </div>

      <!-- Quick Actions -->
      <div class="section-cards mt-3" id="quick-actions"></div>

    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../data/db.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    // navigate() provided globally by utils.js

    function contactSuperAdmin() {
      const session = Auth.getSession();
      if (!session) return;
      const superusers = DB.users.filter(u => u.role_id === 1 || (u.role && u.role === 'superuser'));
      if (!superusers.length) { Toast.error('No super admins available.'); return; }
      const target = superusers[Math.floor(Math.random() * superusers.length)];
      const msg = prompt('Message to Super Admin (describe the policy issue or escalation):');
      if (!msg || !msg.trim()) return;
      DB.notifications.push({
        id: Date.now(),
        toRole: null,
        toUser: target.user_id,
        from: session.username,
        avatar: session.avatar || session.username.slice(0,2).toUpperCase(),
        fromRole: 'admin',
        fromUserId: parseInt(session.userId, 10),
        msg: '[Admin Escalation] ' + msg.trim(),
        time: 'just now',
        read: false,
        replies: []
      });
      DB.save();
      Toast.success('Escalation sent to ' + (target.user_name || target.username) + ' (Super Admin).');
    }

    function contactModerators() {
      const session = Auth.getSession();
      if (!session) return;
      const moderators = DB.users.filter(u => u.role_id === 3 || (u.role && u.role === 'moderator'));
      if (!moderators.length) { Toast.error('No moderators found.'); return; }
      const msg = prompt('Broadcast message to ALL Moderators:');
      if (!msg || !msg.trim()) return;
      const ts = Date.now();
      moderators.forEach((mod, i) => {
        DB.notifications.push({
          id: ts + i,
          toRole: null,
          toUser: mod.user_id,
          from: session.username,
          avatar: session.avatar || session.username.slice(0,2).toUpperCase(),
          fromRole: 'admin',
          fromUserId: parseInt(session.userId, 10),
          msg: '[Admin Broadcast] ' + msg.trim(),
          time: 'just now',
          read: false,
          replies: []
        });
      });
      DB.save();
      Toast.success('Broadcast sent to ' + moderators.length + ' moderator(s).');
    }


    function render() {
      const stats = getPlatformStats();

      // Stats grid
      document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="label">Total Users</div><div class="value text-cyan">${stats.totalUsers}</div><div class="icon">👥</div></div>
    <div class="stat-card"><div class="label">Active Games</div><div class="value text-green">${stats.activeGames}</div><div class="icon">🎮</div></div>
    <div class="stat-card"><div class="label">Pending Approvals</div><div class="value text-yellow">${stats.pendingGames}</div><div class="icon">✅</div></div>
    <div class="stat-card"><div class="label">Moderators</div><div class="value text-purple">${stats.moderators}</div><div class="icon">🛡️</div></div>
  `;

      // Overview
      document.getElementById('overview-section').innerHTML = `
    <div class="card">
      <h3 class="mb-2">User Distribution</h3>
      ${[
          ['Players', stats.players, stats.totalUsers, 'var(--accent-cyan)'],
          ['Publishers', stats.publishers, stats.totalUsers, 'var(--accent-green)'],
          ['Moderators', stats.moderators, stats.totalUsers, 'var(--accent-purple)'],
          ['Admins', stats.admins, stats.totalUsers, 'var(--accent-yellow)']
        ].map(([name, count, total, color]) => {
          const pct = total ? Math.round(count / total * 100) : 0;
          return `<div class="analytics-bar-row">
          <div class="analytics-bar-label">${name}</div>
          <div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <span style="width:60px;text-align:right;font-size:0.82rem">${count} <span style="color:var(--text-secondary)">${pct}%</span></span>
        </div>`;
        }).join('')}
    </div>
    <div class="card">
      <h3 class="mb-2">Games Overview</h3>
      ${[
          ['Total Games', DB.games.length, 'var(--text-primary)'],
          ['Approved', stats.approvedGames, 'var(--accent-green)'],
          ['Pending Approval', stats.pendingGames, 'var(--accent-yellow)'],
          ['Active', stats.activeGames, 'var(--accent-cyan)']
        ].map(([label, val, color]) =>
          `<div class="analytics-bar-row">
          <div class="analytics-bar-label">${label}</div>
          <div style="flex:1"></div>
          <span style="font-size:1rem;font-weight:700;color:${color}">${val}</span>
        </div>`
        ).join('')}
    </div>
  `;

      // Activity
      document.getElementById('activity-list').innerHTML = DB.activityLog.map(a => {
        const icons = { publisher: '🟢', approval: '🟡', player: '🔵', tournament: '🏆', ban: '🔴' };
        return `<div class="list-item" style="padding:0.85rem 1.25rem">
      <span style="font-size:1.1rem">${icons[a.type] || '📌'}</span>
      <div class="list-item-info">
        <span style="font-size:0.875rem">${a.msg}</span>
        <div class="text-sm text-muted mt-1">${a.time}</div>
      </div>
    </div>`;
      }).join('');

      // Quick actions
      document.getElementById('quick-actions').innerHTML = `
    <div class="section-card" style="border-color:rgba(245,158,11,0.35);background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(0,212,255,0.04))" onclick="navigate('hub')">
      <div class="section-card-icon">👑</div>
      <h3 style="color:var(--accent-yellow)">Admin Hub</h3>
      <p>Full control panel — analytics, audit log, tournament control, system commands</p>
      <div class="section-card-badge"><span class="badge badge-admin">Full Access</span></div>
    </div>
    <div class="section-card" onclick="navigate('users')">
      <div class="section-card-icon">👥</div>
      <h3>Manage Users</h3>
      <p>View, edit, and manage all user accounts and roles</p>
      <div class="section-card-badge">${badgeHTML('active')}</div>
    </div>
    <div class="section-card" onclick="navigate('approvals')">
      <div class="section-card-icon">✅</div>
      <h3>Game Approvals</h3>
      <p>Review and approve games submitted by publishers</p>
      ${stats.pendingGames > 0 ? `<div class="section-card-badge"><span class="badge badge-pending">${stats.pendingGames} Pending</span></div>` : ''}
    </div>
    <div class="section-card" onclick="navigate('settings')">
      <div class="section-card-icon">⚙️</div>
      <h3>System Settings</h3>
      <p>Configure platform-wide settings and preferences</p>
    </div>
    <div class="section-card" style="border-color:rgba(124,58,237,0.4);background:linear-gradient(135deg,rgba(124,58,237,0.07),rgba(0,212,255,0.04))" onclick="contactSuperAdmin()">
      <div class="section-card-icon">🚨</div>
      <h3 style="color:var(--accent-purple)">Contact Super Admin</h3>
      <p>Escalate a policy decision or critical issue to a Super Administrator</p>
      <div class="section-card-badge"><span class="badge" style="background:rgba(124,58,237,0.2);color:var(--accent-purple);border:1px solid rgba(124,58,237,0.3)">Escalate Up</span></div>
    </div>
    <div class="section-card" style="border-color:rgba(0,212,255,0.35);background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(124,58,237,0.04))" onclick="contactModerators()">
      <div class="section-card-icon">📡</div>
      <h3 style="color:var(--accent-cyan)">Broadcast to Moderators</h3>
      <p>Send a message to all moderators on duty — directives, alerts, or announcements</p>
      <div class="section-card-badge"><span class="badge" style="background:rgba(0,212,255,0.15);color:var(--accent-cyan);border:1px solid rgba(0,212,255,0.3)">Broadcast</span></div>
    </div>
  `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.requireAuth(['admin', 'superuser']);
      if (!session) return;
      buildNavbar('admin', 'dashboard');
      render();
    });
  </script>
</body>

</html>
