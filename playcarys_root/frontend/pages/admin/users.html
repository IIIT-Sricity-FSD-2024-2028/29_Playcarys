<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlayCarys — Role Management</title>
<link rel="stylesheet" href="../../css/variables.css"/>
</head>
<body>
<div id="navbar" class="navbar"></div>
<div class="page-wrapper">
<div class="page-content">

  <div class="page-header-row">
    <div>
      <h1>Role Management</h1>
      <p class="text-muted">Manage user roles and permissions</p>
    </div>
    <button class="btn btn-primary" onclick="openAddUser()">+ Add User</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid stats-grid-4 mt-2" id="stats-row"></div>

  <!-- Filter & Search -->
  <div class="filter-bar mt-3">
    <div class="search-wrap" style="max-width:320px">
      <span class="search-icon">🔍</span>
      <input class="form-input" id="search-input" placeholder="Search users..." oninput="applyFilters()"/>
    </div>
    <select class="form-select" id="role-filter" onchange="applyFilters()" style="width:160px">
      <option value="">All Roles</option>
      <option value="player">Players</option>
      <option value="publisher">Publishers</option>
      <option value="moderator">Moderators</option>
      <option value="admin">Admins</option>
    </select>
    <select class="form-select" id="status-filter" onchange="applyFilters()" style="width:160px">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="banned">Banned</option>
    </select>
  </div>

  <!-- User List -->
  <div id="user-list"></div>

</div>
</div>

<!-- ADD / EDIT USER MODAL -->
<div class="modal-overlay" id="user-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add User</h3>
      <span class="modal-close" onclick="Modal.close('user-modal')">✕</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <input type="hidden" id="edit-user-id"/>
      <div class="form-group">
        <label class="form-label">Username <span class="required">*</span></label>
        <input class="form-input" id="f-username" placeholder="Username"/>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input class="form-input" id="f-email" type="email" placeholder="email@example.com"/>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Role <span class="required">*</span></label>
        <select class="form-select" id="f-role">
          <option value="player">Player</option>
          <option value="publisher">Publisher</option>
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
        <span class="form-error"></span>
      </div>
      <div class="form-group" id="password-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <input class="form-input" id="f-password" type="password" placeholder="Min 8 chars, uppercase, number"/>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="f-status" disabled>
          <option value="active">Active</option>
          <option value="banned">Banned</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>
      <!-- Actions Section -->
      <div id="actions-panel" style="display:none; margin-top:0.5rem; padding-top:1rem; border-top:1px solid var(--border-primary)">
        <h4 style="margin-bottom:0.75rem;font-size:0.85rem">Administrative Actions</h4>
        <div id="actions-container" style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="Modal.close('user-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveUser()">Save User</button>
    </div>
  </div>
</div>

<!-- VIEW USER MODAL -->
<div class="modal-overlay" id="view-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">User Details</h3>
      <span class="modal-close" onclick="Modal.close('view-modal')">✕</span>
    </div>
    <div id="view-content"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="Modal.close('view-modal')">Close</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../../data/db.js"></script>
<script src="../../js/utils.js"></script>
<script>
// navigate() provided globally by utils.js

function renderStats() {
  const s = getPlatformStats();
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="label">Players</div><div class="value text-cyan">${s.players}</div><div class="icon">🎮</div></div>
    <div class="stat-card"><div class="label">Publishers</div><div class="value text-green">${s.publishers}</div><div class="icon">⬆️</div></div>
    <div class="stat-card"><div class="label">Moderators</div><div class="value text-purple">${s.moderators}</div><div class="icon">🛡️</div></div>
    <div class="stat-card"><div class="label">Total Users</div><div class="value">${s.totalUsers}</div><div class="icon">👥</div></div>
  `;
}

function renderUsers(users) {
  const me = Auth.getSession() || { role: 'player' };
  const list = document.getElementById('user-list');
  if (!users.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">👥</div><h3>No users found</h3><p>No users match your filters</p></div>`;
    return;
  }
  list.innerHTML = users.map(u => {
    const canManage = !(me.role === 'admin' && u.role === 'superuser');
    return `
    <div class="list-item">
      <div class="avatar">${u.avatar}</div>
      <div class="list-item-info">
        <div class="list-item-title">${u.username}</div>
        <div class="list-item-sub">
          <span>${u.email}</span>
          ${badgeHTML(u.role)}
          ${u.status==='banned' ? badgeHTML('banned') : u.status==='suspended' ? badgeHTML('suspended') : ''}
        </div>
      </div>
      <div class="list-item-actions">
        ${canManage ? `<button class="btn btn-outline btn-sm" onclick="editUser('${u.id}')">⚙️ Manage</button>` : `<span style="font-size:0.8rem;color:var(--text-secondary);padding-right:0.5rem">🔒 System restricted</span>`}
      </div>
    </div>`;
  }).join('');
}

function applyFilters() {
  const q = document.getElementById('search-input').value;
  const role = document.getElementById('role-filter').value;
  const status = document.getElementById('status-filter').value;
  let users = filterList(DB.users, q, ['username','email']);
  const me = Auth.getSession();
  users = users.filter(u => u.id !== me?.userId);
  if (role) users = users.filter(u => u.role === role);
  if (status) users = users.filter(u => u.status === status);
  renderUsers(users);
}

function openAddUser() {
  document.getElementById('modal-title').textContent = 'Add User';
  document.getElementById('edit-user-id').value = '';
  document.getElementById('f-username').value = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-role').value = 'player';
  document.getElementById('f-role').disabled = false;
  document.getElementById('f-password').value = '';
  document.getElementById('f-status').value = 'active';
  document.getElementById('password-group').style.display = '';
  document.getElementById('actions-panel').style.display = 'none';
  document.getElementById('save-btn').textContent = 'Add User';
  Modal.open('user-modal');
}

function editUser(id) {
  const me = Auth.getSession();
  const u = DB.users.find(u => u.id===id);
  if (!u) return;
  if (me.role === 'admin' && u.role === 'superuser') {
    Toast.error('Admins cannot modify Superuser accounts.');
    return;
  }
  document.getElementById('modal-title').textContent = 'Edit User';
  document.getElementById('edit-user-id').value = u.id;
  document.getElementById('f-username').value = u.username;
  document.getElementById('f-email').value = u.email;
  document.getElementById('f-role').value = u.role;
  document.getElementById('f-role').disabled = true; // Admin cannot change roles of existing users
  document.getElementById('f-password').value = '';
  document.getElementById('f-status').value = u.status;
  document.getElementById('password-group').style.display = 'none';
  document.getElementById('save-btn').textContent = 'Save Changes';

  const actsPanel = document.getElementById('actions-panel');
  const actsContainer = document.getElementById('actions-container');
  actsPanel.style.display = 'block';
  actsContainer.innerHTML = '';
  
  if (u.role === 'admin') {
     actsContainer.innerHTML = `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-yellow);color:var(--accent-yellow)" onclick="warnUser('${u.id}')">⚠️ Warn Admin</button>`;
  } else {
     actsContainer.innerHTML += `<div style="width:100%;margin-bottom:0.5rem"><input type="text" id="action-reason" class="form-input" placeholder="Reason (Required for action, sent to user)" style="width:100%;font-size:0.8rem;padding:0.35rem 0.6rem"/></div>`;
     if (u.status === 'suspended') {
       actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-green);color:var(--accent-green);margin-right:0.5rem" onclick="revokeSuspendUser('${u.id}')">▶️ Revoke Suspension</button>`;
     } else {
       actsContainer.innerHTML += `
         <input type="number" id="suspend-days" class="form-input" placeholder="Days" style="width:70px;padding:0.25rem 0.5rem;font-size:0.8rem;height:32px" min="1"/>
         <button class="btn btn-ghost btn-sm" style="border-color:var(--accent-purple);color:var(--accent-purple);margin-right:0.5rem" onclick="suspendUser('${u.id}')">⏸ Suspend</button>
       `;
     }
     
     if (u.role === 'player') {
       if (u.status !== 'banned') {
         actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-red);color:var(--accent-red);margin-right:0.5rem" onclick="banUser('${u.id}')">🚫 Ban Player</button>`;
         actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-red);background:rgba(239, 68, 68, 0.1);color:var(--accent-red)" onclick="banAndDeleteUser('${u.id}')">🚫 Ban + Delete</button>`;
       } else {
         actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-green);color:var(--accent-green)" onclick="unbanUser('${u.id}')">✅ Unban Player</button>`;
       }
     } else if (u.role === 'publisher') {
       if (u.status !== 'banned') {
         actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-red);color:var(--accent-red)" onclick="banUser('${u.id}')">🚫 Ban Publisher</button>`;
       } else {
         actsContainer.innerHTML += `<button class="btn btn-ghost btn-sm" style="border-color:var(--accent-green);color:var(--accent-green)" onclick="unbanUser('${u.id}')">✅ Unban Publisher</button>`;
       }
     }
  }

  Modal.open('user-modal');
}

function saveUser() {
  const isEdit = !!document.getElementById('edit-user-id').value;
  const uEl = document.getElementById('f-username');
  const eEl = document.getElementById('f-email');
  const pEl = document.getElementById('f-password');
  const rules = [
    { el:uEl, rules:[{type:'required'},{type:'minLen',n:3},{type:'maxLen',n:20}] },
    { el:eEl, rules:[{type:'required'},{type:'email'}] }
  ];
  if (!isEdit) rules.push({ el:pEl, rules:[{type:'required'},{type:'password'}] });
  if (!Validate.form(rules)) return;

  const username = uEl.value.trim();
  const email = eEl.value.trim();
  const role = document.getElementById('f-role').value;
  const status = document.getElementById('f-status').value;
  const editId = document.getElementById('edit-user-id').value;

  if (DB.users.find(u => u.username.toLowerCase()===username.toLowerCase() && u.id!==editId)) {
    Validate.field(uEl,[{type:'custom',fn:()=>false,msg:'Username already taken'}]); return;
  }
  if (DB.users.find(u => u.email.toLowerCase()===email.toLowerCase() && u.id!==editId)) {
    Validate.field(eEl,[{type:'custom',fn:()=>false,msg:'Email already registered'}]); return;
  }

  if (isEdit) {
    const u = DB.users.find(u => u.id===editId);
    const roleMap = { 'player': 4, 'publisher': 5, 'moderator': 3, 'admin': 2, 'superuser': 1 };
    u.user_name = username;
    u.email = email;
    if(role) u.role_id = roleMap[role] || u.role_id;
    u.status = status;
    u.avatar = username.slice(0,2).toUpperCase();
    Toast.success('User updated successfully');
  } else {
    const numId = Date.now();
    const roleMap = { 'player': 4, 'publisher': 5, 'moderator': 3, 'admin': 2, 'superuser': 1 };
    DB.users.push({ 
      user_id: numId, user_name: username, role_id: roleMap[role] || 4,
      email, status, 
      password: pEl.value, avatar: username.slice(0, 2).toUpperCase(), 
      joinDate: new Date().toISOString().slice(0, 10), 
      lastSeen: new Date().toISOString().slice(0, 10) 
    });
    
    if (role === 'player') {
      if (!DB.player_profiles) DB.player_profiles = [];
      DB.player_profiles.push({ user_id: numId, player_name: username, carys_points: 100, play_time: 0, matches_won: 0, player_status: true });
    } else if (role === 'publisher') {
      if (!DB.publisher_profiles) DB.publisher_profiles = [];
      DB.publisher_profiles.push({ user_id: numId, total_games: 0, approved_games: 0, active_games: 0 });
    }
    Toast.success('User added successfully');
  }
  DB.save();
  Modal.close('user-modal');
  window.location.reload();
}

function warnUser(id) {
  const u = DB.users.find(u=>u.id===id);
  Toast.warning(`Warning issued to Admin ${u.username}`);
  Modal.close('user-modal');
}

function suspendUser(id) {
  const u = DB.users.find(u=>u.id===id);
  const days = document.getElementById('suspend-days').value || 1;
  const reasonEl = document.getElementById('action-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { Toast.error('Action Reason is required.'); return; }
  const s = Auth.getSession();
  confirmAction('Suspend User', `Suspend ${u.username} for ${days} days?`, () => {
    u.status = 'suspended';
    u.suspendUntil = new Date(Date.now() + days*86400000).toISOString();
    dispatchUserNotification(u.username, s.role, s.username, `You have been suspended for ${days} days. Reason: ${reason}`);
    DB.save();
    Toast.success(`${u.username} suspended for ${days} days`);
    Modal.close('user-modal');
    applyFilters(); renderStats();
  });
}

function revokeSuspendUser(id) {
  const u = DB.users.find(u=>u.id===id);
  const reasonEl = document.getElementById('action-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { Toast.error('Action Reason is required.'); return; }
  const s = Auth.getSession();
  u.status = 'active';
  delete u.suspendUntil;
  dispatchUserNotification(u.username, s.role, s.username, `Your suspension has been revoked. Note: ${reason}`);
  DB.save();
  Toast.success(`${u.username} suspension revoked`);
  Modal.close('user-modal');
  applyFilters(); renderStats();
}

function banUser(id) {
  const u = DB.users.find(u=>u.id===id);
  const s = Auth.getSession();
  if (!u) return;
  const reasonEl = document.getElementById('action-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { Toast.error('Action Reason is required.'); return; }
  confirmAction('Ban User', `Permanently ban ${u.username}? They will lose access to the platform.`, () => {
    u.status = 'banned';
    dispatchUserNotification(u.username, s.role, s.username, `You have been permanently banned. Reason: ${reason}`);
    DB.save();
    Toast.success(`${u.username} has been permanently banned`);
    Modal.close('user-modal');
    window.location.reload();
  });
}

function banAndDeleteUser(id) {
  const u = DB.users.find(u=>u.id===id);
  if (!u) return;
  const s = Auth.getSession();
  const reasonEl = document.getElementById('action-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { Toast.error('Action Reason is required.'); return; }
  confirmAction('Ban & Delete User', `Permanently ban AND delete ${u.username}? This action is irreversible.`, () => {
    u.status = 'banned';
    dispatchUserNotification(u.username, s.role, s.username, `You have been permanently banned and deleted. Reason: ${reason}`);
    DB.save();
    const idx = DB.users.findIndex(user=>user.id===id);
    if(idx !== -1) DB.users.splice(idx,1);
    DB.save();
    Toast.success(`${u.username} banned and deleted`);
    Modal.close('user-modal');
    window.location.reload();
  });
}

function unbanUser(id) {
  const u = DB.users.find(u=>u.id===id);
  if (!u) return;
  u.status = 'active';
  Toast.success(`${u.username} has been unbanned`);
  Modal.close('user-modal');
  applyFilters(); renderStats();
}

function deleteUser(id) {
  const u = DB.users.find(u=>u.id===id);
  if (!u) return;
  confirmAction('Delete User', `Permanently delete ${u.username}? This cannot be undone.`, () => {
    const idx = DB.users.findIndex(u=>u.id===id);
    DB.users.splice(idx,1);
    Toast.success('User deleted');
    applyFilters(); renderStats();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const session = Auth.requireAuth(['admin','superuser']);
  if (!session) return;
  buildNavbar('admin','users');
  renderStats();
  applyFilters();
});
</script>
</body>
</html>
