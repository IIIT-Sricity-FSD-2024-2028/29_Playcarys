<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PlayCarys — Superuser · Admin Management</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <style>
    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color var(--trans-med), transform var(--trans-fast);
      position: relative;
      overflow: hidden;
    }

    .admin-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--ac, var(--gradient-brand));
      border-radius: 0 2px 2px 0;
    }

    .admin-card:hover {
      border-color: rgba(0, 212, 255, 0.25);
      transform: translateX(2px);
    }

    .admin-card.superuser-card {
      --ac: linear-gradient(180deg, #f59e0b, #ef4444);
      border-color: rgba(245, 158, 11, 0.2);
    }

    .admin-card.admin-card-style {
      --ac: linear-gradient(180deg, #00d4ff, #7c3aed);
    }

    .admin-card.moderator-card {
      --ac: var(--accent-purple);
    }

    .admin-card.suspended {
      opacity: 0.65;
      border-color: rgba(245, 158, 11, 0.3);
    }

    /* Suspend badge */
    .badge-suspended {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
    }
  </style>
</head>

<body>
  <div id="navbar" class="navbar"></div>
  <div class="page-wrapper">
    <div class="page-content">

      <div class="page-header-row">
        <div>
          <h1>👑 Admin Management</h1>
          <p class="text-muted">Create Admin / Moderator accounts, demote admins or suspend staff</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Create Account</button>
      </div>

      <!-- Stats -->
      <div class="stats-grid stats-grid-3 mt-2 mb-3" id="admin-kpis"></div>

      <!-- Admins -->
      <h2 class="mb-2" style="font-size:1rem;color:var(--accent-cyan)">👑 Admins</h2>
      <div id="admin-list" class="mb-3"></div>

      <!-- Moderators -->
      <h2 class="mb-2" style="font-size:1rem;color:var(--accent-purple)">🛡️ Moderators</h2>
      <div id="mod-list"></div>

    </div>
  </div>

  <!-- CREATE ACCOUNT MODAL -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">➕ Create Staff Account</h3>
        <span class="modal-close" onclick="Modal.close('create-modal')">✕</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="cards-grid-2">
          <div class="form-group">
            <label class="form-label">Username <span class="required">*</span></label>
            <input class="form-input" id="ca-username" placeholder="Staff username" />
            <span class="form-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label">Email <span class="required">*</span></label>
            <input class="form-input" id="ca-email" type="email" placeholder="staff@example.com" />
            <span class="form-error"></span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Role <span class="required">*</span></label>
          <!-- No superuser option — only one superuser allowed -->
          <select class="form-select" id="ca-role">
            <option value="moderator">Moderator</option>
            <option value="admin">Admin</option>
          </select>
          <span style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.3rem;display:block">
            ℹ️ Superuser is a singular platform role and cannot be created here.
          </span>
        </div>
        <div class="form-group">
          <label class="form-label">Password <span class="required">*</span></label>
          <input class="form-input" id="ca-password" type="password" placeholder="Min 8 chars, uppercase + number" />
          <span class="form-error"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('create-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="createAdmin()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- EDIT / ACTIONS MODAL (for a specific staff member) -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h3 class="modal-title" id="edit-modal-title">Staff Actions</h3>
        <span class="modal-close" onclick="Modal.close('edit-modal')">✕</span>
      </div>
      <div id="edit-modal-body" style="display:flex;flex-direction:column;gap:0.85rem"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('edit-modal')">Close</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../data/db.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    // navigate() provided globally by utils.js

    function renderAll() {
      const s = getPlatformStats();
      document.getElementById('admin-kpis').innerHTML = [
        { label: 'Admins', val: s.admins, icon: '👑', cls: 'text-cyan' },
        { label: 'Moderators', val: s.moderators, icon: '🛡️', cls: 'text-purple' },
        { label: 'Suspended', val: DB.users.filter(u => ['admin', 'moderator'].includes(u.role) && u.status === 'suspended').length, icon: '⏸', cls: 'text-yellow' },
      ].map(k => `
    <div class="stat-card">
      <div class="label">${k.label}</div>
      <div class="value ${k.cls}">${k.val}</div>
      <div class="icon">${k.icon}</div>
    </div>`).join('');

      const session = Auth.getSession();

      const renderList = (role, containerId, cardClass) => {
        const users = DB.users.filter(u => u.role === role);
        document.getElementById(containerId).innerHTML = users.length ? users.map(u => {
          const isSelf = u.id === session.userId;
          const suspended = u.status === 'suspended';
          return `<div class="admin-card ${cardClass}${suspended ? ' suspended' : ''}">
        ${avatarHTML(u.avatar)}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
            <span style="font-family:'Orbitron',monospace;font-size:0.9rem;font-weight:700">${u.username}</span>
            ${badgeHTML(u.role)}
            ${suspended
              ? '<span class="badge-suspended">⏸ Suspended</span>'
              : '<span class="badge badge-active">🟢 Active</span>'}
            ${isSelf ? '<span class="tag" style="background:rgba(0,212,255,0.12);color:var(--accent-cyan);border-color:rgba(0,212,255,0.3)">You</span>' : ''}
          </div>
          <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:0.25rem;display:flex;gap:1rem;flex-wrap:wrap">
            <span>${u.email}</span>
            <span>Joined ${formatDate(u.joinDate)}</span>
          </div>
        </div>
        ${!isSelf ? `<button class="btn btn-ghost btn-sm" onclick="openEditModal('${u.id}')">⚙️ Actions</button>` : ''}
      </div>`;
        }).join('') : `<div style="color:var(--text-muted);font-size:0.85rem;padding:1rem 0">No accounts in this role.</div>`;
      };

      renderList('admin', 'admin-list', 'admin-card-style');
      renderList('moderator', 'mod-list', 'moderator-card');
    }

    // Open actions modal for a specific staff member
    function openEditModal(id) {
      const u = DB.users.find(u => u.id === id); if (!u) return;
      const suspended = u.status === 'suspended';
      document.getElementById('edit-modal-title').textContent = `⚙️ ${u.username}`;

      let actions = '';

      if (u.role === 'admin') {
        // Admin → can be demoted to Moderator
        actions += `
      <div style="background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:1rem">
        <div style="font-size:0.82rem;font-weight:700;margin-bottom:0.4rem;color:var(--accent-yellow)">⬇️ Demote to Moderator</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:0.75rem">This admin will become a Moderator with reduced privileges.</div>
        <button class="btn btn-yellow w-full" onclick="demoteToModerator('${u.id}')">⬇️ Demote to Moderator</button>
      </div>`;
      }

      // Reason field
      actions += `
      <div style="margin-bottom:0.85rem">
        <label class="form-label">Action Reason (Sent to user) <span class="required">*</span></label>
        <input class="form-input" id="admin-action-reason" placeholder="Required: Explain why this action is taken..."/>
      </div>`;

      // Both admin and moderator can be suspended (not permanently removed)
      if (!suspended) {
        actions += `
      <div style="background:var(--bg-secondary);border:1px solid rgba(245,158,11,0.25);border-radius:var(--radius-md);padding:1rem">
        <div style="font-size:0.82rem;font-weight:700;margin-bottom:0.4rem;color:var(--accent-yellow)">⏸ Suspend Account</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:0.75rem">Temporarily restricts access without permanent removal. Account can be reinstated at any time.</div>
        <button class="btn btn-yellow w-full" onclick="suspendUser('${u.id}')">⏸ Suspend ${u.username}</button>
      </div>`;
      } else {
        actions += `
      <div style="background:var(--bg-secondary);border:1px solid rgba(16,185,129,0.25);border-radius:var(--radius-md);padding:1rem">
        <div style="font-size:0.82rem;font-weight:700;margin-bottom:0.4rem;color:var(--accent-green)">▶️ Revoke Suspension</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:0.75rem">Restore full access for this staff member.</div>
        <button class="btn btn-green w-full" onclick="reinstateUser('${u.id}')">▶️ Revoke Suspension for ${u.username}</button>
      </div>`;
      }

      // Moderators can be promoted to Admin
      if (u.role === 'moderator') {
        actions += `
      <div style="background:var(--bg-secondary);border:1px solid rgba(0,212,255,0.25);border-radius:var(--radius-md);padding:1rem">
        <div style="font-size:0.82rem;font-weight:700;margin-bottom:0.4rem;color:var(--accent-cyan)">⬆️ Promote to Admin</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:0.75rem">Grant this moderator full Admin privileges.</div>
        <button class="btn btn-primary w-full" onclick="promoteToAdmin('${u.id}')">⬆️ Promote to Admin</button>
      </div>`;
      }

      document.getElementById('edit-modal-body').innerHTML = actions;
      Modal.open('edit-modal');
    }

    function demoteToModerator(id) {
      const u = DB.users.find(u => u.id === id); if (!u) return;
      Modal.close('edit-modal');
      setTimeout(() => {
        confirmAction('Demote to Moderator', `Demote ${u.username} from Admin to Moderator?`, () => {
          // Write to the actual DB field — u.role is a read-only computed getter
          const modRole = DB.roles.find(r => r.role_name === 'moderator');
          if (modRole) u.role_id = modRole.role_id;
          Toast.info(`${u.username} demoted to Moderator`);
          renderAll();
        }, 'info');
      }, 100);
    }

    function promoteToAdmin(id) {
      const u = DB.users.find(u => u.id === id); if (!u) return;
      Modal.close('edit-modal');
      setTimeout(() => {
        confirmAction('Promote to Admin', `Promote ${u.username} from Moderator to Admin?`, () => {
          const adminRole = DB.roles.find(r => r.role_name === 'admin');
          if (adminRole) u.role_id = adminRole.role_id;
          Toast.success(`${u.username} promoted to Admin`);
          renderAll();
        }, 'info');
      }, 100);
    }

    function suspendUser(id) {
      const u = DB.users.find(u => u.id === id); if (!u) return;
      const reasonEl = document.getElementById('admin-action-reason');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) { Toast.error('Action Reason is required.'); return; }
      const s = Auth.getSession();
      Modal.close('edit-modal');
      setTimeout(() => {
        confirmAction('Suspend Account', `Suspend ${u.username}? They will lose platform access until reinstated.`, () => {
          u.status = 'suspended';
          dispatchUserNotification(u.username, s.role, s.username, `Your staff account has been suspended. Reason: ${reason}`);
          DB.save();
          Toast.warning(`${u.username} suspended`);
          renderAll();
        }, 'danger');
      }, 100);
    }

    function reinstateUser(id) {
      const u = DB.users.find(u => u.id === id); if (!u) return;
      const reasonEl = document.getElementById('admin-action-reason');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) { Toast.error('Action Reason is required.'); return; }
      const s = Auth.getSession();
      u.status = 'active';
      dispatchUserNotification(u.username, s.role, s.username, `Your staff account suspension has been revoked. Note: ${reason}`);
      DB.save();
      Toast.success(`${u.username} suspension revoked`);
      Modal.close('edit-modal');
      renderAll();
    }

    function openCreateModal() {
      ['ca-username', 'ca-email', 'ca-password'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('ca-role').value = 'moderator';
      Modal.open('create-modal');
    }

    function createAdmin() {
      const uEl = document.getElementById('ca-username');
      const eEl = document.getElementById('ca-email');
      const pEl = document.getElementById('ca-password');
      if (!Validate.form([
        { el: uEl, rules: [{ type: 'required' }, { type: 'minLen', n: 3 }, { type: 'maxLen', n: 20 }] },
        { el: eEl, rules: [{ type: 'required' }, { type: 'email' }] },
        { el: pEl, rules: [{ type: 'required' }, { type: 'password' }] }
      ])) return;

      const username = uEl.value.trim(), email = eEl.value.trim();
      const role = document.getElementById('ca-role').value;

      // Safety guard — superuser cannot be created here
      if (role === 'superuser') {
        Toast.error('Superuser is a singular role and cannot be created here.'); return;
      }

      if (DB.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        Validate.field(uEl, [{ type: 'custom', fn: () => false, msg: 'Username already taken' }]); return;
      }
      if (DB.users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
        Validate.field(eEl, [{ type: 'custom', fn: () => false, msg: 'Email already registered' }]); return;
      }

      const numId = Date.now();
      const roleMap = { 'player': 4, 'publisher': 5, 'moderator': 3, 'admin': 2, 'superuser': 1 };
      DB.users.push({
        user_id: numId, user_name: username, role_id: roleMap[role] || 3,
        email, status: 'active',
        password: pEl.value,
        avatar: username.slice(0, 2).toUpperCase(),
        joinDate: new Date().toISOString().slice(0, 10),
        lastSeen: new Date().toISOString().slice(0, 10)
      });
      DB.save();
      Toast.success(`${capitalize(role)} account "${username}" created`);
      Modal.close('create-modal');
      window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.requireAuth(['superuser']);
      if (!session) return;
      buildNavbar('superuser', 'admins');
      renderAll();
    });
  </script>
</body>

</html>
