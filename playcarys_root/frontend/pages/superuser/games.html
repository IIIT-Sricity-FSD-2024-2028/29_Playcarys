<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PlayCarys — Superuser · Games</title>
  <link rel="stylesheet" href="../../css/variables.css" />
</head>

<body>
  <div id="navbar" class="navbar"></div>
  <div class="page-wrapper">
    <div class="page-content">

      <div class="page-header-row">
        <div>
          <h1>🎮 Game Control</h1>
          <p class="text-muted">Approve, reject, enable, disable or permanently delete any game on the platform</p>
        </div>
        <select class="form-select" id="status-filter" onchange="renderGames()" style="width:160px">
          <option value="">All Status</option>
          <option value="approved">Approved</option>
          <option value="pending">Pending</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <!-- KPIs -->
      <div class="stats-grid stats-grid-4 mt-2" id="game-kpis"></div>

      <!-- Games Table -->
      <div class="card mt-3" style="padding:0;overflow:hidden">
        <div
          style="padding:1rem 1.25rem;border-bottom:1px solid var(--border-primary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
          <div class="search-wrap" style="max-width:260px">
            <span class="search-icon">🔍</span>
            <input class="form-input" id="search" placeholder="Search games..." oninput="renderGames()" />
          </div>
          <select class="form-select" id="genre-filter" onchange="renderGames()" style="width:150px">
            <option value="">All Genres</option>
            <option value="Battle Royale">Battle Royale</option>
            <option value="Strategy">Strategy</option>
            <option value="Racing">Racing</option>
            <option value="Puzzle">Puzzle</option>
            <option value="FPS">FPS</option>
            <option value="RPG">RPG</option>
            <option value="Horror">Horror</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Game</th>
                <th>Publisher</th>
                <th>Genre</th>
                <th>Status</th>
                <th>Enabled</th>
                <th>Sessions</th>
                <th>Views</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="games-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- GAME DETAIL MODAL -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h3 class="modal-title" id="gm-title">Game Details</h3>
        <span class="modal-close" onclick="Modal.close('game-modal')">✕</span>
      </div>
      <div id="gm-body"></div>
      <div class="modal-footer" id="gm-footer"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../data/db.js"></script>
  <script src="../../data/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    // navigate() provided globally by utils.js

    function renderKPIs() {
      const s = getPlatformStats();
      const disabled = DB.games.filter(g => g.status === 'approved' && !g.enabled).length;
      document.getElementById('game-kpis').innerHTML = [
        { label: 'Total Games', val: DB.games.length, icon: '🎮', cls: 'text-cyan' },
        { label: 'Approved', val: s.approvedGames, icon: '✅', cls: 'text-green' },
        { label: 'Pending Review', val: s.pendingGames, icon: '⏳', cls: 'text-yellow' },
        { label: 'Blacklisted', val: disabled, icon: '⛔', cls: 'text-red' },
      ].map(k => `
    <div class="stat-card">
      <div class="label">${k.label}</div>
      <div class="value ${k.cls}">${k.val}</div>
      <div class="icon">${k.icon}</div>
    </div>`).join('');
    }

    function renderGames() {
      const q = document.getElementById('search').value.toLowerCase();
      const status = document.getElementById('status-filter').value;
      const genre = document.getElementById('genre-filter').value;
      let games = [...DB.games];
      if (q) games = games.filter(g => g.title.toLowerCase().includes(q) || g.publisher.toLowerCase().includes(q));
      if (status) games = games.filter(g => g.status === status);
      if (genre) games = games.filter(g => g.genre === genre);

      document.getElementById('games-tbody').innerHTML = games.length ? games.map(g => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:0.75rem">
          ${getGameIconHTML(g, 0, '40px')}
          <div>
            <div style="font-weight:600;font-size:0.875rem">${g.title}</div>
            <div style="font-size:0.72rem;color:var(--text-secondary)">${g.players} players</div>
          </div>
        </div>
      </td>
      <td style="font-size:0.82rem">${g.publisher}</td>
      <td><span class="tag">${g.genre}</span></td>
      <td>${badgeHTML(g.status)}</td>
      <td>${g.status === 'approved' ? (g.enabled ? badgeHTML('enabled') : badgeHTML('blacklisted')) : '—'}</td>
      <td style="color:var(--accent-cyan);font-weight:600">${g.sessions}</td>
      <td style="color:var(--accent-purple);font-weight:600">${(g.views / 1000 || 0).toFixed(1)}K</td>
      <td>
        <div style="display:flex;gap:0.3rem;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="viewGame('${g.id}')">👁</button>
          ${g.status === 'pending' ? `<button class="btn btn-green btn-sm" onclick="approveGame('${g.id}')">✓</button><button class="btn btn-red btn-sm" onclick="rejectGame('${g.id}')">✕</button>` : ''}
          ${g.status === 'approved' ? `<button class="btn btn-outline btn-sm" onclick="toggleGame('${g.id}')">${g.enabled ? '⛔ Blacklist' : '✅ Enable'}</button>` : ''}
          <button class="btn btn-red btn-sm" onclick="deleteGame('${g.id}')">🗑</button>
        </div>
      </td>
    </tr>`).join('') : `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-secondary)">No games found</td></tr>`;
    }

    function viewGame(id) {
      const g = DB.games.find(g => g.id === id); if (!g) return;
      document.getElementById('gm-title').innerHTML = `
    <div style="display:flex;align-items:center;gap:0.5rem">
      ${getGameIconHTML(g, 0, '32px')}
      <span>${g.title}</span>
    </div>`;
      document.getElementById('gm-body').innerHTML = `
    <div class="detail-grid" style="margin-bottom:1rem">
      <div class="detail-field"><label>Publisher</label><span>${g.publisher}</span></div>
      <div class="detail-field"><label>Genre</label><span>${g.genre}</span></div>
      <div class="detail-field"><label>Players</label><span>${g.players}</span></div>
      <div class="detail-field"><label>Status</label><span>${badgeHTML(g.status)}</span></div>
      <div class="detail-field"><label>Sessions</label><span style="color:var(--accent-cyan)">${g.sessions}</span></div>
      <div class="detail-field"><label>Views</label><span style="color:var(--accent-purple)">${g.views?.toLocaleString() || 0}</span></div>
      <div class="detail-field"><label>Rating</label><span>${g.rating ? '⭐ ' + g.rating : '—'}</span></div>
      <div class="detail-field"><label>Submitted</label><span>${formatDate(g.submittedDate)}</span></div>
    </div>
    <div class="form-group"><label class="form-label">Description</label>
      <div style="background:var(--bg-input);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:0.75rem;font-size:0.875rem">${g.desc}</div>
    </div>`;
      document.getElementById('gm-footer').innerHTML = `
    ${g.status === 'pending' ? `<button class="btn btn-green" onclick="approveGame('${g.id}');Modal.close('game-modal')">✓ Approve</button><button class="btn btn-red" onclick="rejectGame('${g.id}');Modal.close('game-modal')">✕ Reject</button>` : ''}
    ${g.status === 'approved' ? `<button class="btn btn-outline" onclick="toggleGame('${g.id}');Modal.close('game-modal')">${g.enabled ? '⛔ Blacklist' : '✅ Enable'}</button>` : ''}
    <button class="btn btn-ghost" onclick="Modal.close('game-modal')">Close</button>`;
      Modal.open('game-modal');
    }

    function approveGame(id) {
      const g = DB.games.find(g => g.id === id);
      g.status = 'approved'; g.enabled = true;
      Toast.success(`"${g.title}" approved`);
      renderKPIs(); renderGames();
    }

    function rejectGame(id) {
      const g = DB.games.find(g => g.id === id);
      confirmAction('Reject Game', `Reject "${g.title}"?`, () => {
        g.status = 'rejected';
        Toast.info(`"${g.title}" rejected`);
        renderKPIs(); renderGames();
      });
    }

    function toggleGame(id) {
      const g = DB.games.find(g => g.id === id);
      g.enabled = !g.enabled;
      Toast.info(`"${g.title}" ${g.enabled ? 'enabled' : 'blacklisted'}`);
      renderKPIs(); renderGames();
    }

    function deleteGame(id) {
      const g = DB.games.find(g => g.id === id);
      confirmAction('Delete Game', `Permanently delete "${g.title}"?`, () => {
        DB.games.splice(DB.games.findIndex(g => g.id === id), 1);
        Toast.success('Game deleted');
        renderKPIs(); renderGames();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.requireAuth(['superuser']);
      if (!session) return;
      buildNavbar('superuser', 'games');
      renderKPIs();
      renderGames();
    });
  </script>
</body>

</html>
